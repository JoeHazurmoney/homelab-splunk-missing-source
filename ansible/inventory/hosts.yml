# Groups (spec 5.2). Connection settings live in group_vars/ and host_vars/.
# homepc is both a forwarder host and the Splunk server (the wd2l-splunk container runs on it).
all:
  children:
    uf_linux:
      hosts:
        wd2l-logsrv:
        wd2l-recv:
        pi5:
    uf_windows:
      hosts:
        homepc:
    splunk_server:
      hosts:
        homepc:
