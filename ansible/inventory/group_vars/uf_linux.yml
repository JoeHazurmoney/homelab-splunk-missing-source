# The AlmaLinux VMs sit behind Hyper-V's Default Switch NAT, and <vm>.mshome.net resolves on HOMEPC
# only, so the Pi jumps through HOMEPC's sshd (spec 5.1). This is ProxyJump written out as a
# ProxyCommand: options given to ssh on the command line (the Ansible key, accept-new) do not apply
# to a ProxyJump hop, and this keeps the whole hop in the inventory instead of in ~/.ssh/config.
ansible_user: taylorb
ansible_ssh_common_args: >-
  -o ProxyCommand="ssh -i ~/.ssh/id_ecdsa_homelab_ansible -o IdentitiesOnly=yes -o BatchMode=yes
  -o StrictHostKeyChecking=accept-new -W %h:%p
  {{ hostvars['homepc']['ansible_user'] }}@{{ hostvars['homepc']['ansible_host'] }}"
