# Agentless syslog devices (spec 5.2). Ansible never logs in to them. Each gets its own Cribl syslog
# source on its own UDP port, and Cribl names the host from the port (Docker Desktop's NAT hides the
# sender's address, spike 14.7 d). `expected` turns each row into an expected entity (task 10), and
# pi5's hl-devprobe pings each ip (task 8).
syslog_devices:
  - name: udm
    ip: 192.168.1.1
    port: 5514
    index: network
    sourcetype: "unifi:syslog"
    source: "syslog:udm"
    profile: sporadic
    criticality: 2

# What reaches Splunk over wd2l (spec 4.4 "existing" row): one row per real enclave1 host/sourcetype
# pair, found with `| tstats count where index=enclave1 earliest=-24h by host sourcetype`. HEC, not
# through Cribl, so no via=cribl. The expected tag turns each into a row (task 10).
dh_extra_expected:
  - {level: sourcetype, index: enclave1, host: pi5, sourcetype: syslog, collection: hec,
     via: wd2l-recv, profile: continuous, criticality: 3}
  - {level: sourcetype, index: enclave1, host: wd2l-logsrv, sourcetype: syslog, collection: hec,
     via: wd2l-recv, profile: continuous, criticality: 3}
