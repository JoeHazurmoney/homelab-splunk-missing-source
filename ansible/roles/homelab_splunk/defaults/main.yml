# homelab_splunk defaults. meta/argument_specs.yml documents and validates every variable here.

# --- Where forwarders send (spec 5.2, 5.5): Cribl on HOMEPC. uf_windows overrides it with 127.0.0.1. ---
hl_collector: 192.168.1.27
hl_s2s_port: 9997
# The old S2S token during a rotation (spec 13): set in the vault for expand and migrate, removed
# for contract. Splunk and Cribl then accept both tokens; empty renders exactly a normal run's files.
vault_hl_s2s_token_previous: ""

# --- The Universal Forwarder (spec 5.3 install/uninstall, 14.3 packages) ---
hl_uf_version: 10.6.1.1
hl_uf_build: b2ae2962645c
hl_uf_home: /opt/splunkforwarder
hl_uf_user: splunkfwd
# Packages live in ansible/files/packages/ on the controller (gitignored; --tags download fetches them)
hl_uf_packages_dir: "{{ playbook_dir }}/files/packages"
hl_uf_packages:
  x86_64:
    file: splunkforwarder-10.6.1.1-b2ae2962645c.x86_64.rpm
    url: https://download.splunk.com/products/universalforwarder/releases/10.6.1.1/linux/splunkforwarder-10.6.1.1-b2ae2962645c.x86_64.rpm
    sha256: 3ffe3856b1bcaa856c28124f49bd9c47cb81b228506119aa14ced8ec1c52550d
  aarch64:
    file: splunkforwarder-10.6.1.1-b2ae2962645c.aarch64.rpm
    url: https://download.splunk.com/products/universalforwarder/releases/10.6.1.1/linux/splunkforwarder-10.6.1.1-b2ae2962645c.aarch64.rpm
    sha256: e04df34fe113e463e608d5d6ca0d828d8cfcc0e747e5dda0c056cdc47becc1b3
  windows:
    file: splunkforwarder-10.6.1.1-b2ae2962645c-windows-x64.msi
    url: https://download.splunk.com/products/universalforwarder/releases/10.6.1.1/windows/splunkforwarder-10.6.1.1-b2ae2962645c-windows-x64.msi
    sha256: 3a42233e387dc28d9e9ecc4c9dc41f184a006862762aa9213f7cd3cc97145a03
# Management port (spec 5.3): meant to avoid the container's 8089 on HOMEPC. The Linux UF in the
# spike listened on its Unix socket only, so the role talks to it through the CLI.
hl_uf_mgmt: 127.0.0.1:8090
# The role's state and install baselines on Linux hosts (spec 5.2, 5.6)
hl_linux_state_dir: /var/lib/hl_splunk
# Packages the UF needs (TA_nix cpu/vmstat use sar/mpstat); removed on uninstall only if the role added them
hl_uf_linux_packages: [sysstat]
# How long install/start wait for the UF to connect to Cribl and for its _internal in Splunk
hl_uf_connect_timeout: 180
# uninstall: accept a contract without the install baselines (they are missing although the state file
# records an install, e.g. deleted by hand); the play refuses otherwise
hl_uninstall_without_baseline: false
# uninstall: accept unit files that appeared while the UF was installed (listed, not removed),
# when they belong to something else
hl_uninstall_accept_new_units: false

# --- Expectation metadata (spec 7.2 dh_expected). Set per group or host. ---
hl_owner: taylorb
hl_site: home
hl_host_criticality: 2        # 1 = most critical ... 4; DH Alert missing fires for <= 2

# --- Input toggles (spec 5.3 "turn off receipt" and 5.2 host/group overrides) ---
# Stanzas listed here are neither rendered nor expected, e.g.
#   -e '{"hl_disabled_inputs":["monitor:///var/log/secure"]}' --tags apps
hl_disabled_inputs: []
# Per-stanza overrides merged over a row below: any of profile, criticality, enabled, track_source,
# plus max_gap_secs (a declared threshold, spec 7.4), e.g.
#   hl_input_overrides: {"monitor:///var/log/cron": {profile: sporadic, criticality: 4}}
hl_input_overrides: {}

# --- Splunk server (splunk_server: spec 5.3 server/server_remove/server_network, 5.5, 6.1) ---
hl_splunk_container: wd2l-splunk
hl_splunk_home: /opt/splunk
# Read on HOMEPC at the moment of each REST call, never copied (spec 5.2)
hl_splunk_admin_password_file: 'C:\Users\taylo\wd2l-splunk\secrets\splunk-admin-password'
hl_splunk_mgmt_url: https://127.0.0.1:8089
hl_splunk_hec_url: https://127.0.0.1:8088
# The server apps, in deploy order. seed_lookups are shipped once and then left to whoever rewrites
# them (the Manage form, DH Prune, the `expected` tag); templates are rendered from the role's
# templates/server_apps/<app>/<path>.j2 into the app (tokens from the vault).
hl_server_apps_src: "{{ playbook_dir }}/../splunk/apps"
hl_server_apps:
  - name: hl_server_base
    seed_lookups: [hl_ingest_block.csv]
    templates: [default/inputs.conf]
  - name: hl_data_health
    seed_lookups: [dh_expected_ansible.csv]
# Limit server, server_remove and apps_remove to these apps; [] = all
hl_apps_only: []
# A change to one of these files restarts splunkd; anything else is reloaded over REST.
# web.conf has no REST reload (hl_server_base's dashboard risky-command setting, spec 7.8).
hl_server_restart_confs: [indexes.conf, inputs.conf, props.conf, web.conf]
# Restart splunkd even when nothing changed (the restart-loss test, docs/handoff/task-3b-cribl.md)
hl_server_force_restart: false
hl_server_reload_endpoints:
  - apps/local
  - admin/conf-collections
  - admin/macros
  - admin/conf-macros
  - saved/searches
  - admin/conf-savedsearches
  - data/transforms/lookups
  - admin/conf-transforms
  - data/ui/views
  - data/ui/nav
  - authentication/providers/services   # reloads authorize.conf (roles)
  - admin/conf-authorize
# server_remove: also delete the removed indexes' data on disk
hl_purge_index_data: false
# Docker network Cribl reaches splunktcp on (spec 4.3: 9997 is not published)
hl_net_name: hl-net
# Container-side staging directory (root-only, removed after each run)
hl_server_container_stage: /tmp/hl_server_stage
# wd2l must keep working: its HEC, its dashboard and its data (spec 5.6)
hl_wd2l_app: wd2l
hl_wd2l_dashboard: wd2l_state_of_health
hl_server_wd2l_indexes: [enclave1, wd2l]
hl_server_wd2l_max_age: 300          # seconds; wd2l's newest health record must be younger
hl_server_health_timeout: 300        # seconds to wait for HEC and wd2l data after a change
# The role's state file on Windows hosts (spec 5.2), shared by the server and UF parts
hl_win_state_file: 'C:\ProgramData\hl_splunk\state.json'

# --- Cribl Stream (splunk_server: spec 5.3 cribl/cribl_remove/cribl_block, 6.2, spike 14.7) ---
# cribl/cribl:4.20.4, the multi-arch index digest. Docker Desktop over SSH has no credential
# store, so the role never pulls: Taylor pulls this once in a desktop session (the play says so).
hl_cribl_image: cribl/cribl@sha256:cb2b2e32933e492f439b5825b0c36f420df2fa986fe36d5f31fce6755190eb71
hl_cribl_container: cribl
hl_cribl_project: hl-cribl            # docker compose project name
hl_cribl_volume: hl-cribl-data
hl_cribl_volume_dir: /opt/cribl/config-volume
# Where the role renders compose.yml on HOMEPC (no secrets in it)
hl_cribl_compose_dir: 'C:\ProgramData\hl_splunk\cribl'
hl_cribl_s2s_port: 9997               # published on all interfaces (the UFs)
hl_cribl_api_port: 9000               # published on 127.0.0.1 only
hl_cribl_api_url: "http://127.0.0.1:{{ hl_cribl_api_port }}/api/v1"
# The repo's Cribl config tree (spec 5.2), rendered on the controller
hl_cribl_src: "{{ playbook_dir }}/../cribl"
# The files under hl_cribl_src/local/cribl the role writes into $CRIBL_VOLUME_DIR/local/cribl
hl_cribl_config_files:
  - inputs.yml
  - outputs.yml
  - cribl.yml
  - breakers.yml
  - pipelines/route.yml
  - pipelines/pl_test_block/conf.yml
  - pipelines/pl_syslog_pre/conf.yml
hl_cribl_health_timeout: 180          # seconds to wait for Cribl's /health and its data in Splunk
# After a config change (or the first install), send one UDP syslog line to each device port and
# wait for it in Splunk with the device's host/index/sourcetype. It briefly makes the device look
# alive to data health, so it runs only when something changed.
hl_cribl_selftest: true
# Hold Cribl around a splunkd restart (server tag): docker pause cribl, restart splunkd, wait for
# splunktcp to accept connections, unpause. The UFs keep their unACKed data (useACK); UDP sent
# meanwhile is lost. On, because it is the only option that lost nothing: task 4 check 15 (spec
# 13, 14.10) lost 3 s of a 1/s sequence with maxS2Sversion v4 alone and none with the hold.
hl_cribl_hold_on_splunk_restart: true
# cribl_block (never): set or clear one test block, e.g.
#   --tags cribl_block -e hl_block_key='wd2l-recv|linux_secure|*' -e hl_block_minutes=30 -e hl_block_reason='E2E row 4'
#   --tags cribl_block -e hl_block_key='wd2l-recv|linux_secure|*' -e hl_block_clear=true
hl_block_key: ""
hl_block_minutes: 60
hl_block_reason: ""
hl_block_clear: false
hl_block_max_minutes: 1440            # a block longer than a day is refused

# --- Ansible maintenance markers (spec 5.3 Markers): HEC token hl_markers, posted from the controller ---
hl_marker_hec_url: https://192.168.1.27:8088/services/collector/event
# wd2l-splunk's HEC certificate is self-signed (LAN only)
hl_marker_validate_certs: false

# --- Syslog devices (set in group_vars/splunk_server.yml): one Cribl syslog source per device ---
syslog_devices: []

# --- The shared input schema (spec 4). Forwarder apps (task 6) and the expected list (task 10)
# are both rendered from these rows, so an enabled input always has an expectation.
#   stanza        inputs.conf stanza, exactly as written in the app's local/inputs.conf
#   app           the app whose local/inputs.conf carries the stanza
#   index, sourcetype, source   what the events carry; source is the normalized form (dh_source_norm)
#   interval      seconds, scripted and perfmon inputs only (periodic threshold = 2 x interval + 60)
#   profile       heartbeat | periodic | continuous | sporadic | info (spec 7.4)
#   criticality   1 (most critical) .. 4
#   enabled       false keeps the row documented but neither rendered nor expected
#   track_source  also expect each source (level=source), not only the sourcetype
#   hosts         optional: only these inventory hosts get the input (and its expectation)

# wd2l's audit sourcetype differs per host (host_vars); hosts without wd2l disable its stanza.
hl_wd2l_audit_sourcetype: "wd2l:audit"

hl_linux_inputs:
  # File monitors (app hl_uf_linux_inputs)
  - {stanza: "monitor:///var/log/messages", app: hl_uf_linux_inputs, index: linux, sourcetype: syslog,
     source: /var/log/messages, profile: continuous, criticality: 2, enabled: true, track_source: true}
  - {stanza: "monitor:///var/log/cron", app: hl_uf_linux_inputs, index: linux, sourcetype: syslog,
     source: /var/log/cron, profile: sporadic, criticality: 3, enabled: true, track_source: true}
  - {stanza: "monitor:///var/log/secure", app: hl_uf_linux_inputs, index: linux, sourcetype: linux_secure,
     source: /var/log/secure, profile: sporadic, criticality: 1, enabled: true, track_source: false}
  - {stanza: "monitor:///var/log/audit/audit.log", app: hl_uf_linux_inputs, index: linux, sourcetype: linux_audit,
     source: /var/log/audit/audit.log, profile: continuous, criticality: 1, enabled: true, track_source: false}
  # wd2l's own audit trail (app hl_uf_wd2l_inputs); readable by wd2l_auditor + admin only
  - {stanza: "monitor:///var/log/wd2l/audit-*.jsonl", app: hl_uf_wd2l_inputs, index: wd2l_uf_audit,
     sourcetype: "{{ hl_wd2l_audit_sourcetype }}", source: "/var/log/wd2l/audit-*.jsonl", profile: sporadic,
     criticality: 2, enabled: true, track_source: false}
  # Splunk_TA_nix 10.3.4 scripted inputs (event versions, not *_metric); sourcetype, source and
  # interval as the TA's default/inputs.conf sets them
  - {stanza: "script://./bin/cpu.sh", app: Splunk_TA_nix, index: linux, sourcetype: cpu,
     source: cpu, interval: 30, profile: periodic, criticality: 3, enabled: true, track_source: false}
  - {stanza: "script://./bin/ps.sh", app: Splunk_TA_nix, index: linux, sourcetype: ps,
     source: ps, interval: 30, profile: periodic, criticality: 3, enabled: true, track_source: false}
  - {stanza: "script://./bin/vmstat.sh", app: Splunk_TA_nix, index: linux, sourcetype: vmstat,
     source: vmstat, interval: 60, profile: periodic, criticality: 3, enabled: true, track_source: false}
  - {stanza: "script://./bin/top.sh", app: Splunk_TA_nix, index: linux, sourcetype: top,
     source: top, interval: 60, profile: periodic, criticality: 3, enabled: true, track_source: false}
  - {stanza: "script://./bin/interfaces.sh", app: Splunk_TA_nix, index: linux, sourcetype: interfaces,
     source: interfaces, interval: 60, profile: periodic, criticality: 3, enabled: true, track_source: false}
  - {stanza: "script://./bin/netstat.sh", app: Splunk_TA_nix, index: linux, sourcetype: netstat,
     source: netstat, interval: 60, profile: periodic, criticality: 3, enabled: true, track_source: false}
  - {stanza: "script://./bin/df.sh", app: Splunk_TA_nix, index: linux, sourcetype: df,
     source: df, interval: 300, profile: periodic, criticality: 3, enabled: true, track_source: false}
  - {stanza: "script://./bin/openPorts.sh", app: Splunk_TA_nix, index: linux, sourcetype: openPorts,
     source: openPorts, interval: 300, profile: periodic, criticality: 3, enabled: true, track_source: false}
  - {stanza: "script://./bin/lastlog.sh", app: Splunk_TA_nix, index: linux, sourcetype: lastlog,
     source: lastlog, interval: 300, profile: periodic, criticality: 3, enabled: true, track_source: false}
  - {stanza: "script://./bin/package.sh", app: Splunk_TA_nix, index: linux, sourcetype: package,
     source: package, interval: 3600, profile: periodic, criticality: 4, enabled: true, track_source: false}
  - {stanza: "script://./bin/service.sh", app: Splunk_TA_nix, index: linux, sourcetype: "Unix:Service",
     source: "Unix:Service", interval: 3600, profile: periodic, criticality: 4, enabled: true, track_source: false}
  - {stanza: "script://./bin/selinuxChecker.sh", app: Splunk_TA_nix, index: linux, sourcetype: "Linux:SELinuxConfig",
     source: "Linux:SELinuxConfig", interval: 3600, profile: periodic, criticality: 4, enabled: true, track_source: false}
  - {stanza: "script://./bin/sshdChecker.sh", app: Splunk_TA_nix, index: linux, sourcetype: "Unix:SSHDConfig",
     source: "Unix:SSHDConfig", interval: 3600, profile: periodic, criticality: 4, enabled: true, track_source: false}
  - {stanza: "script://./bin/passwd.sh", app: Splunk_TA_nix, index: linux, sourcetype: "Unix:UserAccounts",
     source: "Unix:UserAccounts", interval: 3600, profile: periodic, criticality: 4, enabled: true, track_source: false}
  - {stanza: "script://./bin/uptime.sh", app: Splunk_TA_nix, index: linux, sourcetype: "Unix:Uptime",
     source: "Unix:Uptime", interval: 86400, profile: periodic, criticality: 4, enabled: true, track_source: false}
  - {stanza: "script://./bin/version.sh", app: Splunk_TA_nix, index: linux, sourcetype: "Unix:Version",
     source: "Unix:Version", interval: 86400, profile: periodic, criticality: 4, enabled: true, track_source: false}

  # pi5 only: the device probe's file (task 8 writes it)
  - {stanza: "monitor:///var/log/hl-devprobe/probe.log", app: hl_uf_linux_inputs, index: network, sourcetype: "hl:devprobe",
     source: /var/log/hl-devprobe/probe.log, interval: 60, profile: periodic, criticality: 2, enabled: true, track_source: false,
     hosts: [pi5]}

hl_windows_inputs:
  # Event log channels (app hl_uf_windows_inputs), renderXml=true, so sourcetype XmlWinEventLog and
  # source XmlWinEventLog:<channel>; all channels share the sourcetype, so each is tracked by source.
  # Channel names as listed by `wevtutil el` on HOMEPC (2026-10-30).
  - {stanza: "WinEventLog://Security", app: hl_uf_windows_inputs, index: windows, sourcetype: XmlWinEventLog,
     source: "XmlWinEventLog:Security", profile: continuous, criticality: 1, enabled: true, track_source: true}
  - {stanza: "WinEventLog://System", app: hl_uf_windows_inputs, index: windows, sourcetype: XmlWinEventLog,
     source: "XmlWinEventLog:System", profile: sporadic, criticality: 2, enabled: true, track_source: true}
  - {stanza: "WinEventLog://Application", app: hl_uf_windows_inputs, index: windows, sourcetype: XmlWinEventLog,
     source: "XmlWinEventLog:Application", profile: sporadic, criticality: 3, enabled: true, track_source: true}
  - {stanza: "WinEventLog://Microsoft-Windows-PowerShell/Operational", app: hl_uf_windows_inputs, index: windows,
     sourcetype: XmlWinEventLog, source: "XmlWinEventLog:Microsoft-Windows-PowerShell/Operational",
     profile: sporadic, criticality: 2, enabled: true, track_source: true}
  - {stanza: "WinEventLog://Microsoft-Windows-Windows Defender/Operational", app: hl_uf_windows_inputs, index: windows,
     sourcetype: XmlWinEventLog, source: "XmlWinEventLog:Microsoft-Windows-Windows Defender/Operational",
     profile: sporadic, criticality: 2, enabled: true, track_source: true}
  - {stanza: "WinEventLog://Microsoft-Windows-Hyper-V-VMMS-Admin", app: hl_uf_windows_inputs, index: windows,
     sourcetype: XmlWinEventLog, source: "XmlWinEventLog:Microsoft-Windows-Hyper-V-VMMS-Admin",
     profile: sporadic, criticality: 3, enabled: true, track_source: true}
  - {stanza: "WinEventLog://Microsoft-Windows-Hyper-V-Worker-Admin", app: hl_uf_windows_inputs, index: windows,
     sourcetype: XmlWinEventLog, source: "XmlWinEventLog:Microsoft-Windows-Hyper-V-Worker-Admin",
     profile: sporadic, criticality: 3, enabled: true, track_source: true}
  # Splunk_TA_windows 11.0.3 perfmon stanzas, enabled in its local/inputs.conf at 60 s. The TA's
  # mode = multikv makes them PerfmonMk:<stanza>: one event per collection, one result per instance.
  - {stanza: "perfmon://CPU", app: Splunk_TA_windows, index: windows, sourcetype: "PerfmonMk:CPU",
     source: "PerfmonMk:CPU", interval: 60, profile: periodic, criticality: 3, enabled: true, track_source: false}
  - {stanza: "perfmon://Memory", app: Splunk_TA_windows, index: windows, sourcetype: "PerfmonMk:Memory",
     source: "PerfmonMk:Memory", interval: 60, profile: periodic, criticality: 3, enabled: true, track_source: false}

# The Splunk server host (REST searches are delegated to it)
hl_server_host: homepc
# Syscall ABIs each audit rule is written for (b32 and b64, like wd2l's). If pi5's aarch64 kernel
# rejects arch=b32, set [b64] in host_vars/pi5.yml (task 4 check 3).
hl_audit_arches: [b32, b64]

# --- The Windows UF (spec 5.3, 5.6 Windows contract) ---
hl_uf_win_home: 'C:\Program Files\SplunkUniversalForwarder'
hl_uf_win_service: SplunkForwarder
# The MSI runs the UF as this virtual account (least privilege, UF 9.1+)
hl_uf_win_account: 'NT SERVICE\SplunkForwarder'
# Local groups the virtual account joins (by SID, so the names' language doesn't matter)
hl_uf_win_groups:
  - {sid: S-1-5-32-573, name: Event Log Readers}
  - {sid: S-1-5-32-558, name: Performance Monitor Users}
# The role's folder on Windows (state file, auditpol backup, MSI log)
hl_win_state_dir: 'C:\ProgramData\hl_splunk'

# --- Windows audit policy (spec 5.3 audit_policy): the focused subset, by subcategory GUID ---
hl_audit_policy:
  - {name: Logon, guid: "{0CCE9215-69AE-11D9-BED3-505054503030}", success: true, failure: true}
  - {name: Logoff, guid: "{0CCE9216-69AE-11D9-BED3-505054503030}", success: true, failure: false}
  - {name: Special Logon, guid: "{0CCE921B-69AE-11D9-BED3-505054503030}", success: true, failure: false}
  - {name: Account Lockout, guid: "{0CCE9217-69AE-11D9-BED3-505054503030}", success: false, failure: true}
  - {name: Other Logon/Logoff Events, guid: "{0CCE921C-69AE-11D9-BED3-505054503030}", success: true, failure: true}
  - {name: Group Membership, guid: "{0CCE9249-69AE-11D9-BED3-505054503030}", success: true, failure: false}
  - {name: User Account Management, guid: "{0CCE9235-69AE-11D9-BED3-505054503030}", success: true, failure: true}
  - {name: Security Group Management, guid: "{0CCE9237-69AE-11D9-BED3-505054503030}", success: true, failure: true}
  - {name: Computer Account Management, guid: "{0CCE9236-69AE-11D9-BED3-505054503030}", success: true, failure: true}
  - {name: Other Account Management Events, guid: "{0CCE923A-69AE-11D9-BED3-505054503030}", success: true, failure: true}
  - {name: Audit Policy Change, guid: "{0CCE922F-69AE-11D9-BED3-505054503030}", success: true, failure: true}
  - {name: Authentication Policy Change, guid: "{0CCE9230-69AE-11D9-BED3-505054503030}", success: true, failure: false}
  - {name: Security System Extension, guid: "{0CCE9211-69AE-11D9-BED3-505054503030}", success: true, failure: true}
  - {name: System Integrity, guid: "{0CCE9212-69AE-11D9-BED3-505054503030}", success: true, failure: true}
  # No command line: ProcessCreationIncludeCmdLine_Enabled is left alone (spec 5.3)
  - {name: Process Creation, guid: "{0CCE922B-69AE-11D9-BED3-505054503030}", success: true, failure: false}

# --- Forwarder apps (spec 5.5; task 6). The TAs are deployed unmodified; the role owns only their
# local/inputs.conf. The .spl packages go in ansible/files/packages/ on the controller (gitignored).
hl_tas:
  Splunk_TA_nix:
    version: 10.3.4
    file: splunk-add-on-for-unix-and-linux_1034.spl
    sha256: 9bfb2061b55961841d5babba04ead35509730dc73a7b6bfbc676a7216e7f1ca2
  Splunk_TA_windows:
    version: 11.0.3
    file: splunk-add-on-for-microsoft-windows_1103.spl
    sha256: 2fd0384376afe6993c7c6df49ab9a5e8b44fe0e38c4517a41f550f42fa051fa6
# The role-owned input apps; every stanza is written to the app's local/inputs.conf, because local/
# beats every app's default/ (Splunk_TA_windows sorts before hl_uf_windows_inputs, and its default
# stanzas say disabled = 1).
hl_uf_input_apps_linux: [hl_uf_linux_inputs, hl_uf_wd2l_inputs]
hl_uf_input_apps_windows: [hl_uf_windows_inputs]

# --- STIG audit rules (spec 5.3 audit_rules; uf_linux) ---
hl_stig_rules_src: /usr/share/audit-rules/30-stig.rules
hl_stig_privileged_src: /usr/share/audit-rules/31-privileged.rules
# Must sort last under `ls -1v` (augenrules' sort), after zz-hl-uf-tamper.rules. `zzz-` would NOT:
# ls -v puts punctuation after letters, so zzz-* sorts before zz-*. Why last: tasks/audit_rules.yml.
hl_stig_rules_file: /etc/audit/rules.d/zz-hl-zz-stig.rules
# ERE for the STIG rules in `auditctl -l` (its 12 keys + the generated rules' key). Uninstall's
# compare ignores them, and audit_rules counts them, so a new key in the rules must be added here.
hl_stig_key_re: "(-F key=|-k )(system-locale|identity|time-change|session|perm_mod|logins|maybe-escalation|actions|access|export|delete|MAC-policy|privileged)$"
# STIG's -e 2 makes every later rule change need a reboot; it is never set (spec 5.3)
hl_audit_immutable: false

# --- The device probe (spec 5.3 probe/probe_remove, 4.4; task 8). Runs on pi5, pings every
# syslog_devices entry (they live in group_vars/splunk_server.yml) and appends one line per ping
# to probe.log, which pi5's UF forwards (network / hl:devprobe). Never through rsyslog or the journal.
hl_probe_host: pi5
hl_probe_interval: 60
hl_probe_dir: /var/log/hl-devprobe

# --- The expected list (spec 2.1, 7.2; task 10) ---
# Extra expected rows Ansible can't derive (e.g. the hosts whose syslog reaches Splunk through wd2l),
# each a dict with the dh_expected_ansible.csv columns, e.g.
#   - {level: sourcetype, index: enclave1, host: wd2l-recv, sourcetype: syslog, collection: hec,
#      via: wd2l-recv, profile: continuous, criticality: 3}
dh_extra_expected: []
# Set false in a host's host_vars after uninstalling its UF: its host row and input rows are no longer
# rendered and the next `expected` run retires them (dh_extra_expected rows naming it stay). True for a
# host that is merely off (spec 5.3 uninstall).
hl_expected: true
# verify: how long to wait for dh_status to hold a non-PENDING answer before reporting "not evaluated" (spec 5.3)
hl_verify_status_wait: 150
