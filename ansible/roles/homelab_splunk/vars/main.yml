# Internal values, not meant to be overridden (defaults/main.yml holds the settings).

# PowerShell prepended to the splunk_server win_shell tasks. The Splunk admin password is read on
# HOMEPC from hl_splunk_admin_password_file at the moment of the call and never leaves the PC
# (spec 5.2): it is not a task argument and it is never printed.
#   Invoke-HlRest -Method GET|POST|DELETE -Path /services/... [-Body @{...}]  -> {Code, Content}
#   Invoke-HlSearch '<SPL>'      -> the result rows (oneshot export, JSON)
#   Get-HlHecHealth              -> {Code, Content} of wd2l HEC /services/collector/health
hl_ps_prelude: |
  $ErrorActionPreference = 'Stop'
  $ProgressPreference = 'SilentlyContinue'
  [Net.ServicePointManager]::SecurityProtocol = [Net.SecurityProtocolType]::Tls12
  # The container's management and HEC certificates are self-signed: accept them on loopback only.
  # A compiled callback, because a PowerShell script block has no runspace on the TLS thread.
  if (-not ('HlTrustLoopback' -as [type])) {
  Add-Type -TypeDefinition @"
  using System.Net;
  using System.Net.Security;
  using System.Security.Cryptography.X509Certificates;
  public static class HlTrustLoopback {
    static bool Check(object sender, X509Certificate cert, X509Chain chain, SslPolicyErrors errors) {
      HttpWebRequest r = sender as HttpWebRequest;
      return errors == SslPolicyErrors.None || (r != null && r.RequestUri.IsLoopback);
    }
    public static void Install() { ServicePointManager.ServerCertificateValidationCallback = Check; }
  }
  "@
  }
  [HlTrustLoopback]::Install()
  $HlMgmt = '{{ hl_splunk_mgmt_url }}'
  $HlHec = '{{ hl_splunk_hec_url }}'
  $HlPassFile = '{{ hl_splunk_admin_password_file }}'
  function Invoke-HlWeb {
    param([string]$Method, [string]$Uri, [hashtable]$Headers = @{}, $Body = $null)
    try {
      $p = @{ UseBasicParsing = $true; Method = $Method; Uri = $Uri; Headers = $Headers; TimeoutSec = 120 }
      if ($null -ne $Body) { $p.Body = $Body }
      $r = Invoke-WebRequest @p
      return [pscustomobject]@{ Code = [int]$r.StatusCode; Content = [string]$r.Content }
    } catch [System.Net.WebException] {
      $resp = $_.Exception.Response
      if ($null -eq $resp) { return [pscustomobject]@{ Code = 0; Content = $_.Exception.Message } }
      $sr = New-Object System.IO.StreamReader($resp.GetResponseStream())
      return [pscustomobject]@{ Code = [int]$resp.StatusCode; Content = $sr.ReadToEnd() }
    }
  }
  function Invoke-HlRest {
    param([string]$Method = 'GET', [string]$Path, $Body = $null)
    $pw = [System.IO.File]::ReadAllText($HlPassFile).Trim()
    $auth = 'Basic ' + [Convert]::ToBase64String([Text.Encoding]::UTF8.GetBytes('admin:' + $pw))
    Remove-Variable pw
    return Invoke-HlWeb -Method $Method -Uri ($HlMgmt + $Path) -Headers @{ Authorization = $auth } -Body $Body
  }
  function Invoke-HlSearch {
    param([string]$Spl)
    $r = Invoke-HlRest -Method POST -Path '/services/search/jobs/export' -Body @{ search = $Spl; output_mode = 'json'; exec_mode = 'oneshot' }
    if ($r.Code -ne 200) { throw "search failed (HTTP $($r.Code)): $($r.Content)" }
    $rows = @()
    foreach ($line in ($r.Content -split "`n")) {
      if ($line.Trim() -eq '') { continue }
      $o = $line | ConvertFrom-Json
      if ($o.PSObject.Properties.Name -contains 'result') { $rows += $o.result }
    }
    return ,$rows
  }
  function Get-HlHecHealth {
    return Invoke-HlWeb -Method GET -Uri ($HlHec + '/services/collector/health')
  }

# PowerShell prepended to the Cribl win_shell tasks (cribl, cribl_block). The Cribl admin password
# arrives in the environment variable HL_CRIBL_PW (the task's `environment`), never in the script
# text, so it is not in the result's `cmd`; Ansible doesn't return the environment in a result (task
# 3b checked its -v logs for the value: none). The password-change task also has no_log.
#   Connect-HlCribl [-Password <pw>]  -> logs in, keeps the bearer token for Invoke-HlCribl ($true/$false)
#   Invoke-HlCribl -Method GET|POST|PATCH|PUT|DELETE -Path /system/... [-Json <object>] [-Raw <string> -ContentType <type>]
#                                     -> {Code, Content}
#   Test-HlCriblLookup <id>           -> $true when Cribl has that lookup
#   Get-HlCriblHealth                 -> {Code, Content} of /api/v1/health (no login)
hl_cribl_ps_prelude: |
  $ErrorActionPreference = 'Stop'
  $ProgressPreference = 'SilentlyContinue'
  $HlCriblApi = '{{ hl_cribl_api_url }}'
  $script:HlCriblToken = $null
  function Invoke-HlCriblWeb {
    param([string]$Method, [string]$Uri, [hashtable]$Headers = @{}, $Body = $null, [string]$ContentType = 'application/json')
    try {
      $p = @{ UseBasicParsing = $true; Method = $Method; Uri = $Uri; Headers = $Headers; TimeoutSec = 60 }
      if ($null -ne $Body) { $p.Body = $Body; $p.ContentType = $ContentType }
      $r = Invoke-WebRequest @p
      return [pscustomobject]@{ Code = [int]$r.StatusCode; Content = [string]$r.Content }
    } catch [System.Net.WebException] {
      $resp = $_.Exception.Response
      if ($null -eq $resp) { return [pscustomobject]@{ Code = 0; Content = $_.Exception.Message } }
      $sr = New-Object System.IO.StreamReader($resp.GetResponseStream())
      return [pscustomobject]@{ Code = [int]$resp.StatusCode; Content = $sr.ReadToEnd() }
    }
  }
  function Connect-HlCribl {
    param([string]$Password = $env:HL_CRIBL_PW)
    $body = @{ username = 'admin'; password = $Password } | ConvertTo-Json -Compress
    $r = Invoke-HlCriblWeb -Method POST -Uri ($HlCriblApi + '/auth/login') -Body $body
    if ($r.Code -ne 200) { return $false }
    $script:HlCriblToken = ($r.Content | ConvertFrom-Json).token
    return $true
  }
  function Invoke-HlCribl {
    param([string]$Method = 'GET', [string]$Path, $Json = $null, [string]$Raw = $null, [string]$ContentType = 'application/json')
    if (-not $script:HlCriblToken) { throw 'Invoke-HlCribl: not logged in (Connect-HlCribl)' }
    $h = @{ Authorization = 'Bearer ' + $script:HlCriblToken }
    $body = $null
    # An omitted [string]$Raw is '' (never $null), and a GET with a body throws: test the binding
    if ($null -ne $Json) { $body = $Json | ConvertTo-Json -Depth 20 -Compress }
    elseif ($PSBoundParameters.ContainsKey('Raw')) { $body = [Text.Encoding]::UTF8.GetBytes($Raw) }
    return Invoke-HlCriblWeb -Method $Method -Uri ($HlCriblApi + $Path) -Headers $h -Body $body -ContentType $ContentType
  }
  # GET /system/lookups/<id> answers 200 with no items for a missing lookup (seen live, task 3b)
  function Test-HlCriblLookup {
    param([string]$Id)
    $r = Invoke-HlCribl -Path "/system/lookups/$Id"
    return ($r.Code -eq 200 -and @(($r.Content | ConvertFrom-Json).items).Count -gt 0)
  }
  function Get-HlCriblHealth {
    return Invoke-HlCriblWeb -Method GET -Uri ($HlCriblApi + '/health')
  }

# During a token rotation (spec 13) in_splunk_tcp accepts both tokens. Merged over the repo's
# inputs.yml (a list replaces the file's list), so the file stays plain YAML for yamllint and an empty
# vault_hl_s2s_token_previous adds nothing: the rendered file is byte for byte a normal run's.
hl_cribl_s2s_token_inputs: "{{ {} if vault_hl_s2s_token_previous | default('') | length == 0 else
  {'in_splunk_tcp': {'authTokens': [{'token': vault_hl_s2s_token, 'description': 'homelab UFs (vault_hl_s2s_token)'},
    {'token': vault_hl_s2s_token_previous, 'description': 'the old token, during a rotation (vault_hl_s2s_token_previous)'}]}} }}"
# A valid S2S token: a UUID, what bootstrap-pi.sh generates (uuid4)
hl_s2s_token_re: '^[0-9a-fA-F]{8}(-[0-9a-fA-F]{4}){3}-[0-9a-fA-F]{12}$'

# One Cribl syslog source per syslog_devices entry, merged into cribl/local/cribl/inputs.yml
hl_cribl_device_inputs: "{{ lookup('ansible.builtin.template', 'cribl/device_inputs.yml.j2') | from_yaml }}"

# Splunk's splunktcp listener inside the container (the image's etc/system/local, spec 5.5), which
# Cribl's out_splunk sends to over hl-net
hl_splunk_tcp_port: 9997

# Splunk's copy of the test-block table (cribl_block mirrors Cribl's table here, spec 7.2)
hl_cribl_mirror_path: "{{ hl_splunk_home }}/etc/apps/hl_server_base/lookups/hl_ingest_block.csv"

# The Linux UF's tamper audit rules (spec 5.4): b32 and b64 forms of each, keyed hl-*
hl_uf_tamper_rules:
  - {kind: dir, path: "{{ hl_uf_home }}/etc", key: hl-uf-config}
  - {kind: dir, path: "{{ hl_uf_home }}/bin", key: hl-uf-config}
  - {kind: path, path: /etc/rsyslog.conf, key: hl-syslog-config}
  - {kind: dir, path: /etc/rsyslog.d, key: hl-syslog-config}
  - {kind: dir, path: /etc/audit, key: hl-audit-config}
hl_uf_tamper_file: /etc/audit/rules.d/zz-hl-uf-tamper.rules
# ERE for these rules and for wd2l's in `auditctl -l`, which prints a syscall rule's key as
# `-F key=<key>` (task 4, audit 4.0.3) and a watch rule's (`-w`) as `-k <key>`
hl_uf_tamper_key_re: "(-F key=|-k )({{ hl_uf_tamper_rules | map(attribute='key') | unique | join('|') }})$"
hl_wd2l_audit_key_re: "(-F key=|-k )wd2l-"
# The script audit_rules and audit_rules_remove read the loaded set with (files/hl_stig_census.sh)
hl_stig_census_cmd: >-
  hl_stig_census.sh {{ hl_stig_key_re | quote }} {{ hl_wd2l_audit_key_re | quote }} {{ hl_uf_tamper_key_re | quote }}
# ERE for the UF's splunkd.log lines that end a connection to Cribl. The UF logs a wrong token as a
# plain "Connection closed by server" (task 4 check 7), the same as a benign close.
hl_uf_close_re: "Invalid S2S token|Connection closed by server|unauthorized"
# The files of hl_uf_outputs (templates/uf/hl_uf_outputs/default/<name>.j2)
hl_uf_outputs_files: [app.conf, outputs.conf, limits.conf, web.conf]
# The UF's CLI. The role runs it only as root, for boot-start (enable/disable), which needs root;
# status, FIPS and the connection are read from systemd, /proc, the rpm and splunkd.log instead.
hl_uf_cli: "{{ hl_uf_home }}/bin/splunk"

# PowerShell for the Windows UF's group memberships and user rights (install, uninstall and its
# contract). Every read error throws, so a check that can't read fails instead of passing
# (task 5 review I1). Get-LocalGroupMember throws on a group that holds an orphaned SID
# (PowerShell #2996), which is the case the uninstall contract exists for, so members are read
# through ADSI (WinNT) and compared by SID.
#   Get-HlGroupMemberSids <group SID>         -> the members' SIDs (strings; wrap the call in @())
#   Remove-HlGroupMember <group SID> <SID>    -> removes it (the cmdlet, else ADSI by SID), then checks
#   Get-HlUserRights <SID[]>                  -> the user rights (Se…) that name any of them (secedit; wrap in @())
hl_win_acct_ps: |
  function Get-HlGroupName {
    param([string]$GroupSid)
    return (New-Object Security.Principal.SecurityIdentifier($GroupSid)).Translate([Security.Principal.NTAccount]).Value.Split('\')[-1]
  }
  function Get-HlGroupMemberSids {
    param([string]$GroupSid)
    $grp = [ADSI]("WinNT://$env:COMPUTERNAME/$(Get-HlGroupName $GroupSid),group")
    $out = @()
    foreach ($m in @($grp.Invoke('Members'))) {
      $b = $m.GetType().InvokeMember('objectSid', 'GetProperty', $null, $m, $null)
      $out += (New-Object Security.Principal.SecurityIdentifier([byte[]]$b, 0)).Value
    }
    return $out
  }
  function Remove-HlGroupMember {
    param([string]$GroupSid, [string]$MemberSid)
    try { Remove-LocalGroupMember -SID $GroupSid -Member $MemberSid -ErrorAction Stop }
    catch { ([ADSI]("WinNT://$env:COMPUTERNAME/$(Get-HlGroupName $GroupSid),group")).Remove("WinNT://$MemberSid") }
    if (@(Get-HlGroupMemberSids $GroupSid) -contains $MemberSid) { throw "$MemberSid is still in $GroupSid after the removal" }
  }
  function Get-HlUserRights {
    param([string[]]$Sids)
    $tmp = Join-Path $env:TEMP ("hl_secedit_" + [guid]::NewGuid() + ".inf")
    try {
      $o = secedit /export /areas USER_RIGHTS /cfg $tmp | Out-String
      if ($LASTEXITCODE -ne 0 -or -not (Test-Path -LiteralPath $tmp)) { throw "secedit /export failed (exit $LASTEXITCODE): $($o.Trim())" }
      $rights = @()
      foreach ($line in (Get-Content -LiteralPath $tmp)) {
        if ($line -match '^(Se\w+)\s*=\s*(.*)$') {
          $name = $Matches[1]; $val = $Matches[2]
          foreach ($s in $Sids) { if ($val -match ('(^|,)\*' + [regex]::Escape($s) + '(,|$)')) { $rights += $name } }
        }
      }
      return @($rights | Sort-Object -Unique)
    } finally { Remove-Item -LiteralPath $tmp -Force -ErrorAction SilentlyContinue }
  }

# This host's inputs after hl_input_overrides, hl_disabled_inputs and the rows' `hosts` (spec 5.2,
# 5.3 "turn off receipt"). The forwarder apps render only the enabled rows; `expected` (task 10)
# applies the same rules per host.
hl_inputs_all: "{{ hl_linux_inputs if 'uf_linux' in group_names else (hl_windows_inputs if 'uf_windows' in group_names else []) }}"
hl_inputs_effective: >-
  {%- set out = [] -%}
  {%- for r in hl_inputs_all -%}
  {%- set r2 = r | combine(hl_input_overrides.get(r.stanza, {})) -%}
  {%- if r2.hosts | default([]) | length == 0 or inventory_hostname in r2.hosts -%}
  {%- set _ = out.append(r2 | combine({'enabled': (r2.enabled | bool) and r2.stanza not in hl_disabled_inputs})) -%}
  {%- endif -%}
  {%- endfor -%}
  {{ out }}
hl_inputs_enabled: "{{ hl_inputs_effective | selectattr('enabled') | list }}"

# The syslog devices the probe pings, from the Splunk server's group_vars (pi5 isn't in that group)
hl_probe_devices: "{{ hostvars[groups['splunk_server'][0]]['syslog_devices'] | default([]) }}"
# Everything the probe installs on pi5 (probe.log's folder is hl_probe_dir), one list for install,
# the state record and removal.
hl_probe_files:
  - {src: hl-devprobe.sh.j2, dest: /usr/local/libexec/hl-devprobe, mode: "0755"}
  - {src: hl-devprobe.service.j2, dest: /etc/systemd/system/hl-devprobe.service, mode: "0644"}
  - {src: hl-devprobe.timer.j2, dest: /etc/systemd/system/hl-devprobe.timer, mode: "0644"}
  - {src: hl-devprobe.logrotate.j2, dest: /etc/logrotate.d/hl-devprobe, mode: "0644"}
