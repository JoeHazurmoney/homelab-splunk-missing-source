argument_specs:
  main:
    short_description: Splunk UFs, TAs, auditing, the syslog relay and the data-health apps for the homelab
    description:
      - One role for every managed group (uf_linux, uf_windows, splunk_server, syslog_relay); tags select the
        component (spec 5.3). A bare run deploys; removing, stopping and restarting need their tag.
      - Defaults are in defaults/main.yml. Ansible validates the provided values against this spec before the role runs.
    options:
      splunk_indexer:
        type: str
        default: 192.168.1.27
        description: Address the forwarders send S2S to (127.0.0.1 on HOMEPC itself).
      hl_s2s_port:
        type: int
        default: 9997
        description: S2S receiving port on the Splunk container.
      hl_owner:
        type: str
        default: taylorb
        description: Owner column of the host's expected rows.
      hl_site:
        type: str
        default: home
        description: Site column of the host's expected rows.
      hl_host_criticality:
        type: int
        choices: [1, 2, 3, 4]
        default: 2
        description: Criticality of the host-level (heartbeat) row; 1 is the most critical.
      hl_disabled_inputs:
        type: list
        elements: str
        default: []
        description: Input stanzas to leave out of the forwarder apps and the expected list.
      hl_input_overrides:
        type: dict
        default: {}
        description:
          - Per-stanza overrides merged over the matching row of hl_linux_inputs or hl_windows_inputs.
          - Keys are stanzas; values may set profile, criticality, enabled, track_source and max_gap_secs.
      hl_wd2l_audit_sourcetype:
        type: str
        default: "wd2l:audit"
        description: Sourcetype of the host's /var/log/wd2l/audit-*.jsonl (wd2l:sender:audit on wd2l-logsrv).
      hl_splunk_container:
        type: str
        default: wd2l-splunk
        description: The Splunk container on splunk_server (Docker Desktop on HOMEPC).
      hl_splunk_home:
        type: str
        default: /opt/splunk
        description: SPLUNK_HOME inside the container.
      hl_splunk_admin_password_file:
        type: str
        default: 'C:\Users\taylo\wd2l-splunk\secrets\splunk-admin-password'
        description: File on HOMEPC holding the Splunk admin password; read there for each REST call, never copied.
      hl_splunk_mgmt_url:
        type: str
        default: https://127.0.0.1:8089
        description: Splunk REST, as HOMEPC reaches it.
      hl_splunk_hec_url:
        type: str
        default: https://127.0.0.1:8088
        description: wd2l's HEC, as HOMEPC reaches it (health checks).
      hl_server_apps_src:
        type: str
        default: "{{ playbook_dir }}/../splunk/apps"
        description: Where the server apps' sources are on the controller.
      hl_server_apps:
        type: list
        elements: dict
        description: The server apps the server tag deploys and server_remove removes, in deploy order.
        options:
          name:
            type: str
            required: true
            description: App directory name under hl_server_apps_src.
          seed_lookups:
            type: list
            elements: str
            default: []
            description: Lookup files shipped only when the app has none (others rewrite them).
          templates:
            type: list
            elements: str
            default: []
            description: App-relative paths rendered from templates/server_apps/<app>/<path>.j2.
      hl_apps_only:
        type: list
        elements: str
        default: []
        description: Limit the app tags to these apps; empty means all.
      hl_server_restart_confs:
        type: list
        elements: str
        default: [indexes.conf, inputs.conf, props.conf, web.conf]
        description: Changing or removing one of these files restarts splunkd (web.conf has no REST reload); other changes are reloaded.
      hl_server_reload_endpoints:
        type: list
        elements: str
        description: REST endpoints (under /services/, without /_reload) reloaded after a change that needs no restart.
      hl_purge_index_data:
        type: bool
        default: false
        description: server_remove also deletes the removed indexes' data on disk.
      hl_net_name:
        type: str
        default: hl-net
        description: Docker network the Splunk container joins live so Cribl reaches splunktcp 9997.
      hl_server_container_stage:
        type: str
        default: /tmp/hl_server_stage
        description: Root-only staging directory inside the container, removed after each run.
      hl_wd2l_app:
        type: str
        default: wd2l
        description: wd2l's Splunk app (its dashboard is checked after every change).
      hl_wd2l_dashboard:
        type: str
        default: wd2l_state_of_health
        description: wd2l's dashboard view name.
      hl_server_wd2l_indexes:
        type: list
        elements: str
        default: [enclave1, wd2l]
        description: wd2l indexes that must receive new events after a splunkd restart.
      hl_server_wd2l_max_age:
        type: int
        default: 300
        description: Seconds; wd2l's newest health record must be younger than this.
      hl_server_health_timeout:
        type: int
        default: 300
        description: Seconds to wait for HEC and wd2l data after a change.
      hl_win_state_file:
        type: str
        default: 'C:\ProgramData\hl_splunk\state.json'
        description: The role's state file on Windows hosts (spec 5.2).
      syslog_devices:
        type: list
        elements: dict
        default: []
        description: Agentless devices relayed by the Pi (group_vars/syslog_relay.yml).
        options:
          name:
            type: str
            required: true
            description: Device name, written as the host in the relayed header.
          ip:
            type: str
            required: true
            description: Source IP the relay maps to the name (fromhost-ip) and allows through firewalld.
          index:
            type: str
            required: true
            description: Destination index.
          sourcetype:
            type: str
            required: true
            description: Sourcetype set on the server for this device.
          profile:
            type: str
            required: true
            choices: [heartbeat, periodic, continuous, sporadic, info]
            description: Cadence profile (spec 7.4).
          criticality:
            type: int
            required: true
            choices: [1, 2, 3, 4]
            description: 1 is the most critical.
      hl_linux_inputs:
        type: list
        elements: dict
        description: The shared input schema for uf_linux (spec 4); see the comments in defaults/main.yml.
        options: &hl_input_options
          stanza:
            type: str
            required: true
            description: inputs.conf stanza, e.g. monitor:///var/log/secure or script://./bin/cpu.sh.
          app:
            type: str
            required: true
            choices: [hl_uf_linux_inputs, hl_uf_wd2l_inputs, hl_uf_windows_inputs, Splunk_TA_nix, Splunk_TA_windows]
            description: App whose local/inputs.conf carries the stanza.
          index:
            type: str
            required: true
            description: Destination index.
          sourcetype:
            type: str
            required: true
            description: Sourcetype the events carry.
          source:
            type: str
            required: true
            description: Source the events carry, normalized (rotation parts as *).
          interval:
            type: int
            description: Seconds between runs; scripted and perfmon inputs only.
          profile:
            type: str
            required: true
            choices: [heartbeat, periodic, continuous, sporadic, info]
            description: Cadence profile (spec 7.4); periodic needs interval.
          criticality:
            type: int
            required: true
            choices: [1, 2, 3, 4]
            description: 1 is the most critical.
          enabled:
            type: bool
            required: true
            description: false keeps the row but renders and expects nothing for it.
          track_source:
            type: bool
            required: true
            description: Also expect each source (level=source), not only the sourcetype.
      hl_windows_inputs:
        type: list
        elements: dict
        description: The shared input schema for uf_windows (spec 4); same fields as hl_linux_inputs.
        options: *hl_input_options
      vault_hl_uf_admin_password:
        type: str
        no_log: true
        description: UF local admin password (group_vars/all/vault.yml, encrypted on the Pi).
      vault_hl_s2s_token:
        type: str
        no_log: true
        description: S2S token for 9997 (splunktcptoken hl_cribl on Splunk; the UFs and Cribl present it).
      vault_hl_markers_token:
        type: str
        no_log: true
        description: HEC token hl_markers, used for the Ansible maintenance markers.
