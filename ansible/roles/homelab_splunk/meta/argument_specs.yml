argument_specs:
  main:
    short_description: Splunk UFs, TAs, auditing, the syslog relay and the data-health apps for the homelab
    description:
      - One role for every managed group (uf_linux, uf_windows, splunk_server, syslog_relay); tags select the
        component (spec 5.3). A bare run deploys; removing, stopping and restarting need their tag.
      - Defaults are in defaults/main.yml. Ansible validates the provided values against this spec before the role runs.
    options:
      hl_collector:
        type: str
        default: 192.168.1.27
        description: Address the forwarders send S2S to, Cribl's (127.0.0.1 on HOMEPC itself).
      hl_uf_version:
        type: str
        default: 10.6.1.1
        description: The pinned UF version.
      hl_uf_build:
        type: str
        default: b2ae2962645c
        description: Its build id (the UF logs only the build, spike 14.7 e).
      hl_uf_home:
        type: str
        default: /opt/splunkforwarder
        description: SPLUNK_HOME of the Linux UF.
      hl_uf_user:
        type: str
        default: splunkfwd
        description: The account the Linux UF runs as (the RPM creates it).
      hl_uf_packages_dir:
        type: str
        default: "{{ playbook_dir }}/files/packages"
        description: Where the UF packages are on the controller.
      hl_uf_packages:
        type: dict
        description: Package file, URL and sha256 per platform (x86_64, aarch64, windows), spec 14.3.
      hl_uf_mgmt:
        type: str
        default: 127.0.0.1:8090
        description: UF management host:port (web.conf mgmtHostPort).
      hl_linux_state_dir:
        type: str
        default: /var/lib/hl_splunk
        description: The role's state file and install baselines on Linux hosts.
      hl_uf_linux_packages:
        type: list
        elements: str
        default: [sysstat]
        description: Packages installed with the UF; removed on uninstall only if the role added them.
      hl_uf_connect_timeout:
        type: int
        default: 180
        description: Seconds to wait for the UF to connect to Cribl and for its _internal in Splunk.
      hl_s2s_port:
        type: int
        default: 9997
        description: S2S port the forwarders send to (Cribl's Splunk TCP source).
      hl_owner:
        type: str
        default: taylorb
        description: Owner column of the host's expected rows.
      hl_site:
        type: str
        default: home
        description: Site column of the host's expected rows.
      hl_host_criticality:
        type: int
        choices: [1, 2, 3, 4]
        default: 2
        description: Criticality of the host-level (heartbeat) row; 1 is the most critical.
      hl_disabled_inputs:
        type: list
        elements: str
        default: []
        description: Input stanzas to leave out of the forwarder apps and the expected list.
      hl_input_overrides:
        type: dict
        default: {}
        description:
          - Per-stanza overrides merged over the matching row of hl_linux_inputs or hl_windows_inputs.
          - Keys are stanzas; values may set profile, criticality, enabled, track_source and max_gap_secs.
      hl_wd2l_audit_sourcetype:
        type: str
        default: "wd2l:audit"
        description: Sourcetype of the host's /var/log/wd2l/audit-*.jsonl (wd2l:sender:audit on wd2l-logsrv).
      hl_splunk_container:
        type: str
        default: wd2l-splunk
        description: The Splunk container on splunk_server (Docker Desktop on HOMEPC).
      hl_splunk_home:
        type: str
        default: /opt/splunk
        description: SPLUNK_HOME inside the container.
      hl_splunk_admin_password_file:
        type: str
        default: 'C:\Users\taylo\wd2l-splunk\secrets\splunk-admin-password'
        description: File on HOMEPC holding the Splunk admin password; read there for each REST call, never copied.
      hl_splunk_mgmt_url:
        type: str
        default: https://127.0.0.1:8089
        description: Splunk REST, as HOMEPC reaches it.
      hl_splunk_hec_url:
        type: str
        default: https://127.0.0.1:8088
        description: wd2l's HEC, as HOMEPC reaches it (health checks).
      hl_server_apps_src:
        type: str
        default: "{{ playbook_dir }}/../splunk/apps"
        description: Where the server apps' sources are on the controller.
      hl_server_apps:
        type: list
        elements: dict
        description: The server apps the server tag deploys and server_remove removes, in deploy order.
        options:
          name:
            type: str
            required: true
            description: App directory name under hl_server_apps_src.
          seed_lookups:
            type: list
            elements: str
            default: []
            description: Lookup files shipped only when the app has none (others rewrite them).
          templates:
            type: list
            elements: str
            default: []
            description: App-relative paths rendered from templates/server_apps/<app>/<path>.j2.
      hl_apps_only:
        type: list
        elements: str
        default: []
        description: Limit the app tags to these apps; empty means all.
      hl_server_restart_confs:
        type: list
        elements: str
        default: [indexes.conf, inputs.conf, props.conf, web.conf]
        description: Changing or removing one of these files restarts splunkd (web.conf has no REST reload); other changes are reloaded.
      hl_server_force_restart:
        type: bool
        default: false
        description: The server tag restarts splunkd even when nothing changed (tests).
      hl_server_reload_endpoints:
        type: list
        elements: str
        description: REST endpoints (under /services/, without /_reload) reloaded after a change that needs no restart.
      hl_purge_index_data:
        type: bool
        default: false
        description: server_remove also deletes the removed indexes' data on disk.
      hl_net_name:
        type: str
        default: hl-net
        description: Docker network the Splunk container joins live so Cribl reaches splunktcp 9997.
      hl_server_container_stage:
        type: str
        default: /tmp/hl_server_stage
        description: Root-only staging directory inside the container, removed after each run.
      hl_wd2l_app:
        type: str
        default: wd2l
        description: wd2l's Splunk app (its dashboard is checked after every change).
      hl_wd2l_dashboard:
        type: str
        default: wd2l_state_of_health
        description: wd2l's dashboard view name.
      hl_server_wd2l_indexes:
        type: list
        elements: str
        default: [enclave1, wd2l]
        description: wd2l indexes that must receive new events after a splunkd restart.
      hl_server_wd2l_max_age:
        type: int
        default: 300
        description: Seconds; wd2l's newest health record must be younger than this.
      hl_server_health_timeout:
        type: int
        default: 300
        description: Seconds to wait for HEC and wd2l data after a change.
      hl_win_state_file:
        type: str
        default: 'C:\ProgramData\hl_splunk\state.json'
        description: The role's state file on Windows hosts (spec 5.2).
      hl_cribl_image:
        type: str
        description: Cribl image, pinned by digest (spec 6.2). The role never pulls it; pull it in a desktop session.
      hl_cribl_container:
        type: str
        default: cribl
        description: Cribl container name.
      hl_cribl_project:
        type: str
        default: hl-cribl
        description: docker compose project name.
      hl_cribl_volume:
        type: str
        default: hl-cribl-data
        description: Docker volume holding Cribl's config, lookups and persistent queue.
      hl_cribl_volume_dir:
        type: str
        default: /opt/cribl/config-volume
        description: CRIBL_VOLUME_DIR inside the container (the volume's mount point).
      hl_cribl_compose_dir:
        type: str
        default: 'C:\ProgramData\hl_splunk\cribl'
        description: Folder on HOMEPC for the rendered compose.yml.
      hl_cribl_s2s_port:
        type: int
        default: 9997
        description: Cribl's Splunk TCP port, published on all interfaces for the UFs.
      hl_cribl_api_port:
        type: int
        default: 9000
        description: Cribl's UI/API port, published on 127.0.0.1 only.
      hl_cribl_api_url:
        type: str
        description: Cribl's API base URL as HOMEPC reaches it.
      hl_cribl_src:
        type: str
        default: "{{ playbook_dir }}/../cribl"
        description: The repo's Cribl config tree on the controller.
      hl_cribl_config_files:
        type: list
        elements: str
        description: Files under hl_cribl_src/local/cribl the role renders and writes into the volume.
      hl_cribl_health_timeout:
        type: int
        default: 180
        description: Seconds to wait for Cribl's health and for its data in Splunk.
      hl_cribl_selftest:
        type: bool
        default: true
        description: After a Cribl change, send one syslog line per device port and wait for it in Splunk.
      hl_cribl_hold_on_splunk_restart:
        type: bool
        default: false
        description: Pause the Cribl container while the server tag restarts splunkd.
      hl_block_key:
        type: str
        default: ""
        description: cribl_block - the block key host|sourcetype|source (* for a whole level).
      hl_block_minutes:
        type: int
        default: 60
        description: cribl_block - how long the block lasts.
      hl_block_reason:
        type: str
        default: ""
        description: cribl_block - why (required to set a block).
      hl_block_clear:
        type: bool
        default: false
        description: cribl_block - remove hl_block_key instead of setting it.
      hl_block_max_minutes:
        type: int
        default: 1440
        description: cribl_block - the longest block allowed.
      hl_audit_arches:
        type: list
        elements: str
        default: [b32, b64]
        description: Syscall ABIs each role audit rule is written for.
      hl_server_host:
        type: str
        default: homepc
        description: Inventory name of the Splunk server host (REST searches are delegated to it).
      hl_marker_hec_url:
        type: str
        default: https://192.168.1.27:8088/services/collector/event
        description: HEC event endpoint the controller posts the Ansible markers to.
      hl_marker_validate_certs:
        type: bool
        default: false
        description: Check wd2l-splunk's HEC certificate (self-signed today).
      syslog_devices:
        type: list
        elements: dict
        default: []
        description: Agentless syslog devices, each with its own Cribl UDP port (group_vars/splunk_server.yml).
        options:
          name:
            type: str
            required: true
            description: Device name; Cribl sets it as the host of everything that arrives on the device's port.
          ip:
            type: str
            required: true
            description: Device address (pi5's hl-devprobe pings it).
          port:
            type: int
            required: true
            description: Cribl UDP port for this device only (published on HOMEPC).
          source:
            type: str
            required: true
            description: Source Cribl sets on the device's events.
          index:
            type: str
            required: true
            description: Destination index.
          sourcetype:
            type: str
            required: true
            description: Sourcetype Cribl sets on the device's events.
          profile:
            type: str
            required: true
            choices: [heartbeat, periodic, continuous, sporadic, info]
            description: Cadence profile (spec 7.4).
          criticality:
            type: int
            required: true
            choices: [1, 2, 3, 4]
            description: 1 is the most critical.
      hl_linux_inputs:
        type: list
        elements: dict
        description: The shared input schema for uf_linux (spec 4); see the comments in defaults/main.yml.
        options: &hl_input_options
          stanza:
            type: str
            required: true
            description: inputs.conf stanza, e.g. monitor:///var/log/secure or script://./bin/cpu.sh.
          app:
            type: str
            required: true
            choices: [hl_uf_linux_inputs, hl_uf_wd2l_inputs, hl_uf_windows_inputs, Splunk_TA_nix, Splunk_TA_windows]
            description: App whose local/inputs.conf carries the stanza.
          index:
            type: str
            required: true
            description: Destination index.
          sourcetype:
            type: str
            required: true
            description: Sourcetype the events carry.
          source:
            type: str
            required: true
            description: Source the events carry, normalized (rotation parts as *).
          interval:
            type: int
            description: Seconds between runs; scripted and perfmon inputs only.
          profile:
            type: str
            required: true
            choices: [heartbeat, periodic, continuous, sporadic, info]
            description: Cadence profile (spec 7.4); periodic needs interval.
          criticality:
            type: int
            required: true
            choices: [1, 2, 3, 4]
            description: 1 is the most critical.
          enabled:
            type: bool
            required: true
            description: false keeps the row but renders and expects nothing for it.
          track_source:
            type: bool
            required: true
            description: Also expect each source (level=source), not only the sourcetype.
      hl_windows_inputs:
        type: list
        elements: dict
        description: The shared input schema for uf_windows (spec 4); same fields as hl_linux_inputs.
        options: *hl_input_options
      vault_hl_uf_admin_password:
        type: str
        no_log: true
        description: UF local admin password (group_vars/all/vault.yml, encrypted on the Pi).
      vault_hl_s2s_token:
        type: str
        no_log: true
        description: S2S token for 9997 (splunktcptoken hl_cribl on Splunk; the UFs and Cribl present it).
      vault_hl_cribl_admin_password:
        type: str
        no_log: true
        description: Cribl Stream admin password (the cribl tag sets it on a fresh container).
      vault_hl_markers_token:
        type: str
        no_log: true
        description: HEC token hl_markers, used for the Ansible maintenance markers.
