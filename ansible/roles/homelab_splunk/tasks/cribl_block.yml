# cribl_block (splunk_server, never; spec 7.7): set or clear one ingest test block in Cribl's
# hl_ingest_block.csv through the lookups API (it takes effect in 15-17 s; expiry is checked per
# event), drop expired rows, and mirror the same table into Splunk's hl_server_base/lookups so the
# dashboards can label blocked rows "test block until hh:mm" (the spec 7.2 open item; task 11b
# reads it). The Manage dashboard shows this command instead of writing the block itself.
#   --tags cribl_block -e hl_block_key='wd2l-recv|linux_secure|*' -e hl_block_minutes=30 -e "hl_block_reason='E2E row 4'"
#   --tags cribl_block -e hl_block_key='wd2l-recv|linux_secure|*' -e hl_block_clear=true
#   --tags cribl_block            (no key: only prunes expired rows and re-mirrors)
# Keys: host|*|* · host|sourcetype|* · host|sourcetype|<exact raw source>; host short, lowercase.
- name: Check the block request
  ansible.builtin.assert:
    that:
      - hl_block_key | length == 0 or hl_block_key is match('^[a-z0-9][a-z0-9_-]*\|[^|,"\n]+\|[^|,"\n]+$')
      - hl_block_key | length == 0 or hl_block_clear | bool or (hl_block_reason is match('^[A-Za-z0-9 _.:/#()-]{3,120}$'))
      - hl_block_minutes | int >= 1
      - hl_block_minutes | int <= hl_block_max_minutes | int
    fail_msg: >-
      hl_block_key must be host|sourcetype|source (host short and lowercase, * for a whole level, no
      commas or quotes); setting a block needs hl_block_reason (3-120 plain characters) and
      1 <= hl_block_minutes <= {{ hl_block_max_minutes }}
    quiet: true

- name: Marker before the block change (Cribl audits every lookup change, spec 7.6)
  ansible.builtin.include_tasks: marker.yml
  vars:
    hl_marker_action: cribl_block
    hl_marker_target: cribl

- name: Stage the in-container helper
  ansible.windows.win_tempfile:
    state: directory
    prefix: hl_cribl_stage.
  register: hl_block_stage
  changed_when: false

- name: Read, change and push the block table
  block:
    - name: Copy the in-container helper to HOMEPC
      ansible.windows.win_copy:
        src: hl_cribl_config.sh
        dest: "{{ hl_block_stage.path }}\\hl_cribl_config.sh"
      changed_when: false

    - name: Copy the helper into the Cribl container
      ansible.windows.win_command:
        argv: [docker, cp, "{{ hl_block_stage.path }}\\hl_cribl_config.sh", "{{ hl_cribl_container }}:/tmp/hl_cribl_config.sh"]
      changed_when: false

    - name: Find Cribl's copy of the table
      ansible.windows.win_command:
        argv: [docker, exec, -u, "0", "{{ hl_cribl_container }}", sh, /tmp/hl_cribl_config.sh, lookup-path, hl_ingest_block.csv]
      register: hl_block_path
      changed_when: false

    - name: Read Cribl's copy of the table
      ansible.windows.win_command:
        argv: [docker, exec, -u, "0", "{{ hl_cribl_container }}", cat, "{{ hl_block_path.stdout | regex_search('HL_LOOKUP=(.*)', '\\1') | first | trim }}"]
      register: hl_block_cur
      changed_when: false
      when: hl_block_path.stdout is search('HL_LOOKUP=/')

    - name: Work out the new table
      ansible.builtin.set_fact:
        hl_block_rows: "{{ (hl_block_keep_json | from_json) + hl_block_new }}"
        hl_block_cur_csv: "{{ (hl_block_cur.stdout | default('') | replace('\r', '') | trim) ~ '\n' }}"
      vars:
        hl_block_now: "{{ now(utc=true).timestamp() | int }}"
        hl_block_old: "{{ (hl_block_cur.stdout | default('k,until,reason,set_by')) | community.general.from_csv }}"
        # Keep the unexpired rows for other keys; until is compared as an integer
        hl_block_keep_json: >-
          {% set ns = namespace(rows=[]) %}{% for r in hl_block_old %}{% if r.k is defined and r.k != hl_block_key
          and (r.until | default('') | string) is match('^[0-9]+$') and (r.until | int) > (hl_block_now | int)
          %}{% set ns.rows = ns.rows + [r] %}{% endif %}{% endfor %}{{ ns.rows | to_json }}
        hl_block_new: "{{ [] if (hl_block_key | length == 0 or hl_block_clear | bool) else
          [{'k': hl_block_key, 'until': (hl_block_now | int + 60 * hl_block_minutes | int) | string,
            'reason': hl_block_reason, 'set_by': lookup('ansible.builtin.env', 'USER') or 'ansible'}] }}"

    - name: Render the table
      ansible.builtin.set_fact:
        hl_block_csv: |
          k,until,reason,set_by
          {% for r in hl_block_rows %}
          {{ r.k }},{{ r.until }},{{ r.reason }},{{ r.set_by }}
          {% endfor %}

    # Skipped when nothing changed (a prune-only run with nothing expired)
    - name: Push the table to Cribl through the lookups API
      ansible.windows.win_shell: |
        {{ hl_cribl_ps_prelude }}
        if (-not (Connect-HlCribl)) { throw 'Cribl login failed' }
        $id = 'hl_ingest_block.csv'
        # base64: a JSON string in PowerShell keeps \n literally and expands $ (task 3b)
        $csv = [Text.Encoding]::UTF8.GetString([Convert]::FromBase64String('{{ hl_block_csv | b64encode }}'))
        $up = Invoke-HlCribl -Method PUT -Path "/system/lookups?filename=$id" -Raw $csv -ContentType 'text/csv'
        if ($up.Code -ne 200) { throw "lookup upload: HTTP $($up.Code) $($up.Content)" }
        $tmp = ($up.Content | ConvertFrom-Json).filename
        $exists = Test-HlCriblLookup $id
        $m = if ($exists) { 'PATCH' } else { 'POST' }
        $p = if ($exists) { "/system/lookups/$id" } else { '/system/lookups' }
        $r = Invoke-HlCribl -Method $m -Path $p -Json @{ id = $id; fileInfo = @{ filename = $tmp } }
        if ($r.Code -ne 200) { throw "lookup $m`: HTTP $($r.Code) $($r.Content)" }
        "HL_PUSHED=$m"
      environment:
        HL_CRIBL_PW: "{{ vault_hl_cribl_admin_password }}"
      register: hl_block_push
      when: hl_block_csv != hl_block_cur_csv
      changed_when: true

    - name: Read Cribl's copy back
      ansible.windows.win_command:
        argv: [docker, exec, -u, "0", "{{ hl_cribl_container }}", sh, /tmp/hl_cribl_config.sh, lookup-cat, hl_ingest_block.csv]
      register: hl_block_back
      changed_when: false

    - name: Check Cribl holds exactly the table the role sent
      ansible.builtin.assert:
        that: (hl_block_back.stdout | replace('\r', '') | trim) == (hl_block_csv | trim)
        fail_msg: "Cribl's hl_ingest_block.csv differs from what the role pushed: {{ hl_block_back.stdout }}"
        quiet: true

    - name: Mirror the table into Splunk
      ansible.builtin.include_tasks: cribl_mirror.yml
      vars:
        hl_mirror_csv: "{{ hl_block_csv }}"

  always:
    - name: Remove the helper from the Cribl container
      ansible.windows.win_command:
        argv: [docker, exec, -u, "0", "{{ hl_cribl_container }}", rm, -f, /tmp/hl_cribl_config.sh]
      changed_when: false
      failed_when: false

    - name: Remove the staging directory on HOMEPC
      ansible.windows.win_file:
        path: "{{ hl_block_stage.path }}"
        state: absent
      changed_when: false

- name: Show the active blocks
  ansible.builtin.debug:
    msg: "{{ hl_block_rows | map(attribute='k') | list if hl_block_rows | length > 0 else 'no active test blocks' }}"

- name: Marker after the block change
  ansible.builtin.include_tasks: marker.yml
  vars:
    hl_marker_action: cribl_block
    hl_marker_target: cribl
