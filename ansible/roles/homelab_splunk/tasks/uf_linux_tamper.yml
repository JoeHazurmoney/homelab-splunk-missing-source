# The UF-path tamper audit rules (spec 5.4): /etc/audit/rules.d/zz-hl-uf-tamper.rules, sorting
# after wd2l.rules, loaded with augenrules. Only paths that exist go in (auditctl rejects a missing
# dir, and augenrules would stop at this file). wd2l's own rules must still be loaded afterwards.
- name: Look for the watched paths
  ansible.builtin.stat:
    path: "{{ item.path }}"
  loop: "{{ hl_uf_tamper_rules }}"
  loop_control:
    label: "{{ item.path }}"
  register: hl_uf_tamper_stat

- name: Count wd2l's loaded rules before
  ansible.builtin.shell: |
    set -o pipefail
    auditctl -l | grep -c -- '-k wd2l' || true
  args:
    executable: /bin/bash
  register: hl_uf_wd2l_before
  changed_when: false

- name: Render the tamper rules
  ansible.builtin.template:
    src: uf/zz-hl-uf-tamper.rules.j2
    dest: "{{ hl_uf_tamper_file }}"
    owner: root
    group: root
    mode: "0600"
  vars:
    hl_uf_tamper_present: "{{ hl_uf_tamper_stat.results | selectattr('stat.exists') | map(attribute='item.path') | list }}"
  register: hl_uf_tamper_render

- name: Load the audit rules (augenrules)
  ansible.builtin.command:
    argv: [augenrules, --load]
  when: hl_uf_tamper_render.changed or hl_uf_tamper_loaded_before | default(false)
  changed_when: true

- name: Check the tamper rules and wd2l's rules are loaded
  ansible.builtin.shell: |
    set -o pipefail
    echo "HL_UF=$(auditctl -l | grep -c -- '-k hl-uf-config' || true)"
    echo "HL_WD2L=$(auditctl -l | grep -c -- '-k wd2l' || true)"
  args:
    executable: /bin/bash
  register: hl_uf_tamper_loaded
  changed_when: false
  failed_when: >-
    hl_uf_tamper_loaded.stdout is search('HL_UF=0$', multiline=true)
    or ('HL_WD2L=' ~ (hl_uf_wd2l_before.stdout | trim)) not in hl_uf_tamper_loaded.stdout
