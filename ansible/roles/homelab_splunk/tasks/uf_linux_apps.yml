# apps (uf_linux, spec 5.3/5.5): Splunk_TA_nix unmodified (its local/inputs.conf is the role's),
# the role-owned input apps (hl_uf_linux_inputs, hl_uf_wd2l_inputs; stanzas in local/) and
# hl_uf_outputs; restart the UF only on a real change, then prove the path. The connection check runs
# on every run (task 4's rule), with task 4's anchors: the proof counts only data from the running
# splunkd, and an unknown start fails. Markers are best effort.
#   -e '{"hl_disabled_inputs":["monitor:///var/log/secure"]}' --tags apps   turns one input off
- name: Check the TA package is pinned and on the controller
  ansible.builtin.stat:
    path: "{{ hl_uf_packages_dir }}/{{ hl_tas.Splunk_TA_nix.file }}"
    checksum_algorithm: sha256
  delegate_to: localhost
  become: false
  register: hl_ta_nix_pkg
  failed_when: >-
    hl_tas.Splunk_TA_nix.sha256 | length != 64 or not hl_ta_nix_pkg.stat.exists
    or hl_ta_nix_pkg.stat.checksum != hl_tas.Splunk_TA_nix.sha256

- name: Read the installed TA's version
  ansible.builtin.shell: |
    set -o pipefail
    f={{ hl_uf_home }}/etc/apps/Splunk_TA_nix/default/app.conf
    [ -f "$f" ] && awk -F' *= *' '/^\[launcher\]/{l=1;next} /^\[/{l=0} l && $1=="version"{print $2}' "$f" || true
  args:
    executable: /bin/bash
  register: hl_ta_nix_ver
  changed_when: false

- name: Install Splunk_TA_nix (unmodified; local/ kept)
  when: hl_ta_nix_ver.stdout | trim != hl_tas.Splunk_TA_nix.version
  block:
    - name: Create the staging folder
      ansible.builtin.file:
        path: /var/tmp/hl_ta
        state: directory
        owner: root
        group: root
        mode: "0700"

    - name: Unpack the TA into the staging folder
      ansible.builtin.unarchive:
        src: "{{ hl_uf_packages_dir }}/{{ hl_tas.Splunk_TA_nix.file }}"
        dest: /var/tmp/hl_ta

    - name: Swap the TA's shipped files in (everything but local/)
      ansible.builtin.shell: |
        set -euo pipefail
        dst={{ hl_uf_home }}/etc/apps/Splunk_TA_nix
        mkdir -p "$dst"
        find "$dst" -mindepth 1 -maxdepth 1 ! -name local -exec rm -rf {} +
        (cd /var/tmp/hl_ta/Splunk_TA_nix && find . -mindepth 1 -maxdepth 1 ! -name local -exec cp -a {} "$dst"/ \;)
        chown -R {{ hl_uf_user }}:{{ hl_uf_user }} "$dst"
        # cp -a keeps the staging folder's SELinux type; give the files the UF tree's
        restorecon -R "$dst"
      args:
        executable: /bin/bash
      changed_when: true

  always:
    - name: Remove the staging folder
      ansible.builtin.file:
        path: /var/tmp/hl_ta
        state: absent

- name: Create the role-owned apps' folders
  ansible.builtin.file:
    path: "{{ hl_uf_home }}/etc/apps/{{ item.0 }}/{{ item.1 }}"
    state: directory
    owner: "{{ hl_uf_user }}"
    group: "{{ hl_uf_user }}"
    mode: "0755"
  loop: "{{ hl_uf_input_apps_linux | product(['default', 'local']) | list + [['Splunk_TA_nix', 'local']] }}"

- name: Render the role-owned apps' app.conf
  ansible.builtin.template:
    src: uf/input_app.conf.j2
    dest: "{{ hl_uf_home }}/etc/apps/{{ hl_app }}/default/app.conf"
    owner: "{{ hl_uf_user }}"
    group: "{{ hl_uf_user }}"
    mode: "0644"
  loop: "{{ hl_uf_input_apps_linux }}"
  loop_control:
    loop_var: hl_app
  register: hl_apps_appconf

- name: Render each app's local/inputs.conf
  ansible.builtin.template:
    src: uf/inputs.conf.j2
    dest: "{{ hl_uf_home }}/etc/apps/{{ hl_app }}/local/inputs.conf"
    owner: "{{ hl_uf_user }}"
    group: "{{ hl_uf_user }}"
    mode: "0644"
  loop: "{{ hl_uf_input_apps_linux + ['Splunk_TA_nix'] }}"
  loop_control:
    loop_var: hl_app
  register: hl_apps_inputs

- name: Deploy hl_uf_outputs
  ansible.builtin.import_tasks: uf_linux_outputs.yml

# The files can be right while the running splunkd isn't using them (a run that died before its
# restart): the next run must still restart, so a file newer than the running splunkd counts as a
# change. Only role-written files and the TA's folder (its swap touches it); never local/outputs.conf,
# which splunkd itself rewrites. Unknown start: restart, and the connection check below fails loudly.
- name: Check the running splunkd is newer than the role's files
  ansible.builtin.shell:
    cmd: |
      set -o pipefail
      a={{ hl_uf_home }}/etc/apps
      st=$(systemctl show --timestamp=unix -p ActiveEnterTimestamp --value SplunkForwarder 2>/dev/null)
      st=${st#@}
      case "$st" in ''|*[!0-9]*) echo HL_STALE=unknown; exit 0;; esac
      files=("$a/Splunk_TA_nix" "$a/Splunk_TA_nix/local/inputs.conf" "$a"/hl_uf_outputs/default/*)
      for app in {{ hl_uf_input_apps_linux | join(' ') }}; do
        files+=("$a/$app/default/app.conf" "$a/$app/local/inputs.conf")
      done
      newest=$(stat -c %Y "${files[@]}" | sort -n | tail -1)
      if [ "$newest" -gt "$st" ]; then echo HL_STALE=1; else echo HL_STALE=0; fi
    executable: /bin/bash
  register: hl_apps_stale
  changed_when: false

- name: Note whether the UF must restart
  ansible.builtin.set_fact:
    hl_apps_restart: >-
      {{ (hl_ta_nix_ver.stdout | trim != hl_tas.Splunk_TA_nix.version) or hl_apps_appconf is changed
         or hl_apps_inputs is changed or hl_uf_outputs_changed | bool
         or hl_apps_stale.stdout is not search('HL_STALE=0') }}

# "<lines> <epoch>": where splunkd.log ends and the host's clock, just before the restart
- name: Note where splunkd.log ends
  ansible.builtin.shell:
    cmd: |
      set -o pipefail
      f={{ hl_uf_home }}/var/log/splunk/splunkd.log
      if [ -f "$f" ]; then echo "$(wc -l < "$f") $(date +%s)"; else echo "0 $(date +%s)"; fi
    executable: /bin/bash
  register: hl_apps_log_lines
  changed_when: false

- name: Marker before the restart
  ansible.builtin.include_tasks: marker_best_effort.yml
  vars:
    hl_marker_action: apps
  when: hl_apps_restart | bool

- name: Restart the UF
  ansible.builtin.systemd_service:
    name: SplunkForwarder
    state: restarted
  when: hl_apps_restart | bool

# Every run, as install: without a restart, the whole log (the latest state counts) and the last 120 s
- name: Check the UF is connected through Cribl
  ansible.builtin.include_tasks: uf_linux_connected.yml
  vars:
    hl_uf_log_from: "{{ (hl_apps_log_lines.stdout.split()[0] | int) if hl_apps_restart | bool else 0 }}"
    hl_uf_since: "{{ (hl_apps_log_lines.stdout.split()[1] | int) if hl_apps_restart | bool else 0 }}"
