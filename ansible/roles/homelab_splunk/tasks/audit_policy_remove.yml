# audit_policy_remove (uf_windows, spec 5.3/5.6): auditpol /restore from the backup audit_policy
# took, then check the policy matches the backup exactly (every subcategory's setting), then delete
# the backup and its record. Without a backup there is nothing to restore, and nothing is changed.
- name: Read the state file
  ansible.builtin.import_tasks: win_state_read.yml

- name: Restore the audit policy and compare it with the backup
  ansible.windows.win_shell: |
    $f = '{{ hl_win_state_dir }}\auditpol.before.csv'
    if (-not (Test-Path -LiteralPath $f)) { @{ restored = $false; diff = @() } | ConvertTo-Json -Compress; exit 0 }
    auditpol /restore /file:"$f" | Out-Null
    if ($LASTEXITCODE -ne 0) { throw "auditpol /restore failed ($LASTEXITCODE)" }
    $now = Join-Path $env:TEMP ("hl_auditpol_" + [guid]::NewGuid() + ".csv")
    auditpol /backup /file:"$now" | Out-Null
    # Compare by subcategory GUID and setting value (the machine name column may differ in case)
    $key = { param($r) "$($r.'Subcategory GUID')|$($r.Subcategory)|$($r.'Setting Value')" }
    $a = @(Import-Csv -LiteralPath $f | ForEach-Object { & $key $_ } | Sort-Object)
    $b = @(Import-Csv -LiteralPath $now | ForEach-Object { & $key $_ } | Sort-Object)
    Remove-Item -LiteralPath $now -Force
    $d = @(Compare-Object $a $b | ForEach-Object { "$($_.SideIndicator) $($_.InputObject)" })
    @{ restored = $true; diff = $d } | ConvertTo-Json -Compress
  register: hl_ap_restore
  changed_when: (hl_ap_restore.stdout | from_json).restored

- name: Check the policy matches the backup exactly
  ansible.builtin.assert:
    that: (hl_ap_restore.stdout | from_json).diff | length == 0
    fail_msg: "auditpol differs from the backup after /restore: {{ (hl_ap_restore.stdout | from_json).diff }}"
    success_msg: "audit policy restored exactly"

- name: Delete the backup
  ansible.windows.win_file:
    path: "{{ hl_win_state_dir }}\\auditpol.before.csv"
    state: absent

- name: Drop the audit-policy record from the state file
  ansible.builtin.set_fact:
    hl_state: "{{ hl_state | dict2items | rejectattr('key', 'eq', 'audit_policy') | items2dict }}"

- name: Write the state file
  ansible.builtin.import_tasks: win_state_write.yml
