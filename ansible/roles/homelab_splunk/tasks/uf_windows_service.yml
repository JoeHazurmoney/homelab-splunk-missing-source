# start / stop / restart / status (uf_windows, spec 5.3): service control + marker, as
# uf_linux_service.yml. main.yml imports this file once per action, with hl_service_action set.
# Every action that changes the service posts its marker first, so a finding the change itself
# causes (7036 "stopped" of a restart) is the role's own work (final review I3, #49); start/restart
# post a second marker once connected. Markers are best effort (they warn, never fail the action).
# status = service state, MSI version and build, apps, the outputs connection (from splunkd.log)
# and FIPS (the running splunkd).
- name: Marker before the stop
  ansible.builtin.include_tasks: marker_best_effort.yml
  vars:
    hl_marker_action: stop
  when: hl_service_action == 'stop'

# A start of a running UF changes nothing and posts no marker before it
- name: Check whether the start or restart changes the service
  ansible.windows.win_service:
    name: "{{ hl_uf_win_service }}"
    state: "{{ {'start': 'started', 'restart': 'restarted'}[hl_service_action] }}"
  check_mode: true
  register: hl_svcw_would
  when: hl_service_action in ['start', 'restart']

- name: Marker before the start or restart
  ansible.builtin.include_tasks: marker_best_effort.yml
  vars:
    hl_marker_action: "{{ hl_service_action }}"
  when: hl_service_action in ['start', 'restart'] and hl_svcw_would is changed

# "<lines> <epoch>": where splunkd.log ends and the host's clock, just before the (re)start
- name: Note where splunkd.log ends
  ansible.windows.win_shell:
    cmd: |
      $f = '{{ hl_uf_win_home | replace("'", "''") }}\var\log\splunk\splunkd.log'
      $n = 0
      if (Test-Path -LiteralPath $f) {
        $fs = [IO.File]::Open($f, [IO.FileMode]::Open, [IO.FileAccess]::Read, [IO.FileShare]'ReadWrite, Delete')
        try { $sr = New-Object IO.StreamReader($fs); while ($null -ne $sr.ReadLine()) { $n++ } } finally { $fs.Dispose() }
      }
      "$n $([DateTimeOffset]::UtcNow.ToUnixTimeSeconds())"
  register: hl_svcw_log_lines
  changed_when: false
  when: hl_service_action in ['start', 'restart']

- name: "Run the service action: {{ hl_service_action }}"
  ansible.windows.win_service:
    name: "{{ hl_uf_win_service }}"
    state: "{{ {'start': 'started', 'stop': 'stopped', 'restart': 'restarted'}[hl_service_action] }}"
  register: hl_svcw_result
  when: hl_service_action in ['start', 'stop', 'restart']

# A start of a running UF changes nothing: then the whole log, where the latest state counts
- name: Check the UF is connected through Cribl
  ansible.builtin.include_tasks: uf_windows_connected.yml
  vars:
    hl_uf_log_from: "{{ (hl_svcw_log_lines.stdout.split()[0] | int) if hl_svcw_result is changed else 0 }}"
    hl_uf_since: "{{ (hl_svcw_log_lines.stdout.split()[1] | int) if hl_svcw_result is changed else 0 }}"
  when: hl_service_action in ['start', 'restart']

- name: Marker after the start
  ansible.builtin.include_tasks: marker_best_effort.yml
  vars:
    hl_marker_action: "{{ hl_service_action }}"
  when: hl_service_action in ['start', 'restart']

- name: Read the UF's status
  ansible.windows.win_shell:
    cmd: |
      $home_ = '{{ hl_uf_win_home | replace("'", "''") }}'
      $log = "$home_\var\log\splunk\splunkd.log"
      $svc = Get-CimInstance Win32_Service -Filter "Name='{{ hl_uf_win_service }}'"
      $keys = @('HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Uninstall\*',
                'HKLM:\SOFTWARE\WOW6432Node\Microsoft\Windows\CurrentVersion\Uninstall\*')
      $p = Get-ItemProperty $keys -ErrorAction SilentlyContinue | Where-Object { $_.DisplayName -like 'UniversalForwarder*' } | Select-Object -First 1
      "service=$(if ($svc) { $svc.State } else { 'absent' })"
      "account=$(if ($svc) { $svc.StartName } else { '' })"
      "msi=$(if ($p) { $p.DisplayVersion } else { 'none' })"
      # The build from etc\splunk.version and FIPS from the running splunkd: splunkd.log's start lines
      # are gone once the log rotates (task 4 fix round 1)
      $b = Select-String -LiteralPath "$home_\etc\splunk.version" -Pattern '^BUILD=(.*)$' -ErrorAction SilentlyContinue | Select-Object -First 1
      "build=$(if ($b) { $b.Matches[0].Groups[1].Value.Trim() } else { '' })"
      $c = ''; $r = ''
      if (Test-Path -LiteralPath $log) {
        $fs = [IO.File]::Open($log, [IO.FileMode]::Open, [IO.FileAccess]::Read, [IO.FileShare]'ReadWrite, Delete')
        try {
          $sr = New-Object IO.StreamReader($fs)
          while ($null -ne ($l = $sr.ReadLine())) {
            if ($l.Contains('Connected to idx=')) { $c = $l }
            if ($l -cmatch '{{ hl_uf_close_re }}') { $r = $l }
          }
        } finally { $fs.Dispose() }
      }
      "last_connect=$($c.Substring(0, [Math]::Min(23, $c.Length)))"
      "last_close=$($r.Substring(0, [Math]::Min(23, $r.Length)))"
      "apps=$(@(Get-ChildItem -LiteralPath "$home_\etc\apps" -Directory -ErrorAction SilentlyContinue | ForEach-Object Name) -join ' ')"
      $f = 'unknown (not running)'
      if ($svc -and $svc.State -eq 'Running' -and $svc.ProcessId -gt 0) {
        $f = 'off'
        $mods = (Get-Process -Id $svc.ProcessId -ErrorAction SilentlyContinue).Modules
        $m = @($mods | Where-Object { $_.FileName -match '\\ossl-modules\\fips140-3\\fips\.dll$' })
        if ($m.Count -gt 0) { $f = 'on' }
      }
      $lf = @(Select-String -LiteralPath "$home_\etc\splunk-launch.conf" -Pattern '^SPLUNK_FIPS=1' -ErrorAction SilentlyContinue).Count
      $wf = (Get-ItemProperty HKLM:\SYSTEM\CurrentControlSet\Control\Lsa\FipsAlgorithmPolicy -ErrorAction SilentlyContinue).Enabled
      "fips=$f (launch.conf SPLUNK_FIPS=1: $lf; Windows FIPS policy: $wf)"
  register: hl_svcw_status
  changed_when: false
  when: hl_service_action == 'status'

- name: Show the UF's status
  ansible.builtin.debug:
    msg: "{{ hl_svcw_status.stdout_lines }}"
  when: hl_service_action == 'status'
