# verify (all, read-only; spec 5.3): UF hosts — running, connected to Cribl (the UF's own log: Splunk
# sees only Cribl's connection), no token refusal, and this host's _internal seen in Splunk;
# splunk_server — Cribl healthy, and every expected row seen (dh_status, each with its own profile's threshold).
- name: Verify the Linux UF
  when: "'uf_linux' in group_names"
  block:
    - name: Check the service is running
      ansible.builtin.command:
        argv: [systemctl, is-active, SplunkForwarder]
      changed_when: false

    # The straggler check before the end of a rotation (spec 13): a UF on the old token loses what
    # it sends once Cribl drops that token. Hashes only: the vault's value is hashed on the controller.
    # The file alone isn't enough: `install` restarts the UF and drops its encrypted local copy only
    # when the template changes, so after an interrupted install a rerun leaves the old token in use
    # with the right file on disk (local beats default). So the running splunkd must have started at
    # or after the file was written, and a local token must be no older than it. Unknown fails.
    - name: Compare the UF's token with the vault's current one
      ansible.builtin.shell:
        cmd: |
          set -o pipefail
          a={{ hl_uf_home }}/etc/apps/hl_uf_outputs
          f=$a/default/outputs.conf
          l=$a/local/outputs.conf
          [ -f "$f" ] || { echo HL_TOKEN=missing; exit 0; }
          have=$(sed -n 's/^[[:space:]]*token[[:space:]]*=[[:space:]]*//p' "$f" | tr -d ' \r\t\n' | sha256sum | cut -d' ' -f1)
          [ "$have" = "{{ vault_hl_s2s_token | hash('sha256') }}" ] || { echo HL_TOKEN=stale; exit 0; }
          d=$(stat -c %Y "$f")
          st=$(systemctl show --timestamp=unix -p ActiveEnterTimestamp --value SplunkForwarder 2>/dev/null)
          st=${st#@}
          case "$st" in ''|*[!0-9]*) echo "HL_TOKEN=not_applied reason=start_unknown"; exit 0;; esac
          [ "$st" -ge "$d" ] || { echo "HL_TOKEN=not_applied reason=started_before_default"; exit 0; }
          if [ -f "$l" ] && grep -Eq '^[[:space:]]*token[[:space:]]*=' "$l" && [ "$(stat -c %Y "$l")" -lt "$d" ]; then
            echo "HL_TOKEN=not_applied reason=local_older"; exit 0
          fi
          echo HL_TOKEN=current
        executable: /bin/bash
      register: hl_verify_token
      changed_when: false
      failed_when: false
      no_log: true

    - name: Fail when the UF is not on the vault's current S2S token
      ansible.builtin.assert:
        that: hl_verify_token.stdout | default('') is search('HL_TOKEN=current')
        fail_msg: >-
          {{ inventory_hostname }} is not presenting the vault's current S2S token
          ({{ hl_verify_token.stdout | default('no result') | trim }}). HL_TOKEN=stale: run --tags install --limit {{ inventory_hostname }}.
          HL_TOKEN=not_applied: the file is right but the running UF isn't using it, and install won't change that;
          delete the token line from hl_uf_outputs/local/outputs.conf and run --tags restart --limit {{ inventory_hostname }}.
          Do this before removing vault_hl_s2s_token_previous (spec 13).
        quiet: true

    - name: Check the UF is connected through Cribl (the whole log; the latest state counts)
      ansible.builtin.include_tasks: uf_linux_connected.yml
      vars:
        hl_uf_log_from: 0

- name: Verify the Windows UF
  when: "'uf_windows' in group_names"
  block:
    - name: Check the service is running
      ansible.windows.win_shell: (Get-Service -Name '{{ hl_uf_win_service }}').Status
      register: hl_verify_ufw
      changed_when: false
      failed_when: hl_verify_ufw.stdout | trim != 'Running'

    - name: Compare the UF's token with the vault's current one
      ansible.windows.win_shell:
        cmd: |
          $ErrorActionPreference = 'Stop'
          $a = '{{ hl_uf_win_home | replace("'", "''") }}\etc\apps\hl_uf_outputs'
          $f = "$a\default\outputs.conf"
          $l = "$a\local\outputs.conf"
          if (-not (Test-Path -LiteralPath $f)) { 'HL_TOKEN=missing'; exit 0 }
          $line = @(Get-Content -LiteralPath $f | Where-Object { $_ -match '^\s*token\s*=' }) | Select-Object -First 1
          $v = ($line -replace '^\s*token\s*=\s*', '').Trim()
          $sha = [Security.Cryptography.SHA256]::Create()
          $hex = -join ($sha.ComputeHash([Text.Encoding]::UTF8.GetBytes($v)) | ForEach-Object { $_.ToString('x2') })
          if ($hex -ne '{{ vault_hl_s2s_token | hash('sha256') }}') { 'HL_TOKEN=stale'; exit 0 }
          # As on Linux: the running splunkd must be newer than the file, and a local token no older
          $d = (Get-Item -LiteralPath $f).LastWriteTimeUtc
          $st = $null
          $svc = Get-CimInstance Win32_Service -Filter "Name='{{ hl_uf_win_service }}'"
          if ($svc -and $svc.State -eq 'Running' -and $svc.ProcessId -gt 0) {
            try { $st = (Get-Process -Id $svc.ProcessId).StartTime.ToUniversalTime() } catch { $st = $null }
          }
          if ($null -eq $st) { 'HL_TOKEN=not_applied reason=start_unknown'; exit 0 }
          if ($st -lt $d) { 'HL_TOKEN=not_applied reason=started_before_default'; exit 0 }
          if ((Test-Path -LiteralPath $l) -and (Select-String -LiteralPath $l -Pattern '^\s*token\s*=' -Quiet) -and
              (Get-Item -LiteralPath $l).LastWriteTimeUtc -lt $d) { 'HL_TOKEN=not_applied reason=local_older'; exit 0 }
          'HL_TOKEN=current'
      register: hl_verify_token
      changed_when: false
      failed_when: false
      no_log: true

    - name: Fail when the UF is not on the vault's current S2S token
      ansible.builtin.assert:
        that: hl_verify_token.stdout | default('') is search('HL_TOKEN=current')
        fail_msg: >-
          {{ inventory_hostname }} is not presenting the vault's current S2S token
          ({{ hl_verify_token.stdout | default('no result') | trim }}). HL_TOKEN=stale: run --tags install --limit {{ inventory_hostname }}.
          HL_TOKEN=not_applied: the file is right but the running UF isn't using it, and install won't change that;
          delete the token line from hl_uf_outputs local outputs.conf and run --tags restart --limit {{ inventory_hostname }}.
          Do this before removing vault_hl_s2s_token_previous (spec 13).
        quiet: true

    - name: Check the UF is connected through Cribl (the whole log; the latest state counts)
      ansible.builtin.include_tasks: uf_windows_connected.yml
      vars:
        hl_uf_log_from: 0

- name: Verify Cribl
  when: "'splunk_server' in group_names"
  block:
    - name: Check Cribl reports healthy
      ansible.windows.win_shell: |
        {{ hl_cribl_ps_prelude }}
        Get-HlCriblHealth | ConvertTo-Json -Compress
      register: hl_verify_cribl
      changed_when: false
      failed_when: hl_verify_cribl.rc != 0 or (hl_verify_cribl.stdout | from_json).Code != 200

- name: Verify every expected row is seen
  when: "'splunk_server' in group_names"
  block:
    # DH Evaluate holds every row PENDING while its gate is shut (tracker late, nothing received, a
    # resume); that says nothing either way, so the task waits a little for a real answer.
    - name: Read the expected rows' status (dh_status, read-only)
      ansible.windows.win_shell: |
        {{ hl_ps_prelude }}
        $name = {
          param($r)
          if ($r.level -eq 'host') { return "$($r.host) (host row: $($r.status))" }
          $s = if ($r.level -eq 'source') { " $($r.source)" }
          "$($r.host) $($r.sourcetype)$s ($($r.status))"
        }
        $deadline = (Get-Date).AddSeconds({{ hl_verify_status_wait | int }})
        do {
          $rows = Invoke-HlSearch -App hl_data_health -Spl '| inputlookup dh_status | fields level host sourcetype source status profile'
          $pending = @($rows | Where-Object { $_.status -eq 'PENDING' }).Count
          if ($rows.Count -gt 0 -and $pending -lt $rows.Count) { break }
          if ((Get-Date) -ge $deadline) { break }
          Start-Sleep -Seconds 15
        } while ($true)
        @{
          total = $rows.Count
          pending = $pending
          hard = @($rows | Where-Object { $_.status -in 'MISSING', 'NEVER_SEEN' -and $_.profile -ne 'sporadic' } | ForEach-Object { & $name $_ })
          late = @($rows | Where-Object { $_.status -eq 'LATE' } | ForEach-Object { & $name $_ })
          sporadic = @($rows | Where-Object { $_.status -in 'MISSING', 'NEVER_SEEN' -and $_.profile -eq 'sporadic' } | ForEach-Object { & $name $_ })
        } | ConvertTo-Json -Compress
      register: hl_verify_status
      changed_when: false

    - name: Fail when dh_status has not evaluated anything
      ansible.builtin.assert:
        that:
          - (hl_verify_status.stdout | from_json).total | int > 0
          - (hl_verify_status.stdout | from_json).pending | int < (hl_verify_status.stdout | from_json).total | int
        fail_msg: >-
          Not evaluated: every row in dh_status is PENDING (or the list is empty) after
          {{ hl_verify_status_wait }} s, so this play can't say what arrives. Wait for DH Evaluate
          (a resume holds it for 5 min) and run verify again.
        quiet: true

    - name: Report rows that are late or sporadic and quiet (no failure)
      ansible.builtin.debug:
        msg:
          late: "{{ (hl_verify_status.stdout | from_json).late }}"
          sporadic_missing_or_never_seen: "{{ (hl_verify_status.stdout | from_json).sporadic }}"
          total: "{{ (hl_verify_status.stdout | from_json).total }}"

    - name: Fail on an expected row that isn't arriving
      ansible.builtin.assert:
        that: (hl_verify_status.stdout | from_json).hard | length == 0
        fail_msg: >-
          Expected data not seen (MISSING or NEVER_SEEN, profile not sporadic):
          {{ (hl_verify_status.stdout | from_json).hard | join('; ') }}
        quiet: true
