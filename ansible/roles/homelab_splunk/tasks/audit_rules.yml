# audit_rules (uf_linux, spec 5.3): the STIG sample rules (/usr/share/audit-rules/30-stig.rules)
# plus the privileged-command rules generated from the commands that 31-privileged.rules ships as
# comments, into hl_stig_rules_file (zz-hl-zz-stig.rules), then augenrules --load. Never touches
# wd2l.rules or wd2l-quadlet.rules, never sets -e (immutable), -D, -b or -f.
#
# The file loads LAST. The kernel's exit filter is first-match by load order and a matching rule's key
# sticks, and STIG has path-less syscall rules (delete, perm_mod, access): loaded earlier, they would
# take events on wd2l's and the UF's paths and tag them with STIG's keys, so key=wd2l-* and key=hl-*
# would stop matching. Loaded last, an event those rules claim is still logged under their key.
# The name is deliberate: `ls -1v` (what augenrules sorts with) puts punctuation AFTER letters, so
# `zzz-hl-stig.rules` sorts BEFORE `zz-hl-uf-tamper.rules`, and `zz-hl-zz-` is what sorts last.
#
# Also: a rejected STIG line stops augenrules only after wd2l's and the tamper rules are in. If a
# post-load check fails anyway (order, counts), the file is removed again and the play fails.
- name: Read the state file
  ansible.builtin.import_tasks: linux_state_read.yml

# STIG's own keys are left out of the baseline, so a baseline taken while they are loaded (say,
# after the file was lost) still describes the host without them.
- name: Save the loaded rules before the role's STIG rules (first run only)
  ansible.builtin.shell:
    cmd: |
      set -euo pipefail
      f={{ hl_linux_state_dir }}/auditctl.before_stig
      if [ -f "$f" ]; then echo HL_BASELINE=present; exit 0; fi
      mkdir -p {{ hl_linux_state_dir }}
      chmod 700 {{ hl_linux_state_dir }}
      t=$(mktemp "$f.XXXXXX")
      trap 'rm -f "$t"' EXIT
      auditctl -l | { grep -v -E -e '{{ hl_stig_key_re }}' || true; } | LC_ALL=C sort > "$t"
      mv "$t" "$f"
      echo HL_BASELINE=created
    executable: /bin/bash
  register: hl_stig_baseline
  changed_when: "'HL_BASELINE=created' in hl_stig_baseline.stdout"

- name: Build the rules
  ansible.builtin.script:
    cmd: >-
      hl_stig_build.sh {{ hl_stig_rules_src | quote }} {{ hl_stig_privileged_src | quote }}
      {{ hl_audit_arches | join(',') | quote }}
    executable: /bin/bash
  register: hl_stig_build
  changed_when: false

# Only "-" and "##" lines go in the file, so nothing else the host prints can end up in it
- name: Note the rules and how many should load
  ansible.builtin.set_fact:
    hl_stig_lines: "{{ hl_stig_build.stdout_lines | select('match', '^(-|##)') | list }}"
    hl_stig_expected: "{{ hl_stig_build.stdout_lines | select('match', '^-') | list | length }}"

- name: Read what is loaded before
  ansible.builtin.script:
    cmd: "{{ hl_stig_census_cmd }}"
    executable: /bin/bash
  register: hl_stig_before
  changed_when: false

- name: Look at whether the rules file would change
  ansible.builtin.copy:
    content: "{{ hl_stig_lines | join('\n') }}\n"
    dest: "{{ hl_stig_rules_file }}"
    owner: root
    group: root
    mode: "0600"
  check_mode: true
  register: hl_stig_would_write

# The loaded set, not only this run's write: a run that died between the write and the load heals
- name: Note whether the loaded set differs from what the file should give
  ansible.builtin.set_fact:
    hl_stig_stale: >-
      {{ ('HL_STIG=' ~ hl_stig_expected) not in hl_stig_before.stdout_lines
      or 'HL_ORDER=ok' not in hl_stig_before.stdout_lines }}

# The write triggers hl-audit-config and CONFIG_CHANGE, which spec 7.6 would report as possible
# blinding without a marker. A run with nothing to do posts none.
- name: Marker before the rules change
  ansible.builtin.include_tasks: marker_best_effort.yml
  vars:
    hl_marker_action: audit_rules
  when: hl_stig_would_write.changed or hl_stig_stale | bool

- name: Write and load the rules, rolling back if they damage the rule set
  block:
    - name: Write the rules file
      ansible.builtin.copy:
        content: "{{ hl_stig_lines | join('\n') }}\n"
        dest: "{{ hl_stig_rules_file }}"
        owner: root
        group: root
        mode: "0600"
      register: hl_stig_write

    - name: Load the audit rules (augenrules)
      ansible.builtin.command:
        argv: [augenrules, --load]
      when: hl_stig_write.changed or hl_stig_stale | bool
      changed_when: true

    - name: Check the STIG rules are loaded, last, and the others are intact
      ansible.builtin.script:
        cmd: "{{ hl_stig_census_cmd }}"
        executable: /bin/bash
      register: hl_stig_loaded
      changed_when: false
      failed_when: >-
        hl_stig_loaded.rc != 0
        or ('HL_STIG=' ~ hl_stig_expected) not in hl_stig_loaded.stdout_lines
        or 'HL_ORDER=ok' not in hl_stig_loaded.stdout_lines
        or (hl_stig_before.stdout_lines | select('match', '^HL_WD2L=') | first) not in hl_stig_loaded.stdout_lines
        or (hl_stig_before.stdout_lines | select('match', '^HL_UF=') | first) not in hl_stig_loaded.stdout_lines
        or 'HL_S_enabled=2' in hl_stig_loaded.stdout_lines

  rescue:
    - name: Roll back (remove the file)
      ansible.builtin.file:
        path: "{{ hl_stig_rules_file }}"
        state: absent

    - name: Roll back (reload without it)
      ansible.builtin.command:
        argv: [augenrules, --load]
      changed_when: true

    - name: Fail with what happened
      ansible.builtin.fail:
        msg: >-
          The STIG rules were rolled back: {{ hl_stig_expected }} rules should load, last, with
          wd2l's and the tamper rules' counts unchanged ({{ hl_stig_before.stdout_lines }}).
          After the load: {{ hl_stig_loaded.stdout_lines | default(hl_stig_load_error) }}.
          A count short by a few means a key missing from hl_stig_key_re, or a line the kernel took
          differently; for a rejected line, run `auditctl -R` on a copy of the file on a scratch host.
      vars:
        hl_stig_load_error: "the load itself failed: {{ ansible_failed_result.stderr | default(ansible_failed_result.msg | default('?')) }}"

- name: Record the STIG rules
  ansible.builtin.set_fact:
    hl_state: "{{ hl_state | combine({'audit_rules': {'file': hl_stig_rules_file, 'baseline': hl_linux_state_dir ~ '/auditctl.before_stig'}}) }}"

- name: Write the state file
  ansible.builtin.import_tasks: linux_state_write.yml

- name: Show the build and the loaded counts
  ansible.builtin.debug:
    msg: "{{ hl_stig_build.stdout_lines | select('match', '^HL_') | list + hl_stig_loaded.stdout_lines }}"
