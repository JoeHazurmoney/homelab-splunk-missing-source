# audit_rules (uf_linux, spec 5.3): the STIG sample rules (/usr/share/audit-rules/30-stig.rules)
# plus the privileged-command rules generated by the find/filecap commands that
# 31-privileged.rules ships as comments, into /etc/audit/rules.d/50-hl-stig.rules, then
# augenrules --load. Never touches wd2l.rules or wd2l-quadlet.rules, never sets -e (immutable),
# -D, -b or -f (augenrules keeps the stock audit.rules ones). 50- sorts before wd2l.rules, so a
# rule the kernel rejects would drop wd2l's rules: if wd2l's rule count changes, the file is
# removed again and the play fails.
- name: Read the state file
  ansible.builtin.import_tasks: linux_state_read.yml

- name: Save the loaded rules before the role's STIG rules (first run only)
  ansible.builtin.shell: |
    set -o pipefail
    f={{ hl_linux_state_dir }}/auditctl.before_stig
    [ -f "$f" ] && { echo HL_BASELINE=present; exit 0; }
    mkdir -p {{ hl_linux_state_dir }} && chmod 700 {{ hl_linux_state_dir }}
    auditctl -l | LC_ALL=C sort > "$f"
    echo HL_BASELINE=created
  args:
    executable: /bin/bash
  register: hl_stig_baseline
  changed_when: "'HL_BASELINE=created' in hl_stig_baseline.stdout"

- name: Build the rules (STIG sample + generated privileged-command rules)
  ansible.builtin.shell: |
    set -euo pipefail
    [ -f {{ hl_stig_rules_src }} ] || { echo "missing {{ hl_stig_rules_src }} (package audit-rules)" >&2; exit 2; }
    tmp=$(mktemp -d); trap 'rm -rf "$tmp"' EXIT
    # The generator commands are the comment lines that start with "## find" or "## filecap"
    if [ -f {{ hl_stig_privileged_src }} ]; then
      grep -E '^##[[:space:]]*(find|filecap)[[:space:]]' {{ hl_stig_privileged_src }} | sed -E 's/^##[[:space:]]*//' > "$tmp/gen.sh"
      (cd "$tmp" && sh gen.sh 2>/dev/null || true)
    fi
    echo "## Managed by the homelab_splunk role (audit_rules); removed by audit_rules_remove."
    echo "## STIG sample rules from {{ hl_stig_rules_src }}, then the privileged-command rules generated"
    echo "## by the commands in {{ hl_stig_privileged_src }}. No -D/-b/-f/-e: augenrules keeps audit.rules' own."
    grep -v -E '^[[:space:]]*-(D|b|f|e)([[:space:]]|$)' {{ hl_stig_rules_src }} \
      {% if 'b32' not in hl_audit_arches %}| grep -v -- '-F arch=b32' {% endif %}| grep -v -E '^[[:space:]]*(#|$)'
    if ls "$tmp"/*.rules >/dev/null 2>&1; then
      echo "## Privileged commands ($(cat "$tmp"/*.rules | sort -u | wc -l) rules, generated $(hostname -s))"
      cat "$tmp"/*.rules | LC_ALL=C sort -u
    fi
  args:
    executable: /bin/bash
  register: hl_stig_build
  changed_when: false

- name: Count wd2l's loaded rules before
  ansible.builtin.shell: |
    set -o pipefail
    auditctl -l | grep -c -- '-k wd2l' || true
  args:
    executable: /bin/bash
  register: hl_stig_wd2l_before
  changed_when: false

- name: Write and load the rules, rolling back if wd2l's rules drop
  block:
    - name: Write the rules file
      ansible.builtin.copy:
        content: "{{ hl_stig_build.stdout }}\n"
        dest: "{{ hl_stig_rules_file }}"
        owner: root
        group: root
        mode: "0600"
      register: hl_stig_write

    - name: Load the audit rules (augenrules)
      ansible.builtin.command:
        argv: [augenrules, --load]
      when: hl_stig_write.changed or hl_stig_baseline.changed
      changed_when: true

    - name: Check the STIG rules are loaded and wd2l's are intact
      ansible.builtin.shell: |
        set -o pipefail
        echo "HL_RULES=$(auditctl -l | wc -l)"
        echo "HL_WD2L=$(auditctl -l | grep -c -- '-k wd2l' || true)"
        echo "HL_PRIV=$(auditctl -l | grep -c -- 'privileged' || true)"
        auditctl -s | grep -E '^(enabled|lost|backlog)' | sed 's/^/HL_S_/; s/ /=/'
      args:
        executable: /bin/bash
      register: hl_stig_loaded
      changed_when: false
      failed_when: >-
        ('HL_WD2L=' ~ (hl_stig_wd2l_before.stdout | trim)) not in hl_stig_loaded.stdout_lines
        or 'HL_S_enabled=2' in hl_stig_loaded.stdout_lines

  rescue:
    - name: Roll back (remove the file and reload)
      ansible.builtin.file:
        path: "{{ hl_stig_rules_file }}"
        state: absent

    - name: Reload without it
      ansible.builtin.command:
        argv: [augenrules, --load]
      changed_when: true

    - name: Fail with what happened
      ansible.builtin.fail:
        msg: >-
          The STIG rules broke the rule set (wd2l had {{ hl_stig_wd2l_before.stdout | trim }} rules; after:
          {{ hl_stig_loaded.stdout_lines | default(['?']) }}). Rolled back. Look for the rejected line with
          `augenrules --check; auditctl -R {{ hl_stig_rules_file }}` on a copy, or set hl_audit_arches.

- name: Record the STIG rules
  ansible.builtin.set_fact:
    hl_state: "{{ hl_state | combine({'audit_rules': {'file': hl_stig_rules_file, 'baseline': hl_linux_state_dir ~ '/auditctl.before_stig'}}) }}"

- name: Write the state file
  ansible.builtin.import_tasks: linux_state_write.yml

- name: Show the loaded counts
  ansible.builtin.debug:
    msg: "{{ hl_stig_loaded.stdout_lines }}"
