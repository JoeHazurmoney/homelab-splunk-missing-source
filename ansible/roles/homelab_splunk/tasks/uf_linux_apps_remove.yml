# apps_remove (uf_linux, spec 5.3/5.5): delete the role-owned input apps (only those whose
# default/app.conf says [hl] managed = true) and the role's local/inputs.conf inside Splunk_TA_nix.
# hl_uf_outputs stays unless named in hl_apps_only (without it the UF sends nothing, heartbeat
# included). Restart once, marker. The TA itself goes with --tags uninstall.
#   -e '{"hl_apps_only":["hl_uf_wd2l_inputs"]}' --tags apps_remove
- name: Pick the apps to remove
  ansible.builtin.set_fact:
    hl_rm_apps: "{{ hl_apps_only if hl_apps_only | length > 0 else (hl_uf_input_apps_linux + ['Splunk_TA_nix']) }}"

- name: Read each app's role marker
  ansible.builtin.command:
    argv: [grep, -A3, -E, '^\[hl\]', "{{ hl_uf_home }}/etc/apps/{{ item }}/default/app.conf"]
  loop: "{{ hl_rm_apps | reject('equalto', 'Splunk_TA_nix') | list }}"
  register: hl_rm_marker
  changed_when: false
  failed_when: false

- name: Remove the role-owned apps
  ansible.builtin.file:
    path: "{{ hl_uf_home }}/etc/apps/{{ item.item }}"
    state: absent
  loop: "{{ hl_rm_marker.results | selectattr('stdout', 'search', 'managed\\s*=\\s*(true|1)') | list }}"
  loop_control:
    label: "{{ item.item }}"
  register: hl_rm_apps_done

- name: Remove the role's local/inputs.conf from Splunk_TA_nix
  ansible.builtin.file:
    path: "{{ hl_uf_home }}/etc/apps/Splunk_TA_nix/local/inputs.conf"
    state: absent
  when: "'Splunk_TA_nix' in hl_rm_apps"
  register: hl_rm_ta_inputs

- name: Note whether the UF must restart
  ansible.builtin.set_fact:
    hl_rm_restart: "{{ hl_rm_apps_done is changed or hl_rm_ta_inputs is changed }}"

- name: Marker for the removal
  ansible.builtin.include_tasks: marker.yml
  vars:
    hl_marker_action: apps_remove
  when: hl_rm_restart | bool

- name: Restart the UF
  ansible.builtin.systemd_service:
    name: SplunkForwarder
    state: restarted
  when: hl_rm_restart | bool
