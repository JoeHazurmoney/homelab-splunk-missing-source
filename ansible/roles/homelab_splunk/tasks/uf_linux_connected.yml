# Is this Linux UF sending through Cribl? (install, start, restart, verify; spec 5.3, 13)
#   vars: hl_uf_log_from (line number of splunkd.log to read from; 0 = the whole file)
#         hl_uf_since (> 0 when this run (re)started the UF; 0 = no restart, read the last 120 s)
# 1. The UF's own splunkd.log after hl_uf_log_from: the latest "Connected to idx=<collector>:<port>"
#    is newer than the latest close (hl_uf_close_re). Splunk never sees a wrong token (Cribl refuses
#    it), and the data written meanwhile is lost once the UF restarts (spike 14.7 a).
#    No fast fail: the UF logs a token refusal as a plain "Connection closed by server", the same
#    line as a benign close (a Cribl reload or restart, the hold), so a close only keeps the wait
#    going; the timeout fails it, quoting the last close. And a refused attempt also logs
#    "Connected to idx=…" about 1 ms before the close (task 4 checks 1 and 7), so this is a first
#    answer only.
# 2. The proof: Splunk has this host's _internal stamped at or after the current splunkd's start
#    (the unit's ActiveEnterTimestamp; without a restart in this run, also within the last 120 s).
#    Not "since the restart was asked for": the old splunkd, still holding the old token, sends its
#    own shutdown lines while it stops, and those passed a wrong token (task 4 fix round 1).
- name: Wait for the UF to connect to Cribl
  ansible.builtin.shell: |
    set -o pipefail
    echo "HL_NOW=$(date +%s)"
    st=$(systemctl show -p ActiveEnterTimestamp --value SplunkForwarder 2>/dev/null)
    if [ -n "$st" ]; then echo "HL_STARTED=$(date -d "$st" +%s 2>/dev/null || echo 0)"; else echo "HL_STARTED=0"; fi
    log={{ hl_uf_home }}/var/log/splunk/splunkd.log
    from={{ (hl_uf_log_from | default(0) | int) + 1 }}
    # The wait loops here, not with until/retries: Ansible fails a task whose retries run out, and
    # the next task should say why (the last close). The latest of "connected" and "closed" decides.
    end=$(( $(date +%s) + {{ hl_uf_connect_timeout | int }} ))
    while :; do
      lc=0; lr=""
      if [ -f "$log" ]; then
        lc=$(tail -n +"$from" "$log" | grep -n 'Connected to idx={{ hl_collector }}:{{ hl_s2s_port }}' | tail -1 | cut -d: -f1 || true)
        lr=$(tail -n +"$from" "$log" | grep -n -E '{{ hl_uf_close_re }}' | tail -1 || true)
      fi
      lc=${lc:-0}; ln=${lr%%:*}; ln=${ln:-0}
      [ "$lc" -gt "$ln" ] && break
      [ "$(date +%s)" -ge "$end" ] && break
      sleep 10
    done
    if [ "$lc" -gt "$ln" ]; then echo "HL_CONNECTED=1"; else echo "HL_CONNECTED=0"; fi
    if [ -n "$lr" ]; then echo "HL_LAST_CLOSE=${lr#*:}" | cut -c1-300; fi
  args:
    executable: /bin/bash
  register: hl_uf_conn
  changed_when: false
  failed_when: false

- name: Fail when the UF never connected
  ansible.builtin.fail:
    msg: >-
      The UF didn't connect to Cribl at {{ hl_collector }}:{{ hl_s2s_port }} within {{ hl_uf_connect_timeout }} s.
      Last close in splunkd.log: {{ hl_uf_conn.stdout_lines | select('match', '^HL_LAST_CLOSE=')
      | map('regex_replace', '^HL_LAST_CLOSE=', '') | first | default('none') }}.
      A wrong token shows on Cribl's side as "Invalid S2S token … sent by host={{ inventory_hostname }}".
  when: hl_uf_conn.rc != 0 or hl_uf_conn.stdout is not search('HL_CONNECTED=1')

- name: Wait for this host's _internal in Splunk (through Cribl, from the running splunkd)
  ansible.windows.win_shell: |
    {{ hl_ps_prelude }}
    $h = '{{ inventory_hostname | lower | regex_replace('[.].*$', '') }}'
    $rows = Invoke-HlSearch ("| tstats count max(_time) as t where index=_internal (host=$h OR host=$h.*) earliest={{ hl_uf_seen_since }}")
    $r = $rows | Select-Object -First 1
    @{ count = [int]("0" + $r.count); since = {{ hl_uf_seen_since }}; latest = "$($r.t)" } | ConvertTo-Json -Compress
  vars:
    hl_uf_started_at: "{{ hl_uf_conn.stdout | regex_search('HL_STARTED=([0-9]+)', '\\1') | first | int }}"
    hl_uf_now: "{{ hl_uf_conn.stdout | regex_search('HL_NOW=([0-9]+)', '\\1') | first | int }}"
    hl_uf_seen_since: >-
      {{ [hl_uf_started_at | int, hl_uf_since | int] | max if (hl_uf_since | default(0) | int) > 0
         else [hl_uf_started_at | int, (hl_uf_now | int) - 120] | max }}
  delegate_to: "{{ hl_server_host }}"
  become: false
  register: hl_uf_seen
  until: hl_uf_seen.rc == 0 and (hl_uf_seen.stdout | from_json).count > 0
  retries: "{{ (hl_uf_connect_timeout / 10) | int }}"
  delay: 10
  changed_when: false
