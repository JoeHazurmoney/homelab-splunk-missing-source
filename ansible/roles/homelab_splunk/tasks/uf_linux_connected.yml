# Is this Linux UF sending through Cribl? (install, start, restart, verify; spec 5.3, 13)
#   vars: hl_uf_log_from (line number of splunkd.log to read from; 0 = the whole file)
# 1. The UF's own splunkd.log after hl_uf_log_from: the latest "Connected to idx=<collector>:<port>"
#    is newer than the latest token refusal. Splunk never sees a wrong token (Cribl refuses it), and
#    the data written meanwhile is lost once the UF restarts (spike 14.7 a): this check catches it.
# 2. Splunk sees this host's _internal (through Cribl) within the timeout.
- name: Wait for the UF to connect to Cribl
  ansible.builtin.shell: |
    set -o pipefail
    log={{ hl_uf_home }}/var/log/splunk/splunkd.log
    [ -f "$log" ] || { echo "HL_CONNECTED=0"; exit 0; }
    # The latest of "connected" and "refused" in the window decides
    tail -n +{{ (hl_uf_log_from | default(0) | int) + 1 }} "$log" > /tmp/hl_uf_log.$$
    lc=$(grep -n 'Connected to idx={{ hl_collector }}:{{ hl_s2s_port }}' /tmp/hl_uf_log.$$ | tail -1 | cut -d: -f1)
    lr=$(grep -n -E 'Invalid S2S token|Connection closed by server|unauthorized' /tmp/hl_uf_log.$$ | tail -1 | cut -d: -f1)
    rm -f /tmp/hl_uf_log.$$
    lc=${lc:-0}; lr=${lr:-0}
    if [ "$lc" -gt "$lr" ]; then echo "HL_CONNECTED=1"; else echo "HL_CONNECTED=0"; fi
    if [ "$lr" -gt "$lc" ]; then echo "HL_REFUSED=1"; else echo "HL_REFUSED=0"; fi
  args:
    executable: /bin/bash
  register: hl_uf_conn
  until: hl_uf_conn.stdout is search('HL_CONNECTED=[1-9]') or hl_uf_conn.stdout is search('HL_REFUSED=[1-9]')
  retries: "{{ (hl_uf_connect_timeout / 10) | int }}"
  delay: 10
  changed_when: false
  failed_when: >-
    hl_uf_conn.rc != 0 or hl_uf_conn.stdout is search('HL_REFUSED=[1-9]')
    or hl_uf_conn.stdout is not search('HL_CONNECTED=[1-9]')

- name: Wait for this host's _internal in Splunk (through Cribl)
  ansible.windows.win_shell: |
    {{ hl_ps_prelude }}
    $h = '{{ inventory_hostname | lower | regex_replace('[.].*$', '') }}'
    $rows = Invoke-HlSearch ("| tstats max(_indextime) as t where index=_internal (host=$h OR host=$h.*) earliest=-15m | eval age=now()-t")
    $a = ($rows | Select-Object -First 1).age
    @{ age = $(if ("$a" -match '^\d+(\.\d+)?$') { [int][double]$a } else { -1 }) } | ConvertTo-Json -Compress
  delegate_to: "{{ hl_server_host }}"
  become: false
  register: hl_uf_seen
  until: hl_uf_seen.rc == 0 and (hl_uf_seen.stdout | from_json).age >= 0 and (hl_uf_seen.stdout | from_json).age < 120
  retries: "{{ (hl_uf_connect_timeout / 10) | int }}"
  delay: 10
  changed_when: false
