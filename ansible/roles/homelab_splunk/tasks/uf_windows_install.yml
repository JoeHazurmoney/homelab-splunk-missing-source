# install (uf_windows, spec 5.3/5.6): the pinned MSI (sha256 on both ends) with LAUNCHSPLUNK=0 →
# before the first start: FIPS (only if Windows' FIPS policy is on), user-seed.conf,
# hl_uf_outputs (Cribl on 127.0.0.1:9997, token, useACK; mgmt 127.0.0.1:8090) → the virtual
# account into Event Log Readers and Performance Monitor Users → start → connected through Cribl
# and seen in Splunk (every run) → the mgmt listener checked → marker (best effort). Needs the
# elevated SSH session (administrators_authorized_keys, spec 5.1). The rules are uf_linux_install's
# (task 4's final ones): records before the step that can fail, FIPS from the running splunkd.
- name: Read the state file
  ansible.builtin.import_tasks: win_state_read.yml

- name: Look for an installed UF (uninstall keys)
  ansible.windows.win_shell: |
    $keys = @('HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Uninstall\*',
              'HKLM:\SOFTWARE\WOW6432Node\Microsoft\Windows\CurrentVersion\Uninstall\*')
    $p = Get-ItemProperty $keys -ErrorAction SilentlyContinue | Where-Object { $_.DisplayName -like 'UniversalForwarder*' } | Select-Object -First 1
    if ($p) { @{ installed = $true; version = [string]$p.DisplayVersion; product_code = [string]$p.PSChildName } | ConvertTo-Json -Compress }
    else { @{ installed = $false } | ConvertTo-Json -Compress }
  register: hl_ufw_msi
  changed_when: false

- name: Note whether this run installs the UF
  ansible.builtin.set_fact:
    hl_ufw_fresh: "{{ not (hl_ufw_msi.stdout | from_json).installed }}"

- name: Refuse an installed UF the role didn't install or doesn't pin
  ansible.builtin.assert:
    that: >-
      hl_ufw_fresh or ((hl_ufw_msi.stdout | from_json).version == hl_uf_version
      and (hl_state.uf | default({})).installed | default(false))
    fail_msg: >-
      UniversalForwarder {{ (hl_ufw_msi.stdout | from_json).version | default('?') }} is installed, but the role
      pins {{ hl_uf_version }} or has no record of installing it. Remove it first (--tags uninstall or Apps & features).
    quiet: true

# Written before the MSI runs (as uf_linux_install records its packages before dnf): a run that
# fails after the MSI (reading its ids, the groups, the start, …) leaves the record, so the next
# install isn't refused as "not the role's" and uninstall still removes it (task 4 fix round 1).
- name: Record the UF install
  ansible.builtin.set_fact:
    hl_state: "{{ hl_state | combine({'uf': (hl_state.uf | default({})) | combine({'installed': true,
      'version': hl_uf_version, 'build': hl_uf_build, 'msi_log': hl_win_state_dir ~ '\\uf-msi-install.log',
      'installed_at': (hl_state.uf | default({})).installed_at | default(now(utc=true).isoformat())})}) }}"

- name: Write the state file
  ansible.builtin.include_tasks: win_state_write.yml

- name: Install the UF package
  when: hl_ufw_fresh | bool
  block:
    - name: Check the package on the controller (--tags download fetches it)
      ansible.builtin.stat:
        path: "{{ hl_uf_packages_dir }}/{{ hl_uf_packages.windows.file }}"
        checksum_algorithm: sha256
      delegate_to: localhost
      become: false
      register: hl_ufw_pkg_local
      failed_when: not hl_ufw_pkg_local.stat.exists or hl_ufw_pkg_local.stat.checksum != hl_uf_packages.windows.sha256

    - name: Create the staging folder
      ansible.windows.win_file:
        path: "{{ hl_win_state_dir }}\\stage"
        state: directory

    - name: Copy the MSI to HOMEPC
      ansible.windows.win_copy:
        src: "{{ hl_uf_packages_dir }}/{{ hl_uf_packages.windows.file }}"
        dest: "{{ hl_win_state_dir }}\\stage\\{{ hl_uf_packages.windows.file }}"

    - name: Check the copied MSI's sha256
      ansible.windows.win_stat:
        path: "{{ hl_win_state_dir }}\\stage\\{{ hl_uf_packages.windows.file }}"
        checksum_algorithm: sha256
      register: hl_ufw_pkg_remote
      failed_when: hl_ufw_pkg_remote.stat.checksum | lower != hl_uf_packages.windows.sha256

    # No credentials on the command line (they'd land in the MSI log): user-seed.conf instead.
    # One string, not a list: win_package quotes a list item with a space as a whole
    # ("INSTALLDIR=C:\Program Files\…"), which msiexec doesn't parse, so it shows its "Command line
    # options" dialog in the invisible SSH session and waits forever, with no log (task 5 check 1).
    - name: Install the MSI (LAUNCHSPLUNK=0)
      ansible.windows.win_package:
        path: "{{ hl_win_state_dir }}\\stage\\{{ hl_uf_packages.windows.file }}"
        arguments: >-
          AGREETOLICENSE=Yes LAUNCHSPLUNK=0 SERVICESTARTTYPE=auto INSTALLDIR="{{ hl_uf_win_home }}"
        log_path: "{{ hl_win_state_dir }}\\uf-msi-install.log"
        creates_path: "{{ hl_uf_win_home }}\\bin\\splunkd.exe"
        state: present

  always:
    - name: Remove the staging folder
      ansible.windows.win_file:
        path: "{{ hl_win_state_dir }}\\stage"
        state: absent

- name: Read the installed product code, the service SID and its account
  ansible.windows.win_shell: |
    $keys = @('HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Uninstall\*',
              'HKLM:\SOFTWARE\WOW6432Node\Microsoft\Windows\CurrentVersion\Uninstall\*')
    $p = Get-ItemProperty $keys -ErrorAction SilentlyContinue | Where-Object { $_.DisplayName -like 'UniversalForwarder*' } | Select-Object -First 1
    $sid = ((sc.exe showsid {{ hl_uf_win_service }}) -match 'SERVICE SID' | ForEach-Object { ($_ -split ':\s*')[1].Trim() } | Select-Object -First 1)
    $svc = Get-CimInstance Win32_Service -Filter "Name='{{ hl_uf_win_service }}'"
    @{ product_code = [string]$p.PSChildName; version = [string]$p.DisplayVersion
       service_sid = [string]$sid; account = [string]$svc.StartName } | ConvertTo-Json -Compress
  register: hl_ufw_ids
  changed_when: false
  failed_when: >-
    hl_ufw_ids.rc != 0 or (hl_ufw_ids.stdout | from_json).product_code | length == 0
    or (hl_ufw_ids.stdout | from_json).service_sid is not match('S-1-5-80-')

- name: Record the product code, the service SID and the groups (before they are joined)
  ansible.builtin.set_fact:
    hl_state: "{{ hl_state | combine({'uf': hl_state.uf | combine({'product_code': hl_ufw_id.product_code,
      'service_sid': hl_ufw_id.service_sid, 'account': hl_ufw_id.account, 'groups': hl_uf_win_groups | map(attribute='sid') | list})}) }}"
  vars:
    hl_ufw_id: "{{ hl_ufw_ids.stdout | from_json }}"

- name: Write the state file
  ansible.builtin.include_tasks: win_state_write.yml

# The groups below grant read access to the event logs and perfmon to this account only
- name: Check the service runs as the virtual account (check 2)
  ansible.builtin.assert:
    that: (hl_ufw_ids.stdout | from_json).account == hl_uf_win_account
    fail_msg: >-
      {{ hl_uf_win_service }} runs as {{ (hl_ufw_ids.stdout | from_json).account }}, not {{ hl_uf_win_account }}.
    quiet: true

# --- Before the first start ---
- name: Read Windows' FIPS policy
  ansible.windows.win_reg_stat:
    path: HKLM:\SYSTEM\CurrentControlSet\Control\Lsa\FipsAlgorithmPolicy
    name: Enabled
  register: hl_ufw_fips

- name: Note whether Windows' FIPS policy is on
  ansible.builtin.set_fact:
    hl_ufw_fips_on: "{{ hl_ufw_fips.exists | default(false) and (hl_ufw_fips.value | default(0) | int) == 1 }}"

- name: Turn on the UF's FIPS mode before its first start (only when Windows' FIPS policy is on)
  ansible.windows.win_shell: |
    $f = '{{ hl_uf_win_home }}\etc\splunk-launch.conf'
    $text = if (Test-Path -LiteralPath $f) { [IO.File]::ReadAllText($f) } else { '' }
    $added = @()
    foreach ($l in 'SPLUNK_FIPS=1', 'SPLUNK_FIPS_VERSION=140-3') {
      if ($text -notmatch ('(?m)^' + [regex]::Escape($l) + '\s*$')) { Add-Content -LiteralPath $f -Value $l; $added += $l }
    }
    "HL_ADDED=$($added -join ',')"
  register: hl_ufw_fips_lines
  changed_when: hl_ufw_fips_lines.stdout is search('HL_ADDED=\\S')
  when: hl_ufw_fips_on | bool

- name: Look for the UF's passwd file (user-seed.conf is read only when it is absent)
  ansible.windows.win_stat:
    path: "{{ hl_uf_win_home }}\\etc\\passwd"
  register: hl_ufw_passwd

- name: Seed the UF admin account (consumed on the first start)
  ansible.windows.win_copy:
    content: |
      [user_info]
      USERNAME = admin
      PASSWORD = {{ vault_hl_uf_admin_password }}
    dest: "{{ hl_uf_win_home }}\\etc\\system\\local\\user-seed.conf"
  when: not hl_ufw_passwd.stat.exists
  no_log: true

- name: Deploy hl_uf_outputs
  ansible.builtin.import_tasks: uf_windows_outputs.yml

# --- The virtual account's groups (spec 5.3: Event Log Readers; perfmon needs Performance Monitor Users) ---
- name: Add the virtual account to its groups
  ansible.windows.win_shell: |
    $sid = '{{ (hl_ufw_ids.stdout | from_json).service_sid }}'
    $added = @()
    foreach ($g in @({{ hl_uf_win_groups | map(attribute='sid') | map('to_json') | join(', ') }})) {
      $m = @(Get-LocalGroupMember -SID $g -ErrorAction Stop | Where-Object { $_.SID.Value -eq $sid })
      if ($m.Count -eq 0) { Add-LocalGroupMember -SID $g -Member $sid -ErrorAction Stop; $added += $g }
    }
    @{ added = $added } | ConvertTo-Json -Compress
  register: hl_ufw_groups
  changed_when: (hl_ufw_groups.stdout | from_json).added | length > 0

# --- Start, then prove the path through Cribl ---
# "<lines> <epoch>": where splunkd.log ends and the host's clock, just before the (re)start
- name: Note where splunkd.log ends before the start
  ansible.windows.win_shell: |
    $f = '{{ hl_uf_win_home }}\var\log\splunk\splunkd.log'
    $n = 0
    if (Test-Path -LiteralPath $f) {
      $fs = [IO.File]::Open($f, [IO.FileMode]::Open, [IO.FileAccess]::Read, [IO.FileShare]'ReadWrite, Delete')
      try { $sr = New-Object IO.StreamReader($fs); while ($null -ne $sr.ReadLine()) { $n++ } } finally { $fs.Dispose() }
    }
    "$n $([DateTimeOffset]::UtcNow.ToUnixTimeSeconds())"
  register: hl_ufw_log_lines
  changed_when: false

- name: Start the UF (restart when its outputs changed on a running UF)
  ansible.windows.win_service:
    name: "{{ hl_uf_win_service }}"
    start_mode: auto
    state: "{{ 'restarted' if (hl_uf_outputs_changed | bool and not hl_ufw_fresh | bool) else 'started' }}"
  register: hl_ufw_started

# Every run, so a rerun after a failed connect can't pass without one: after a (re)start from the
# start's log line, otherwise the whole log, where the latest state counts (as verify does)
- name: Check the UF is connected through Cribl
  ansible.builtin.include_tasks: uf_windows_connected.yml
  vars:
    hl_uf_log_from: "{{ (hl_ufw_log_lines.stdout.split()[0] | int) if hl_ufw_started is changed else 0 }}"
    hl_uf_since: "{{ (hl_ufw_log_lines.stdout.split()[1] | int) if hl_ufw_started is changed else 0 }}"

# Spec 4.1: 127.0.0.1:8089 on HOMEPC is Docker Desktop's publish of the Splunk container's REST.
# The UF must never listen on 8089, and anything it has on its own port must be loopback only.
- name: Check the UF's management listener (spec 4.1)
  ansible.windows.win_shell: |
    $svc = Get-CimInstance Win32_Service -Filter "Name='{{ hl_uf_win_service }}'"
    $mine = @(Get-NetTCPConnection -State Listen -ErrorAction SilentlyContinue | Where-Object { $_.OwningProcess -eq $svc.ProcessId })
    @{ pid = [int]$svc.ProcessId
       uf_listeners = @($mine | ForEach-Object { "$($_.LocalAddress):$($_.LocalPort)" })
       on_8089 = @(Get-NetTCPConnection -State Listen -LocalPort 8089 -ErrorAction SilentlyContinue |
         ForEach-Object { "$($_.LocalAddress) $((Get-Process -Id $_.OwningProcess).Name)" }) } | ConvertTo-Json -Compress
  register: hl_ufw_mgmt
  changed_when: false
  failed_when: >-
    hl_ufw_mgmt.rc != 0 or (hl_ufw_mgmt.stdout | from_json).pid == 0
    or (hl_ufw_mgmt.stdout | from_json).uf_listeners | select('search', ':8089$') | list | length > 0
    or (hl_ufw_mgmt.stdout | from_json).uf_listeners | reject('match', '^(127\\.0\\.0\\.1|::1):') | list | length > 0

# From the running splunkd, not `splunk show fips-mode` (it needs a login, task 4 check 5) and not
# splunkd.log, whose start lines are gone once the log rotates. On Windows the service starts
# splunkd.exe itself, which reads splunk-launch.conf, so the check is the file's two lines plus
# OpenSSL's FIPS 140-3 provider module loaded in the service process
# (lib\ossl-modules\fips140-3\fips.dll; the non-FIPS UF on HOMEPC loads neither it nor fips140-2).
- name: Check the UF runs in FIPS mode (only when Windows' FIPS policy is on)
  ansible.windows.win_shell:
    cmd: |
      $svc = Get-CimInstance Win32_Service -Filter "Name='{{ hl_uf_win_service }}'"
      if (-not $svc -or $svc.ProcessId -eq 0) { 'HL_PID=none'; exit 0 }
      "HL_PID=$($svc.ProcessId)"
      Select-String -LiteralPath '{{ hl_uf_win_home }}\etc\splunk-launch.conf' -Pattern '^SPLUNK_FIPS(_VERSION)?=' | ForEach-Object { $_.Line.Trim() }
      $m = @((Get-Process -Id $svc.ProcessId).Modules | Where-Object { $_.FileName -match '\\ossl-modules\\fips140-3\\fips\.dll$' })
      "HL_FIPS_MODULE=$(if ($m.Count -gt 0) { 'loaded' } else { 'absent' })"
  register: hl_ufw_fips_mode
  changed_when: false
  failed_when: >-
    'SPLUNK_FIPS=1' not in hl_ufw_fips_mode.stdout_lines
    or 'SPLUNK_FIPS_VERSION=140-3' not in hl_ufw_fips_mode.stdout_lines
    or 'HL_FIPS_MODULE=loaded' not in hl_ufw_fips_mode.stdout_lines
  when: hl_ufw_fips_on | bool

- name: Marker for the install
  ansible.builtin.include_tasks: marker_best_effort.yml
  vars:
    hl_marker_action: install
  when: hl_ufw_fresh | bool or hl_ufw_started is changed
