# apps_remove (uf_windows, spec 5.3/5.5): as on Linux. hl_uf_outputs stays unless named in
# hl_apps_only; the TA itself goes with --tags uninstall.
- name: Pick the apps to remove
  ansible.builtin.set_fact:
    hl_rmw_apps: "{{ hl_apps_only if hl_apps_only | length > 0 else (hl_uf_input_apps_windows + ['Splunk_TA_windows']) }}"

- name: Remove the role-owned apps (only those marked [hl] managed = true)
  ansible.windows.win_shell: |
    $removed = @()
    foreach ($a in @({{ hl_rmw_apps | reject('equalto', 'Splunk_TA_windows') | map('to_json') | join(', ') }})) {
      $d = Join-Path '{{ hl_uf_win_home }}\etc\apps' $a
      $f = Join-Path $d 'default\app.conf'
      if ((Test-Path -LiteralPath $f) -and ((Get-Content -LiteralPath $f -Raw) -match '(?ms)^\[hl\][^\[]*managed\s*=\s*(true|1)')) {
        Remove-Item -LiteralPath $d -Recurse -Force; $removed += $a
      }
    }
    if ({{ ('Splunk_TA_windows' in hl_rmw_apps) | ternary('$true', '$false') }}) {
      $ti = '{{ hl_uf_win_home }}\etc\apps\Splunk_TA_windows\local\inputs.conf'
      if (Test-Path -LiteralPath $ti) { Remove-Item -LiteralPath $ti -Force; $removed += 'Splunk_TA_windows/local/inputs.conf' }
    }
    @{ removed = $removed } | ConvertTo-Json -Compress
  register: hl_rmw_done
  changed_when: (hl_rmw_done.stdout | from_json).removed | length > 0

- name: Note whether the UF must restart
  ansible.builtin.set_fact:
    hl_rmw_restart: "{{ hl_rmw_done is changed }}"

- name: Marker for the removal
  ansible.builtin.include_tasks: marker.yml
  vars:
    hl_marker_action: apps_remove
  when: hl_rmw_restart | bool

- name: Restart the UF
  ansible.windows.win_service:
    name: "{{ hl_uf_win_service }}"
    state: restarted
  when: hl_rmw_restart | bool
