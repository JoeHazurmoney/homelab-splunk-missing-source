# Is the Windows UF sending through Cribl (127.0.0.1:9997)? Same rules as uf_linux_connected.yml:
# in the UF's splunkd.log after hl_uf_log_from, the latest "Connected to idx=" is newer than the
# latest token refusal; then Splunk has this host's _internal, under 120 s old.
- name: Wait for the UF to connect to Cribl
  ansible.windows.win_shell: |
    $log = '{{ hl_uf_win_home }}\var\log\splunk\splunkd.log'
    if (-not (Test-Path -LiteralPath $log)) { 'HL_CONNECTED=0'; 'HL_REFUSED=0'; exit 0 }
    $lines = @(Get-Content -LiteralPath $log | Select-Object -Skip {{ hl_uf_log_from | default(0) | int }})
    $lc = 0; $lr = 0
    for ($i = 0; $i -lt $lines.Count; $i++) {
      if ($lines[$i] -like '*Connected to idx={{ hl_collector }}:{{ hl_s2s_port }}*') { $lc = $i + 1 }
      if ($lines[$i] -match 'Invalid S2S token|Connection closed by server|unauthorized') { $lr = $i + 1 }
    }
    "HL_CONNECTED=$([int]($lc -gt $lr))"
    "HL_REFUSED=$([int]($lr -gt $lc))"
  register: hl_ufw_conn
  until: hl_ufw_conn.stdout is search('HL_CONNECTED=1') or hl_ufw_conn.stdout is search('HL_REFUSED=1')
  retries: "{{ (hl_uf_connect_timeout / 10) | int }}"
  delay: 10
  changed_when: false
  failed_when: hl_ufw_conn.rc != 0 or hl_ufw_conn.stdout is not search('HL_CONNECTED=1')

- name: Wait for this host's _internal in Splunk (through Cribl)
  ansible.windows.win_shell: |
    {{ hl_ps_prelude }}
    $h = '{{ inventory_hostname | lower | regex_replace('[.].*$', '') }}'
    $rows = Invoke-HlSearch ("| tstats max(_indextime) as t where index=_internal (host=$h OR host=$h.*) earliest=-15m | eval age=now()-t")
    $a = ($rows | Select-Object -First 1).age
    @{ age = $(if ("$a" -match '^\d+(\.\d+)?$') { [int][double]$a } else { -1 }) } | ConvertTo-Json -Compress
  delegate_to: "{{ hl_server_host }}"
  register: hl_ufw_seen
  until: hl_ufw_seen.rc == 0 and (hl_ufw_seen.stdout | from_json).age >= 0 and (hl_ufw_seen.stdout | from_json).age < 120
  retries: "{{ (hl_uf_connect_timeout / 10) | int }}"
  delay: 10
  changed_when: false
