# Run from this directory on the Pi (ansible-playbook site.yml). The vault password file is set by
# ANSIBLE_VAULT_PASSWORD_FILE (~/.bashrc.d/hl-ansible.sh, written by scripts/bootstrap-pi.sh), not
# here, so the repository still lints and syntax-checks where no vault password exists (CI).
[defaults]
inventory = inventory/hosts.yml
roles_path = roles
private_key_file = ~/.ssh/id_ecdsa_homelab_ansible
interpreter_python = auto_silent
forks = 10
retry_files_enabled = false
callback_result_format = yaml

[privilege_escalation]
become_method = sudo

[ssh_connection]
# accept-new: trust on first use, then refuse a changed host key (home LAN; keys are never
# overwritten silently). The VMs' jump through the PC is set in group_vars/uf_linux.yml.
ssh_args = -C -o ControlMaster=auto -o ControlPersist=60s -o ServerAliveInterval=30 -o StrictHostKeyChecking=accept-new
pipelining = true
