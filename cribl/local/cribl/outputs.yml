# Cribl Stream destinations (spec §4.2, §5.5). Managed by the homelab_splunk role (`cribl` tag),
# rendered from the vault on the controller. out_splunk reaches wd2l-splunk's splunktcp 9997 over
# the Docker network hl-net (by container name), presenting the same token as the UFs
# (splunktcptoken hl_cribl in hl_server_base).
outputs:
  out_splunk:
    type: splunk
    host: wd2l-splunk
    port: 9997
    tls:
      disabled: true
    authType: manual
    authToken: "{{ vault_hl_s2s_token }}"
    nestedFields: none
    throttleRatePerSec: "0"
    connectionTimeout: 10000
    writeTimeout: 60000
    # The spike lost ≈ 30 s on a splunkd restart with enableACK true and maxS2Sversion v3
    # (§14.7 g). v4 is the first option to test, in task 4 (spec §14.10 check 15).
    enableACK: true
    maxS2Sversion: v4
    # Cribl adds the indexed field cribl_pipe by default (spike §14.7 b); [] adds nothing.
    systemFields: []
    # Persistent queue: engages when Splunk refuses or blocks (spike: ≤ 17 s, drained ≤ 21 s).
    onBackpressure: queue
    pqMode: error
    pqMaxFileSize: 1 MB
    pqMaxSize: 5GB
    pqPath: $CRIBL_HOME/state/queues
    pqCompress: none
    pqOnBackpressure: block
  default:
    type: default
    defaultId: out_splunk
