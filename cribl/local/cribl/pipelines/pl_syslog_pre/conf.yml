# Pre-processing pipeline of every syslog device source (spec §3 UDM row, §4.2). Cribl's syslog
# source takes _time from the syslog header (spike §14.7 d), and UniFi's header has no time zone,
# so _time becomes Cribl's receive time. Task 8 may switch this off if a real CEF sample shows a
# reliable timestamp with a zone. Managed by the homelab_splunk role (`cribl` tag).
output: default
streamtags: []
groups: {}
asyncFuncTimeout: 1000
description: Syslog devices - _time = Cribl's receive time
functions:
  - id: eval
    filter: "true"
    disabled: false
    description: Receive time, not the device header time
    conf:
      add:
        - name: _time
          value: Date.now() / 1000
