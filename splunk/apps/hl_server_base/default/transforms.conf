# The Splunk-side test-block table (spec §7.2): the mirror of Cribl's table. The block itself runs
# in Cribl (spike §14.7 c); a row here blocks nothing, it only labels. The role's cribl_block tag
# is the only writer of this file (task 11b): hl_data_health reads it (dh_lookup_blocks), and neither
# the Manage form nor DH Prune writes it any more. The role ships the empty file once and never
# overwrites it.
[hl_ingest_block]
filename = hl_ingest_block.csv
