# Roles for the data-health app (spec §6 item 4, §5.5). Splunk's user/power roles are limited to
# enclave1;wd2l by wd2l's authorize.conf, so every role here lists its indexes explicitly.
# Analysts get no run_collect (spec §6): Splunk's `user` role has it, and system/default's
# [default] stanza grants run_collect, run_mcollect and schedule_rtsearch to every role, so neither
# role imports `user`, and both switch those three off explicitly.

# Read and mute.
[role_dh_analyst]
search = enabled
get_metadata = enabled
get_typeahead = enabled
input_file = enabled
output_file = enabled
list_all_objects = enabled
list_metrics_catalog = enabled
rest_apps_view = enabled
rest_properties_get = enabled
change_own_password = enabled
edit_own_objects = enabled
export_results_is_visible = enabled
run_collect = disabled
run_mcollect = disabled
schedule_rtsearch = disabled
srchIndexesAllowed = linux;windows;network;cribl;cribl_metrics;data_health;enclave1;wd2l
srchIndexesDefault = linux;windows;network
srchJobsQuota = 6
rtSrchJobsQuota = 0
srchDiskQuota = 100
srchMaxTime = 100days

# Expectations and test blocks, on top of everything the analyst has (the dashboards check for
# this role by name, macros dh_ui_*).
[role_dh_admin]
importRoles = dh_analyst
run_collect = disabled
run_mcollect = disabled
schedule_rtsearch = disabled

# wd2l_uf_audit mirrors wd2l_audit: readable by wd2l_auditor and admin only (spec §4.4). wd2l's own
# authorize.conf sets wd2l_auditor's srchIndexesAllowed, and a local value beats this app's
# default for the same key, so the index is added through an imported role instead: Splunk joins
# an imported role's indexes to the role's own. The helper role holds no capabilities and no users.
[role_hl_wd2l_uf_audit_reader]
srchIndexesAllowed = wd2l_uf_audit
run_collect = disabled
run_mcollect = disabled
schedule_rtsearch = disabled

[role_wd2l_auditor]
importRoles = hl_wd2l_uf_audit_reader
