# Search-time props only (exported system in metadata/default.meta). Splunk applies no index-time
# rule to what Cribl delivers (spike §14.7 c), so nothing here breaks lines, sets timestamps or
# transforms at index time. Never [syslog] (wd2l's).

# pi5's device probe: time=<iso8601> device=udm ip=192.168.1.1 reachable=1 rtt_ms=0.8 (spec §4.4)
[hl:devprobe]
KV_MODE = auto

# Cribl's internal logs (JSON lines, CriblLogs source)
[cribl]
KV_MODE = json

# Cribl's audit log (JSON lines, File Monitor in_cribl_audit)
[cribl:audit]
KV_MODE = json

# The Ansible markers posted to HEC token hl_markers (index=data_health source=dh:marker)
[hl:marker]
KV_MODE = json
