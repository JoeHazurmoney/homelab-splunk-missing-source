# The homelab collection's indexes (spec §4.4). server_remove deletes these definitions; the data
# on disk stays unless the role runs with -e hl_purge_index_data=true. enclave1, wd2l and
# wd2l_audit belong to the wd2l app and are not defined here.

# UF data, through Cribl
[linux]
homePath   = $SPLUNK_DB/linux/db
coldPath   = $SPLUNK_DB/linux/colddb
thawedPath = $SPLUNK_DB/linux/thaweddb

[windows]
homePath   = $SPLUNK_DB/windows/db
coldPath   = $SPLUNK_DB/windows/colddb
thawedPath = $SPLUNK_DB/windows/thaweddb

# The UDM's syslog (Cribl, 5514/udp) and pi5's device probe
[network]
homePath   = $SPLUNK_DB/network/db
coldPath   = $SPLUNK_DB/network/colddb
thawedPath = $SPLUNK_DB/network/thaweddb

# Cribl's own internal logs and its audit log (spike §14.7 f)
[cribl]
homePath   = $SPLUNK_DB/cribl/db
coldPath   = $SPLUNK_DB/cribl/colddb
thawedPath = $SPLUNK_DB/cribl/thaweddb

# Cribl's internal metrics: they arrive without values in an event index (spike §14.7 f)
[cribl_metrics]
datatype   = metric
homePath   = $SPLUNK_DB/cribl_metrics/db
coldPath   = $SPLUNK_DB/cribl_metrics/colddb
thawedPath = $SPLUNK_DB/cribl_metrics/thaweddb

# Data-health records, written with collect (sourcetype stash) and the Ansible markers. Same paths
# as the index task 9 created over REST, so existing data stays readable.
[data_health]
homePath   = $SPLUNK_DB/data_health/db
coldPath   = $SPLUNK_DB/data_health/colddb
thawedPath = $SPLUNK_DB/data_health/thaweddb

# wd2l's audit trail as the UFs read it from /var/log/wd2l/audit-*.jsonl. Readable by
# wd2l_auditor and admin only (authorize.conf); kept 366 days, mirroring wd2l_audit.
[wd2l_uf_audit]
homePath   = $SPLUNK_DB/wd2l_uf_audit/db
coldPath   = $SPLUNK_DB/wd2l_uf_audit/colddb
thawedPath = $SPLUNK_DB/wd2l_uf_audit/thaweddb
frozenTimePeriodInSecs = 31622400
