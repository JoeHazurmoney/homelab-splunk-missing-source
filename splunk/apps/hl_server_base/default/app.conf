# hl_server_base: the homelab collection's server side on wd2l-splunk (spec §5.5): indexes, the
# S2S token Cribl sends with, the Ansible marker HEC token, search-time props, the data-health
# roles and the Splunk-side hl_ingest_block table. Deployed by the role's `server` tag.
[install]
is_configured = true
state = enabled

[ui]
is_visible = false
label = HL Server Base

[launcher]
author = homelab
description = Indexes, S2S and marker tokens, search-time props and roles for the homelab collection.
version = 0.1.0

[package]
id = hl_server_base
check_for_updates = false

# Role-owned marker: the role removes only apps with this flag (spec §5.5).
[hl]
managed = true
