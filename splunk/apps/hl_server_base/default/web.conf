# Turns off Dashboard Studio's risky-command check (Taylor, 2026-11-07; spec §7.8, §13). Manage's
# Apply writes with outputlookup, which is on Studio's own risky list, so Studio held every Apply
# until the viewer clicked "Run Query" in "This visualization has a potential security risk".
# Affects every dashboard on this Splunk, wd2l's included. The Search page check
# (enable_risky_command_check) stays on. Needs a splunkd restart (the `server` tag restarts on a
# web.conf change). To revert: delete this file or set the value to true, then restart splunkd.
[settings]
enable_risky_command_check_dashboard = false
