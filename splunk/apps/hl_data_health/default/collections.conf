# KV store collections of the data-health model (spec §7.2). One writer per collection: a KV
# key_field upsert replaces the whole record, so only the named writer may write it.
# Times are epoch seconds. entity_id = level|index|host|sourcetype|source_norm, with "*" for the
# parts a level doesn't use (host|*|<host>|*|*, sourcetype|<index>|<host>|<sourcetype>|*).

# Writer: DH Sync expected (task 10, */5) + the Manage dashboard (task 12). The authoritative list.
[dh_expected]
field.entity_id = string
field.level = string
field.index = string
field.host = string
field.sourcetype = string
field.source = string
field.collection = string
field.via = string
field.hypervisor = string
field.profile = string
field.interval_secs = number
field.max_gap_secs = number
field.criticality = number
field.owner = string
field.site = string
field.runbook = string
field.description = string
field.managed_by = string
field.enabled = number
field.expected_since = number
field.retired_by = string
field.retired_at = number
field.retired_reason = string
field.retired_ticket = string
field.retired_hold = number
accelerated_fields.dh_entity = {"entity_id": 1}
accelerated_fields.dh_host = {"host": 1}

# Writers: the Manage retire form (#48) rotates it on every apply; DH Sync expected creates it when it
# is missing. One row, _key=retire: a random nonce that the retire confirmation token covers, so a
# Manage link built by someone who can't read it (analysts: metadata) never applies (final review
# M4). Readable and writable by admin and dh_admin only.
[dh_retire_nonce]
field.nonce = string
field.rotated_at = number

# Writer: the Manage dashboard (task 12). _key = entity_id; a host row mutes the host's children.
[dh_overrides]
field.entity_id = string
field.mute_until = number
field.reason = string
field.ticket = string
field.threshold_override_secs = number
field.set_by = string
field.set_at = number
accelerated_fields.dh_entity = {"entity_id": 1}

# Writer: DH Tracker fast only. _key = index|host|sourcetype|source_norm (normalized).
[dh_state_fast]
field.index = string
field.host = string
field.sourcetype = string
field.source = string
field.first_seen = number
field.last_indextime = number
field.last_eventtime = number
field.last_count = number
field.lag = number
field.clock_skew = number
field.updated = number
accelerated_fields.dh_host = {"host": 1}

# Writer: DH Tracker slow only. Same shape as dh_state_fast.
[dh_state_slow]
field.index = string
field.host = string
field.sourcetype = string
field.source = string
field.first_seen = number
field.last_indextime = number
field.last_eventtime = number
field.last_count = number
field.lag = number
field.clock_skew = number
field.updated = number
accelerated_fields.dh_host = {"host": 1}

# Writer: DH Tracker fast only. _key = normalized host. Per-host liveness facts: UF heartbeat,
# tcpin connection, Ansible markers, Hyper-V lifecycle events, device probe results.
[dh_fwd]
field.host = string
field.guid = string
field.version = string
field.os = string
field.fwd_type = string
field.last_heartbeat = number
field.last_tcpin = number
field.last_marker_action = string
field.last_marker_time = number
field.last_marker_by = string
field.last_marker_run_id = string
field.last_vm_event = number
field.last_vm_event_time = number
field.last_probe_time = number
field.last_probe_up = number
field.last_probe_reachable = number
field.updated = number
accelerated_fields.dh_host = {"host": 1}

# Writer: DH Baseline compute (task 11). _key = entity_id. days = covered days (>= 50%) of the
# last 14, skipped_days the others. learned_gap_secs is
# 1.5 x p90(daily max gap, 14 d) + 120 s, before the profile clamp (the evaluator clamps).
[dh_baseline]
field.entity_id = string
field.learned_gap_secs = number
field.days = number
field.suggested_profile = string
field.hourly_median = string
field.p90_max_gap_secs = number
field.skipped_days = number
field.last_day = number
field.updated = number
accelerated_fields.dh_entity = {"entity_id": 1}

# Writer: DH Evaluate only. _key = entity_id.
[dh_status]
field.entity_id = string
field.level = string
field.index = string
field.host = string
field.sourcetype = string
field.source = string
field.collection = string
field.via = string
field.profile = string
field.criticality = number
field.owner = string
field.site = string
field.runbook = string
field.description = string
field.status = string
field.since = number
field.prev_status = string
field.real_status = string
field.real_since = number
field.changed = number
field.cause_code = string
field.cause = string
field.action = string
field.threshold_secs = number
field.threshold_origin = string
field.threshold_note = string
field.learning = number
field.age_secs = number
field.last_indextime = number
field.last_eventtime = number
field.first_seen = number
field.lag = number
field.clock_skew = number
field.muted_until = number
field.mute_reason = string
field.test_block_until = number
field.test_block_reason = string
field.host_rollup = string
field.liveness = string
field.expected_since = number
field.evaluated_at = number
accelerated_fields.dh_entity = {"entity_id": 1}
accelerated_fields.dh_host = {"host": 1}

# Writers: the trackers and DH Admin log copy, each its own row (_key = name: tracker_fast,
# tracker_slow, admin_copy; admin_copy keeps the copy high-water mark in hwm).
# Run times for staleness and resume detection (the evaluator's gate).
[dh_meta]
field.name = string
field.last_run = number
field.prev_run = number
field.resumed_at = number
field.last_rx = number
field.rows = number
field.fwd_rows = number
field.hwm = number
field.updated = number

# Writer: the Manage dashboard (append). Every mute/override/block/edit; copied to data_health
# by DH Admin log copy (task 11).
[dh_admin_log]
field.time = number
field.actor = string
field.action = string
field.entity_id = string
field.detail = string
field.reason = string
field.ticket = string

# Writer: DH Tamper (task 11). _key = finding_id = host|code|5-min bucket. Every tamper finding
# (spec §7.6 indicators) with its marker-window suppression, re-evaluated on every run for findings
# of the last 7 d; the evaluator reads host, time, indicator and suppressed, and flags "possible
# deliberate blinding" only for unsuppressed ones. Whether a finding (or its suppression) is
# already in index=data_health source=dh:tamper is read from that index. Not listed in §7.2: added because the evaluator reads only
# lookups (task 9 ruling). Pruned after 30 d.
[dh_tamper]
field.host = string
field.time = number
field.code = string
field.indicator = string
field.detail = string
field.events = number
field.finding_id = string
field.bucket = number
field.suppressed = number
field.marker_action = string
field.marker_time = number
field.marker_by = string
field.marker_run_id = string
field.fold_keys = string
field.fold_events = number
field.state = string
field.held = number
field.explained_by = string
field.explanation = string
field.back_at = number
field.updated = number
accelerated_fields.dh_host = {"host": 1}

# Writer: DH Volume hourly (task 11). _key = entity_id. The last full hour against the 14-day
# same-hour median (dh_baseline.hourly_median); flagged=1 is the volume flag (spec §7.6). Flagged
# hours also go to index=data_health source=dh:volume. Pruned after 2 d.
[dh_volume]
field.entity_id = string
field.dh_host = string
field.hour = number
field.count = number
field.median = number
field.ratio = number
field.flagged = number
field.note = string
field.updated = number
accelerated_fields.dh_entity = {"entity_id": 1}
