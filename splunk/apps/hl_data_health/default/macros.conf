# hl_data_health macros (spec §7). The evaluator is one macro over lookup names,
# `dh_eval(...)`, composed of focused steps so that tests (tests/spl/run.sh) can run it on
# fixture lookups and later tasks (11, 12) can reuse the pieces:
#   dh_eval_load -> dh_eval_facts -> dh_eval_gate_read -> dh_eval_blocks -> dh_profile_defaults
#   -> dh_threshold -> dh_eval_mute -> dh_eval_liveness -> dh_eval_status -> dh_eval_transition
#   -> dh_eval_rollup -> dh_eval_cause -> dh_eval_cause_text -> dh_eval_output
# Regexes use [.] and [0-9] rather than backslashes (spec §7.7). Task 11 adds the baseline,
# volume, tamper, alert, admin-log, prune and daily-report steps at the end of the file.

########## Lookup names (tests substitute fixture lookups through dh_eval's arguments)
[dh_lookup_expected]
definition = dh_expected

[dh_lookup_state_fast]
definition = dh_state_fast

[dh_lookup_state_slow]
definition = dh_state_slow

[dh_lookup_fwd]
definition = dh_fwd

[dh_lookup_overrides]
definition = dh_overrides

[dh_lookup_baseline]
definition = dh_baseline

[dh_lookup_meta]
definition = dh_meta

# The test-block table, owned by hl_server_base (task 3, exported to system). Until it exists the
# evaluator reads nothing from it (dh_eval_blocks uses inputlookup append=true, which tolerates a
# missing lookup).
[dh_lookup_blocks]
definition = hl_ingest_block

# Tamper findings, written by DH Tamper (task 11).
[dh_lookup_tamper]
definition = dh_tamper

[dh_lookup_status]
definition = dh_status

# Task 11: volume flags (written by DH Volume hourly) and the admin log (written by the UI).
[dh_lookup_volume]
definition = dh_volume

[dh_lookup_admin_log]
definition = dh_admin_log

########## Entities and normalization (§7.1)
# Indexes the trackers watch. wd2l_audit and data_health are deliberately absent, and cribl_metrics
# too: it is a metrics index whose dimensions carry the data's hosts and sourcetypes (spec 11 row 10).
[dh_indexes]
definition = linux, windows, network, wd2l_uf_audit, enclave1, wd2l, cribl

# Eval expression: lowercase, strip the domain (same rule as the ingest test block's h).
[dh_host_norm(1)]
args = h
definition = lower(replace($h$, "[.].*", ""))

# Eval expression: timestamps (2026-10-30, 20261030, with an optional time; 10-13 digit epochs)
# become *, a rotation suffix (.1, .2.gz) becomes .*, and runs of * collapse.
[dh_source_norm(1)]
args = s
definition = replace(replace(replace(replace($s$, "[0-9]{4}[-_.]?[0-9]{2}[-_.]?[0-9]{2}([T_ -]?[0-9]{2}[:.-]?[0-9]{2}([:.-]?[0-9]{2})?)?", "*"), "[0-9]{10,13}", "*"), "[.][0-9]+([.](gz|bz2|xz|zst))?$", ".*"), "[*]+", "*")

# Eval expression: the three entity_ids a normalized state row (index host sourcetype source)
# counts toward: its source, its sourcetype and its host.
[dh_state_entity_ids]
definition = mvappend("source|".index."|".host."|".sourcetype."|".source, "sourcetype|".index."|".host."|".sourcetype."|*", "host|*|".host."|*|*")

# The enabled expected rows, normalized, one per entity_id (shared by the evaluator, the daily
# baseline and prune). Only 0/false/no/off (any case, trimmed) or a numeric 0 disable a row.
[dh_expected_rows(1)]
args = expected
definition = inputlookup $expected$ \
| eval level=lower(coalesce(level, "sourcetype")), dh_en=if(isnull(enabled), "", lower(trim(tostring(enabled)))) \
| eval dh_off=case(dh_en=="0" OR dh_en=="false" OR dh_en=="no" OR dh_en=="off", 1, isnotnull(tonumber(dh_en)) AND tonumber(dh_en)==0, 1, true(), 0) \
| where dh_off==0 \
| fields - dh_en dh_off \
| eval dh_rt="e", source_raw=source, host=`dh_host_norm(host)`, via=if(isnull(via) OR via=="", null(), `dh_host_norm(via)`), \
       index=if(level=="host", "*", index), sourcetype=if(level=="host", "*", sourcetype), source=if(level=="source", `dh_source_norm(source)`, "*") \
| eval entity_id=level."|".index."|".host."|".sourcetype."|".source \
| dedup entity_id

########## Tunables
# The host that runs hl-devprobe (the role's hl_probe_host), named in the probe causes (task 11b).
[dh_probe_host]
definition = "pi5"

# |_indextime - _time| above this flags clock_skew.
[dh_skew_secs]
definition = 600

# Gate (§7.3): fast tracker older than this -> PENDING.
[dh_gate_stale_secs]
definition = 120

# Gate: nothing received for this long -> PENDING ("Splunk not receiving").
[dh_gate_rx_secs]
definition = 120

# Gate: hold this long after a resume (a gap in the fast tracker's run times).
[dh_gate_resume_secs]
definition = 300

# A gap between fast-tracker runs longer than this is a resume (sleep, restart, outage).
[dh_resume_gap_secs]
definition = 150

# Expected but never seen for longer than this -> NEVER_SEEN (before: PENDING).
[dh_never_seen_secs]
definition = 3600

# A tamper finding counts for a row when it is this many seconds or less from the silence. It is
# also the marker window of DH Tamper: a finding is suppressed (the role's own work) when one of its
# host's markers came at most this long before it. The evaluator itself never looks at markers: it
# ignores the findings DH Tamper stored as suppressed (final review I2, #49).
[dh_tamper_window_secs]
definition = 900

# Clock slack of the marker window: a marker up to this many seconds AFTER a finding still
# suppresses it. Markers are stamped with the controller's clock (pi5) and findings with the host's,
# and the role posts its marker just before each change, so a few seconds of skew must not turn the
# role's own work into a finding. A marker posted later than this (a restore run after the fact)
# never hides a finding (#49).
[dh_tamper_marker_slack_secs]
definition = 60

########## Profiles and thresholds (§7.4)
# Per-profile default, learned floor/cap, and whether the profile learns. The profile is trimmed
# and lowercased; anything else (empty, a typo) becomes continuous with dh_invalid_profile=1, so
# it still alerts and dh_threshold reports threshold_origin=invalid_profile.
[dh_profile_defaults]
definition = eval dh_profile_raw=profile, profile=lower(trim(profile)), dh_iv=tonumber(interval_secs) \
| eval dh_invalid_profile=if(profile=="heartbeat" OR profile=="periodic" OR profile=="continuous" OR profile=="sporadic" OR profile=="info", 0, 1) \
| eval profile=if(dh_invalid_profile==1, "continuous", profile) \
| eval dh_default_secs=case(profile=="heartbeat", 90, profile=="periodic", if(dh_iv>0, 2*dh_iv+60, 900), profile=="continuous", 900, profile=="sporadic", 86400), \
       dh_floor_secs=case(profile=="continuous", 300, profile=="sporadic", 7200), \
       dh_cap_secs=case(profile=="continuous", 3600, profile=="sporadic", 604800), \
       dh_learnable=if(dh_invalid_profile==0 AND (profile=="continuous" OR profile=="sporadic"), 1, 0)

# Precedence: override > max_gap_secs > learned (clamped, >= 3 days) > profile default.
# Needs: ov_threshold_secs, max_gap_secs, bl_learned_gap_secs, bl_days and dh_profile_defaults.
[dh_threshold]
definition = eval dh_ov=tonumber(ov_threshold_secs), dh_mg=tonumber(max_gap_secs), bl_days=coalesce(tonumber(bl_days), 0), dh_lg=tonumber(bl_learned_gap_secs) \
| eval dh_learned=if(dh_learnable==1 AND bl_days>=3 AND dh_lg>0, min(max(dh_lg, dh_floor_secs), dh_cap_secs), null()), \
       learning=if(dh_learnable==1 AND bl_days<3, 1, 0) \
| eval threshold_origin=case(profile=="info", "none", dh_ov>0, "override", dh_mg>0, "max_gap_secs", dh_invalid_profile==1, "invalid_profile", isnotnull(dh_learned), "learned", isnotnull(dh_default_secs), "default", true(), "none") \
| eval threshold_secs=case(threshold_origin=="override", dh_ov, threshold_origin=="max_gap_secs", dh_mg, threshold_origin=="learned", dh_learned, threshold_origin=="default" OR threshold_origin=="invalid_profile", dh_default_secs), \
       threshold_note=case(threshold_origin=="override", "override from dh_overrides", \
                           threshold_origin=="max_gap_secs", "max_gap_secs from the expected row", \
                           threshold_origin=="invalid_profile", "invalid profile '".coalesce(dh_profile_raw, "")."': treated as continuous", \
                           threshold_origin=="learned", "learned from ".bl_days." days (clamp ".dh_floor_secs."-".dh_cap_secs." s)", \
                           learning==1, "profile default while learning (".bl_days." of 3 days)", \
                           threshold_origin=="default", "profile default (".profile.")", \
                           true(), "info: never alerts")

########## Statuses (§7.5)
# Active mutes: the entity's own row, or its host's row (cascade). Expired mutes are ignored.
[dh_eval_mute]
definition = eval dh_mu_e=if(tonumber(ov_mute_until)>dh_now, tonumber(ov_mute_until), null()), dh_mu_h=if(tonumber(ovh_mute_until)>dh_now, tonumber(ovh_mute_until), null()) \
| eval muted_until=case(isnotnull(dh_mu_e) AND isnotnull(dh_mu_h), max(dh_mu_e, dh_mu_h), isnotnull(dh_mu_e), dh_mu_e, isnotnull(dh_mu_h), dh_mu_h), \
       mute_reason=case(isnotnull(dh_mu_h) AND (isnull(dh_mu_e) OR dh_mu_h>=dh_mu_e), ovh_reason, isnotnull(dh_mu_e), ov_reason), \
       muted=if(isnotnull(muted_until), 1, 0)

# Host rows: liveness comes from the UF heartbeat (collection=uf), the device probe (last time
# the probe saw it reachable), or else the host's data in any index.
[dh_eval_liveness]
definition = eval liveness=case(level!="host", null(), collection=="uf", "heartbeat", isnotnull(fw_probe_time), "probe", true(), "data") \
| eval last_indextime=case(liveness=="heartbeat", tonumber(fw_hb), liveness=="probe", tonumber(fw_probe_up), true(), last_indextime)

# The real status, before the gate. Ages are measured at the data's as-of time: the fast
# tracker's last run (when the gate is open), not dh_now, because the evaluator can read state
# up to a minute old (both run every minute). A missing expected_since starts the NEVER_SEEN
# grace now, and is kept through dh_status (pv_expected_since) so the grace ends. age_secs is
# clamped at 0: state can be newer than the tracker run it is measured against.
[dh_eval_status]
definition = eval dh_asof=if(isnull(dh_gate) AND isnotnull(mt_last_run) AND mt_last_run<dh_now, mt_last_run, dh_now), \
       expected_since=coalesce(tonumber(expected_since), tonumber(pv_expected_since), dh_now) \
| eval age_secs=if(isnotnull(last_indextime), max(0, dh_asof-last_indextime), null()) \
| eval status=case(muted==1, "MUTED", profile=="info", "INFO", \
                   isnull(last_indextime) AND dh_now-expected_since>`dh_never_seen_secs`, "NEVER_SEEN", \
                   isnull(last_indextime), "PENDING", \
                   age_secs>2*threshold_secs, "MISSING", age_secs>threshold_secs, "LATE", true(), "OK")

# Gate (§7.3) from the fast tracker's dh_meta row: stale tracker, nothing received, or a resume.
[dh_eval_gate_read(1)]
args = meta
definition = eval dh_meta_key="tracker_fast" \
| lookup $meta$ name AS dh_meta_key OUTPUT last_run AS mt_last_run resumed_at AS mt_resumed_at last_rx AS mt_last_rx \
| eval mt_last_run=tonumber(mt_last_run), mt_resumed_at=tonumber(mt_resumed_at), mt_last_rx=tonumber(mt_last_rx) \
| eval dh_gate=case(isnull(mt_last_run) OR dh_now-mt_last_run>`dh_gate_stale_secs`, "stale", \
                    isnull(mt_last_rx) OR dh_now-mt_last_rx>`dh_gate_rx_secs`, "no_rx", \
                    isnotnull(mt_resumed_at) AND dh_now-mt_resumed_at<`dh_gate_resume_secs`, "resume")

# Apply the gate, carry the real status through it, and decide since/changed. A gated or newly
# expected (PENDING) row never makes a transition; a new entity's first OK isn't one either.
# prev_status is the real status before the current one: it moves only when the real status changes.
[dh_eval_transition]
definition = eval dh_real=status \
| eval real_status=if(isnotnull(dh_gate), pv_real_status, dh_real), \
       real_since=case(isnotnull(dh_gate), tonumber(pv_real_since), dh_real==pv_real_status AND isnotnull(pv_real_since), tonumber(pv_real_since), true(), dh_now), \
       prev_status=if(isnull(dh_gate) AND dh_real!=coalesce(pv_real_status, ""), pv_real_status, pv_prev_status), \
       changed=if(isnull(dh_gate) AND dh_real!="PENDING" AND dh_real!=coalesce(pv_real_status, "") AND NOT (dh_real=="OK" AND (isnull(pv_real_status) OR pv_real_status=="PENDING")), 1, 0), \
       status=if(isnotnull(dh_gate), "PENDING", dh_real) \
| eval since=case(status==pv_status AND isnotnull(pv_since), tonumber(pv_since), isnull(dh_gate), real_since, true(), dh_now)

# Host roll-up (§7.5): DOWN = liveness missing, or (no heartbeat/probe) every stream missing;
# DEGRADED = something LATE/MISSING/NEVER_SEEN; MUTED/PENDING when the host is muted/gated.
# MUTED, INFO and PENDING rows don't count. Also flags dependants of a DOWN relay (via).
[dh_eval_rollup]
definition = eval dh_counts=if(status=="MUTED" OR status=="INFO" OR status=="PENDING", 0, 1) \
| eval dh_bad=if(dh_counts==1 AND (status=="LATE" OR status=="MISSING" OR status=="NEVER_SEEN"), 1, 0), \
       dh_hard=if(dh_counts==1 AND (status=="MISSING" OR status=="NEVER_SEEN"), 1, 0), \
       dh_child=if(level!="host" AND dh_counts==1, 1, 0) \
| eventstats sum(dh_child) as h_children, sum(eval(if(dh_child==1 AND dh_hard==1, 1, 0))) as h_children_hard, \
             sum(eval(if(dh_child==1 AND dh_bad==1, 1, 0))) as h_children_bad, sum(dh_bad) as h_bad, \
             max(eval(if(level=="host", status, null()))) as h_live_status, max(eval(if(level=="host", liveness, null()))) as h_liveness, \
             max(eval(if(level=="host" AND status=="MUTED", 1, 0))) as h_muted by host \
| eval h_liveness=coalesce(h_liveness, "data"), h_live_ok=case(isnull(h_live_status), null(), h_live_status=="OK", 1, true(), 0), \
       h_down=if(h_live_status=="MISSING" OR h_live_status=="NEVER_SEEN" OR (h_liveness=="data" AND h_children>0 AND h_children_hard==h_children), 1, 0) \
| eval host_rollup=case(h_muted==1, "MUTED", isnotnull(dh_gate), "PENDING", h_down==1, "DOWN", h_bad>0, "DEGRADED", true(), "OK") \
| eval dh_down_host=if(host_rollup=="DOWN", host, null()) \
| eventstats values(dh_down_host) as dh_down_hosts \
| eval relay_down=if(isnotnull(via) AND isnotnull(dh_down_hosts) AND isnotnull(mvmap(dh_down_hosts, if(dh_down_hosts==via, 1, null()))), 1, 0)

########## Likely cause -> action (§7.6)
[dh_eval_cause]
definition = eval dh_need=if(status=="LATE" OR status=="MISSING" OR status=="NEVER_SEEN", 1, 0), fw_marker_time=tonumber(fw_marker_time), fw_vm_event=tonumber(fw_vm_event) \
| eval tp_z=if(dh_need==1 AND isnotnull(tp_time) AND isnotnull(last_indextime), mvzip(tp_time, tp_indicator, "#|#"), null()) \
| eval tp_hit=if(isnotnull(tp_z), mvmap(tp_z, if(isnull(mvfind(tp_stime, "^".mvindex(split(tp_z, "#|#"), 0)."$")) AND abs(tonumber(mvindex(split(tp_z, "#|#"), 0))-last_indextime)<=`dh_tamper_window_secs`, tp_z, null())), null()) \
| eval tamper_time=tonumber(mvindex(split(mvindex(tp_hit, 0), "#|#"), 0)), tamper_indicator=mvindex(split(mvindex(tp_hit, 0), "#|#"), 1) \
| eval cause_code=case(isnotnull(dh_gate), "gate_".dh_gate, status=="MUTED", "muted", status=="PENDING", "new_expected", dh_need==0, null(), \
                       isnotnull(test_block_until), "test_block", \
                       isnotnull(h_live_status) AND h_live_ok==0 AND fw_marker_action=="stop", "ansible_stop", \
                       isnotnull(h_live_status) AND h_live_ok==0 AND fw_marker_action=="uninstall", "ansible_uninstall", \
                       isnotnull(h_live_status) AND h_live_ok==0 AND (fw_vm_event==18502 OR fw_vm_event==18504 OR fw_vm_event==18508 OR fw_vm_event==18510), "vm_off", \
                       isnotnull(tamper_time), "tamper", \
                       relay_down==1, "relay_down", \
                       h_liveness=="probe" AND h_live_ok==0 AND tonumber(fw_probe_reachable)==0, "probe_unreachable", \
                       h_liveness=="probe" AND h_live_ok==0, "probe_stale", \
                       h_liveness=="probe", "probe_no_logs", \
                       h_liveness=="heartbeat" AND h_live_status=="LATE", "hb_late", \
                       h_liveness=="heartbeat" AND h_live_ok==0, "hb_missing", \
                       sourcetype=="hl:devprobe" AND h_liveness=="heartbeat" AND h_live_ok==1, "probe_stale", \
                       h_liveness=="heartbeat" AND status=="NEVER_SEEN", "hb_ok_never_seen", \
                       h_liveness=="heartbeat" AND h_children>0 AND h_children_hard==h_children, "hb_ok_all_missing", \
                       h_liveness=="heartbeat", "hb_ok_input_missing", \
                       host_rollup=="DOWN", "host_no_data", \
                       status=="NEVER_SEEN", "never_seen", \
                       h_liveness=="data" AND h_children>0 AND h_children_bad==h_children, "host_late", \
                       true(), "stream_stopped")

# The Cause and Action text for cause_code, in plain words for an analyst who never reads SPL
# (task 12d ruling): the panels' names ("Splunk agent", not UF or splunkd), and every command to run
# says what it does. docs/data-health/dashboards.md explains each one. Kept free of commas so it
# reads well in CSV exports.
[dh_eval_cause_text]
definition = eval dh_t="%Y-%m-%d %H:%M %Z" \
| eval cause=case(cause_code=="gate_stale", if(isnull(mt_last_run), "On hold: the arrival tracker (DH Tracker fast) has never run", "On hold: the arrival tracker (DH Tracker fast) has not run for ".(dh_now-mt_last_run)." s"), \
    cause_code=="gate_no_rx", if(isnull(mt_last_rx), "On hold: Splunk has indexed nothing yet", "On hold: Splunk has indexed nothing for ".(dh_now-mt_last_rx)." s"), \
    cause_code=="gate_resume", "On hold: catching up after a pause (sleep or restart) at ".strftime(mt_resumed_at, dh_t)."; statuses held for 5 min", \
    cause_code=="muted", "Muted until ".strftime(muted_until, dh_t).": ".coalesce(mute_reason, "no reason given"), \
    cause_code=="new_expected", "Added less than 1 h ago: waiting for its first data", \
    cause_code=="test_block", "Test block until ".strftime(test_block_until, dh_t)." (data dropped on purpose): ".coalesce(test_block_reason, ""), \
    cause_code=="ansible_stop", "Stopped with Ansible at ".strftime(fw_marker_time, dh_t)." by ".coalesce(fw_marker_by, "?")." and not started again", \
    cause_code=="ansible_uninstall", "Uninstalled with Ansible at ".strftime(fw_marker_time, dh_t)." by ".coalesce(fw_marker_by, "?")." and not installed again", \
    cause_code=="vm_off", "The VM is off: Hyper-V event ".fw_vm_event." (".case(fw_vm_event==18502, "turned off", fw_vm_event==18504, "shut down by the host", fw_vm_event==18508, "shut down by the guest OS", fw_vm_event==18510, "saved").") at ".strftime(tonumber(fw_vm_time), dh_t), \
    cause_code=="tamper", "Possible deliberate blinding: ".tamper_indicator." at ".strftime(tamper_time, dh_t)." just before the data stopped", \
    cause_code=="relay_down" AND via=="cribl", "Cribl DOWN: the real state is unknown (this data passes through Cribl and Cribl is not reporting)", \
    cause_code=="relay_down", "The relay ".via." is DOWN: this data comes through it so its real state is unknown", \
    cause_code=="probe_unreachable", "The device does not answer the network probe: the device or its network is down", \
    cause_code=="probe_stale", "The device probe (hl-devprobe on ".`dh_probe_host`.") stopped reporting on this device", \
    cause_code=="probe_no_logs", "The device answers the network probe but sends no logs: its logging settings probably changed", \
    cause_code=="hb_late", "The Splunk agent reports late (not yet missing): the agent is busy or stopping or its network path to Cribl (port 9997) is slow", \
    cause_code=="hb_missing", "The Splunk agent stopped reporting: the host is down or cut off from Cribl (port 9997) or the agent crashed or was stopped outside Ansible", \
    cause_code=="hb_ok_never_seen", "The Splunk agent works but this input has never sent anything: input not enabled or wrong index or sourcetype or no permission to read it", \
    cause_code=="hb_ok_all_missing", "The Splunk agent works but sends no data at all: its apps or inputs were removed or it cannot forward or a test block drops it", \
    cause_code=="hb_ok_input_missing", "The Splunk agent works but this input stopped: its file is unreadable or was moved or rotated or auditd or rsyslog stopped or audit rules were removed", \
    cause_code=="never_seen", "Never arrived since it was added: the input is not deployed or not sending", \
    cause_code=="host_no_data" AND host=="cribl", "Cribl DOWN: nothing from Cribl itself so every collected stream is unknown", \
    cause_code=="host_no_data", "Nothing at all from this host (it has no Splunk agent): the host is down or its syslog path is broken", \
    cause_code=="host_late" AND host=="cribl", "Cribl late: nothing recent from Cribl itself (not yet DOWN) so collected streams may soon be unknown", \
    cause_code=="host_late" AND h_children_hard>0, "Everything from this host is late or missing (it has no Splunk agent): the host or its syslog path is slow or stopping", \
    cause_code=="host_late", "Everything from this host is late (not yet missing; it has no Splunk agent): the host or its syslog path is slow or stopping", \
    cause_code=="stream_stopped", "This stream stopped while the host still sends others: its program or input stopped") \
| eval action=case(cause_code=="gate_stale", "Check that the scheduled search DH Tracker fast is enabled and not skipped", \
    cause_code=="gate_no_rx", "Check that the Splunk container runs and receives: HEC 8088 (wd2l and markers) and splunktcp 9997 from Cribl on hl-net", \
    cause_code=="gate_resume", "None: wait 5 min", \
    cause_code=="muted", "None while muted", \
    cause_code=="new_expected", "None yet: wait up to 1 h for its first data", \
    cause_code=="test_block", "Remove the test block when the test ends (Manage > Test blocks gives the command)", \
    cause_code=="ansible_stop", "Start it again with the role: ansible-playbook site.yml --tags start --limit ".host, \
    cause_code=="ansible_uninstall", "Install it again with the role (ansible-playbook site.yml --tags install --tags apps --tags audit_rules --limit ".host.") or retire its rows: set hl_expected false for it and run --tags expected --limit homepc", \
    cause_code=="vm_off", "Start the VM ".host." in Hyper-V or mute it if it is meant to be off", \
    cause_code=="tamper", "Escalate: someone may be hiding activity", \
    cause_code=="relay_down" AND via=="cribl", "Check the cribl container on HOMEPC (docker ps --filter name=cribl) and then run: ansible-playbook site.yml --tags verify --limit homepc", \
    cause_code=="relay_down", "Fix the relay ".via." first", \
    cause_code=="probe_unreachable", "Check the power and network of ".host, \
    cause_code=="probe_stale", "Check hl-devprobe on ".`dh_probe_host`.": systemctl status hl-devprobe.timer (or rerun: ansible-playbook site.yml --tags probe --limit ".`dh_probe_host`.")", \
    cause_code=="probe_no_logs", "Check the remote syslog settings on ".host, \
    cause_code=="hb_late", "Check the agent with the role: ansible-playbook site.yml --tags status --limit ".host."; then check the network path from ".host." to Cribl (port 9997)", \
    cause_code=="hb_missing", "Ping or SSH to ".host."; then check the agent with the role: ansible-playbook site.yml --tags status --limit ".host, \
    cause_code=="hb_ok_never_seen", "Check the input on ".host.": its settings (on Linux as the agent user and never as root: sudo -u splunkfwd /opt/splunkforwarder/bin/splunk btool inputs list) and the Splunk agent errors on Host detail", \
    cause_code=="hb_ok_all_missing", "Re-deploy the agent's apps with the role: ansible-playbook site.yml --tags apps --limit ".host."; and check Manage for test blocks", \
    cause_code=="hb_ok_input_missing", "Read the Splunk agent errors about ".sourcetype." on Host detail for ".host, \
    cause_code=="never_seen", "Check that this input is deployed and sending on ".host, \
    cause_code=="host_no_data" AND host=="cribl", "Check the cribl container on HOMEPC (docker ps --filter name=cribl) and then run: ansible-playbook site.yml --tags verify --limit homepc", \
    cause_code=="host_no_data", "Check ".host." and its syslog path", \
    cause_code=="host_late" AND host=="cribl", "Check the cribl container on HOMEPC (docker ps --filter name=cribl) and then run: ansible-playbook site.yml --tags verify --limit homepc", \
    cause_code=="host_late", "Check ".host." and its syslog path", \
    cause_code=="stream_stopped", "Check the program or input that sends this stream on ".host)

########## Evaluator steps over lookups
# Expected rows (normalized, enabled, one per entity_id) joined with max(fast, slow) state at
# the row's level: source rows match index|host|sourcetype|source_norm, sourcetype rows take the
# max over their sources, host rows the max over all of the host's data in any index.
[dh_eval_load(3)]
args = expected, state_fast, state_slow
definition = `dh_expected_rows($expected$)` \
| inputlookup append=true $state_fast$ \
| inputlookup append=true $state_slow$ \
| eval dh_st=if(dh_rt=="e", null(), 1), _key=null(), _user=null() \
| eval host=if(dh_st==1, `dh_host_norm(host)`, host), source=if(dh_st==1, `dh_source_norm(source)`, source) \
| eval entity_id=if(dh_st==1, `dh_state_entity_ids`, entity_id), \
       st_it=if(dh_st==1, tonumber(last_indextime), null()), st_et=if(dh_st==1, tonumber(last_eventtime), null()), st_fs=if(dh_st==1, tonumber(first_seen), null()), \
       st_lag=if(dh_st==1, tonumber(lag), null()), st_skew=if(dh_st==1, if(abs(tonumber(lag))>`dh_skew_secs` OR tonumber(clock_skew)==1, 1, 0), null()) \
| eval index=if(dh_st==1, null(), index), host=if(dh_st==1, null(), host), sourcetype=if(dh_st==1, null(), sourcetype), source=if(dh_st==1, null(), source) \
| fields - last_indextime last_eventtime first_seen lag clock_skew last_count updated dh_st \
| mvexpand entity_id \
| stats max(st_it) as last_indextime, max(st_et) as last_eventtime, min(st_fs) as first_seen, max(st_lag) as lag, max(st_skew) as clock_skew, first(*) as * by entity_id \
| where dh_rt=="e" \
| fields - st_*

# Per-entity and per-host facts: forwarder/marker/VM/probe (by host), overrides (entity and its
# host row), baseline, tamper findings (by host; a second lookup on host + suppressed=1 lists the
# times of suppressed findings, which dh_eval_cause ignores; a row without a suppressed value counts
# as not suppressed), and the previous dh_status row.
# A row with via=cribl also takes host cribl's findings (spec 7.6): a Drop in Cribl blinds the rows
# behind it, while its finding is on host cribl. A suppressed finding (a role marker for cribl) is
# in tp_stime like any other, so it explains nothing.
[dh_eval_facts(5)]
args = fwd, overrides, baseline, tamper, prev
definition = lookup $fwd$ host OUTPUT last_heartbeat AS fw_hb last_probe_time AS fw_probe_time last_probe_up AS fw_probe_up last_probe_reachable AS fw_probe_reachable last_marker_action AS fw_marker_action last_marker_time AS fw_marker_time last_marker_by AS fw_marker_by last_vm_event AS fw_vm_event last_vm_event_time AS fw_vm_time \
| eval dh_host_key="host|*|".host."|*|*" \
| lookup $overrides$ entity_id OUTPUT mute_until AS ov_mute_until reason AS ov_reason ticket AS ov_ticket threshold_override_secs AS ov_threshold_secs \
| lookup $overrides$ entity_id AS dh_host_key OUTPUT mute_until AS ovh_mute_until reason AS ovh_reason ticket AS ovh_ticket \
| lookup $baseline$ entity_id OUTPUT learned_gap_secs AS bl_learned_gap_secs days AS bl_days \
| lookup $tamper$ host OUTPUT time AS tp_time indicator AS tp_indicator \
| eval dh_one=1 \
| lookup $tamper$ host, suppressed AS dh_one OUTPUT time AS tp_stime \
| eval dh_relay=if(via=="cribl" AND host!="cribl", "cribl", null()) \
| lookup $tamper$ host AS dh_relay OUTPUT time AS tp_rtime indicator AS tp_rindicator \
| lookup $tamper$ host AS dh_relay, suppressed AS dh_one OUTPUT time AS tp_rstime \
| eval tp_time=mvappend(tp_time, tp_rtime), tp_indicator=mvappend(tp_indicator, tp_rindicator), tp_stime=mvappend(tp_stime, tp_rstime) \
| fields - dh_relay tp_rtime tp_rindicator tp_rstime \
| lookup $prev$ entity_id OUTPUT status AS pv_status since AS pv_since real_status AS pv_real_status real_since AS pv_real_since prev_status AS pv_prev_status expected_since AS pv_expected_since

# Active test blocks (§7.7) matching the row: L1 host|*|*, L2 host|sourcetype|*, L3
# host|sourcetype|<raw source>, only for linux/windows/network (host rows show L1 as a label).
# Read with inputlookup append=true so a missing table (before task 3) is simply empty.
[dh_eval_blocks(1)]
args = blocks
definition = inputlookup append=true $blocks$ \
| eval dh_blk=if(isnull(dh_rt) AND isnotnull(k), k."#|#".until."#|#".coalesce(reason, ""), null()) \
| eventstats values(dh_blk) as dh_blocks \
| where dh_rt=="e" \
| fields - k until reason set_by dh_blk \
| eval dh_bk1=host."|*|*", dh_bk2=host."|".sourcetype."|*", dh_bk3=host."|".sourcetype."|".source_raw, \
       dh_scope=if(level=="host" OR index=="linux" OR index=="windows" OR index=="network", 1, 0) \
| eval dh_bhit=if(dh_scope==1 AND isnotnull(dh_blocks), mvmap(dh_blocks, if(tonumber(mvindex(split(dh_blocks, "#|#"), 1))>dh_now AND (mvindex(split(dh_blocks, "#|#"), 0)==dh_bk1 OR (level!="host" AND mvindex(split(dh_blocks, "#|#"), 0)==dh_bk2) OR (level=="source" AND mvindex(split(dh_blocks, "#|#"), 0)==dh_bk3)), dh_blocks, null())), null()) \
| eval test_block_until=tonumber(mvindex(split(mvindex(dh_bhit, 0), "#|#"), 1)), test_block_reason=mvindex(split(mvindex(dh_bhit, 0), "#|#"), 2) \
| fields - dh_blocks dh_bhit

# The dh_status record shape.
[dh_eval_output]
definition = eval _key=entity_id, evaluated_at=dh_now, age_secs=if(isnotnull(last_indextime), max(0, dh_asof-last_indextime), null()), clock_skew=coalesce(clock_skew, 0) \
| fields _key entity_id level index host sourcetype source collection via profile criticality owner site runbook description status since prev_status real_status real_since changed cause_code cause action threshold_secs threshold_origin threshold_note learning age_secs last_indextime last_eventtime first_seen lag clock_skew muted_until mute_reason test_block_until test_block_reason host_rollup liveness expected_since evaluated_at

########## The evaluator
# dh_eval(expected, state_fast, state_slow, fwd, overrides, baseline, meta, blocks, tamper, prev, now)
# Reads only lookups; returns one dh_status record per enabled expected entity. Writes nothing.
[dh_eval(11)]
args = expected, state_fast, state_slow, fwd, overrides, baseline, meta, blocks, tamper, prev, now
definition = `dh_eval_load($expected$, $state_fast$, $state_slow$)` \
| eval dh_now=$now$ \
| `dh_eval_facts($fwd$, $overrides$, $baseline$, $tamper$, $prev$)` \
| `dh_eval_gate_read($meta$)` \
| `dh_eval_blocks($blocks$)` \
| `dh_profile_defaults` \
| `dh_threshold` \
| `dh_eval_mute` \
| `dh_eval_liveness` \
| `dh_eval_status` \
| `dh_eval_transition` \
| `dh_eval_rollup` \
| `dh_eval_cause` \
| `dh_eval_cause_text` \
| `dh_eval_output`

# The evaluator over the real collections, now.
[dh_evaluate]
definition = `dh_eval(dh_expected, dh_state_fast, dh_state_slow, dh_fwd, dh_overrides, dh_baseline, dh_meta, hl_ingest_block, dh_tamper, dh_status, now())`

# Rows the evaluator would collect as transitions (changed status). The entity's index, host,
# sourcetype and source are renamed dh_*: collect would otherwise move them to orig_* and stamp
# the event with the search head's own host/source/sourcetype.
[dh_transition_rows]
definition = where changed==1 \
| eval _time=evaluated_at \
| rename index AS dh_index, host AS dh_host, sourcetype AS dh_sourcetype, source AS dh_source \
| table _time entity_id level dh_index dh_host dh_sourcetype dh_source prev_status status since cause_code cause action criticality host_rollup threshold_secs threshold_origin

[dh_collect_transitions]
definition = collect index=data_health source="dh:transition" sourcetype=stash

# dh_status keeps one writer (DH Evaluate). Given the evaluator's output rows: when $status$ holds
# rows of entities no longer enabled in $expected$ (orphans), returns the output rows, which DH
# Evaluate then writes as a full replace (dropping the orphans, so a re-added entity starts a fresh
# grace); otherwise returns nothing. Nothing is dropped while $expected$ has no enabled rows.
[dh_status_keep(2)]
args = expected, status
definition = append [| inputlookup $status$ | `dh_prune_mark_status($expected$)` | where dh_drop==1 | stats count as dh_orphans] \
| eventstats max(dh_orphans) as dh_orphans \
| where isnotnull(entity_id) AND dh_orphans>0 \
| fields - dh_orphans

########## Tracker steps (spec §7.3). Each works on the rows its search produces, so tests can feed
# fixture rows in place of tstats/search output (tests/spl/cases/40-42).

# tstats rows (index host sourcetype source last_indextime last_eventtime first_seen last_count)
# -> normalized, merged with $state$ (max times, min first_seen, fresh counts only), one record
# per fresh key for a key_field=_key upsert into $state$.
[dh_state_merge(2)]
args = state, now
definition = eval host=`dh_host_norm(host)`, source=`dh_source_norm(source)`, dh_fresh=1 \
| inputlookup append=true $state$ \
| eval last_count=if(dh_fresh==1, last_count, 0) \
| stats max(dh_fresh) as dh_fresh, max(last_indextime) as last_indextime, max(last_eventtime) as last_eventtime, min(first_seen) as first_seen, sum(last_count) as last_count by index host sourcetype source \
| where dh_fresh==1 \
| eval lag=last_indextime-last_eventtime, clock_skew=if(abs(lag)>`dh_skew_secs`, 1, 0), updated=$now$, _key=index."|".host."|".sourcetype."|".source \
| fields _key index host sourcetype source first_seen last_indextime last_eventtime last_count lag clock_skew updated

# dh_fwd inputs. Each yields per-host partial rows; packed "epoch#|#..." strings let a plain
# max() pick the latest fact when old and new rows merge in dh_fwd_fold.
# UF heartbeat: tstats max(_indextime) as hb ... by host splunk_server (the indexer's own excluded).
[dh_fwd_from_hb]
definition = where host!=splunk_server \
| eval host=`dh_host_norm(host)` \
| fields host hb

# The UF's own splunkd.log (spike 14.7 e; Splunk sees only Cribl's connection, so tcpin_connections
# no longer names the forwarders): the last connect ("Connected to idx=", every 30 s), OS and arch
# ("loader - System info: <OS>, <host>, <kernel>, ..., <arch>.") and the build ("Splunkd starting
# (build <b>)"), the last two only at a splunkd start, so dh_fwd keeps the last seen value. The
# version comes from the build (dh_uf_builds). Splunk's own lines (host = splunk_server) are left out.
[dh_fwd_from_ufint]
definition = where isnull(splunk_server) OR host!=splunk_server \
| eval host=`dh_host_norm(host)` \
| rex field=_raw "Connected to idx=(?<dh_idx>[^, ]+)" \
| rex field=_raw "System info: (?<dh_os>[^,]+),.*,[ ]*(?<dh_arch>[A-Za-z0-9_]+)[.]?[ ]*$" \
| rex field=_raw "Splunkd starting [(]build (?<dh_build>[0-9a-f]+)[)]" \
| lookup dh_uf_builds build AS dh_build OUTPUT version AS dh_ver \
| eval dh_conn=if(isnotnull(dh_idx), _time, null()), dh_osa=if(isnotnull(dh_os), trim(dh_os)." ".dh_arch, null()), \
       dh_ver=if(isnotnull(dh_build), coalesce(dh_ver, "build ".dh_build), null()) \
| stats max(dh_conn) as tcpin, latest(dh_ver) as version, latest(dh_osa) as os by host \
| eval fwd_type="uf"

# Ansible markers (index=data_health source=dh:marker sourcetype=hl:marker): action, target_host, by, run_id.
[dh_fwd_from_markers]
definition = eval host=`dh_host_norm(target_host)`, mk=tostring(floor(_time))."#|#".action."#|#".coalesce('by', "")."#|#".coalesce(run_id, "") \
| stats max(mk) as mk by host

# Hyper-V Worker-Admin XmlWinEventLog events: EventID and UserData/VmlEventLog/VmName from _raw
# (extraction unverified on real data until task 11). Only the lifecycle IDs of spec §7.6 count.
[dh_fwd_from_hyperv]
definition = rex field=_raw "<EventID[^>]*>(?<dh_ev>[0-9]+)</EventID>" \
| rex field=_raw "<VmName>(?<dh_vm>[^<]+)</VmName>" \
| where isnotnull(dh_vm) AND (dh_ev=="18500" OR dh_ev=="18502" OR dh_ev=="18504" OR dh_ev=="18508" OR dh_ev=="18510" OR dh_ev=="18514") \
| eval host=`dh_host_norm(dh_vm)`, vm=tostring(floor(_time))."#|#".dh_ev \
| stats max(vm) as vm by host

# Device probe events (index=network sourcetype=hl:devprobe): device (or host), reachable=1|0.
[dh_fwd_from_probe]
definition = eval host=`dh_host_norm(coalesce(device, host))`, up=if(tonumber(reachable)==1, _time, null()), pr=tostring(floor(_time))."#|#".coalesce(reachable, "") \
| stats max(_time) as probe_time, max(up) as probe_up, max(pr) as pr by host

# Merge the partial rows above with $fwd$: the latest of each fact wins, identity fields come
# from the freshest row that has them. One record per fresh host for a key_field=_key upsert.
[dh_fwd_fold(2)]
args = fwd, now
definition = eval dh_fresh=1 \
| inputlookup append=true $fwd$ \
| eval hb=coalesce(hb, last_heartbeat), tcpin=coalesce(tcpin, last_tcpin), probe_time=coalesce(probe_time, last_probe_time), probe_up=coalesce(probe_up, last_probe_up), \
       mk=coalesce(mk, if(isnotnull(last_marker_time), tostring(last_marker_time)."#|#".last_marker_action."#|#".coalesce(last_marker_by, "")."#|#".coalesce(last_marker_run_id, ""), null())), \
       vm=coalesce(vm, if(isnotnull(last_vm_event_time), tostring(last_vm_event_time)."#|#".last_vm_event, null())), \
       pr=coalesce(pr, if(isnotnull(last_probe_time), tostring(last_probe_time)."#|#".coalesce(last_probe_reachable, ""), null())) \
| stats max(dh_fresh) as dh_fresh, max(hb) as last_heartbeat, max(tcpin) as last_tcpin, first(guid) as guid, first(version) as version, first(os) as os, first(fwd_type) as fwd_type, \
        max(mk) as mk, max(vm) as vm, max(pr) as pr, max(probe_time) as last_probe_time, max(probe_up) as last_probe_up by host \
| where dh_fresh==1 \
| eval last_marker_time=tonumber(mvindex(split(mk, "#|#"), 0)), last_marker_action=mvindex(split(mk, "#|#"), 1), last_marker_by=mvindex(split(mk, "#|#"), 2), last_marker_run_id=mvindex(split(mk, "#|#"), 3), \
       last_vm_event_time=tonumber(mvindex(split(vm, "#|#"), 0)), last_vm_event=tonumber(mvindex(split(vm, "#|#"), 1)), \
       last_probe_reachable=tonumber(mvindex(split(pr, "#|#"), 1)), updated=$now$, _key=host \
| fields _key host guid version os fwd_type last_heartbeat last_tcpin last_marker_action last_marker_time last_marker_by last_marker_run_id last_vm_event last_vm_event_time last_probe_time last_probe_up last_probe_reachable updated

# One summary row (state_rows, rx_data, fwd_rows, rx_hb; name, default tracker_fast) -> the
# tracker's dh_meta record: last_run, prev_run, resumed_at (set when the gap since the previous
# run exceeds dh_resume_gap_secs, or on the first run), last_rx (latest arrival seen).
[dh_meta_fast(2)]
args = meta, now
definition = eval name=coalesce(name, "tracker_fast") \
| lookup $meta$ name OUTPUT last_run AS dh_old_run, resumed_at AS dh_old_resumed, last_rx AS dh_old_rx \
| eval dh_old_run=tonumber(dh_old_run), dh_old_resumed=tonumber(dh_old_resumed), last_run=$now$, prev_run=dh_old_run, \
       resumed_at=if(isnull(dh_old_run) OR last_run-dh_old_run>`dh_resume_gap_secs`, last_run, dh_old_resumed), \
       last_rx=max(coalesce(tonumber(rx_data), 0), coalesce(tonumber(rx_hb), 0), coalesce(tonumber(dh_old_rx), 0)), last_rx=if(last_rx>0, last_rx, null()), \
       rows=coalesce(tonumber(state_rows), 0), fwd_rows=coalesce(tonumber(fwd_rows), 0), updated=$now$, _key=name \
| fields _key name last_run prev_run resumed_at last_rx rows fwd_rows updated

########## Task 11: baselines, volume, tamper, alerts, admin-log copy, prune, daily report.
# Each step works on the rows its search produces, so tests/spl/cases/50-74 feed fixture rows.

########## Tunables (task 11)
# A reported clock change at least this big is a tamper finding ("big clock steps", §7.6).
[dh_clock_step_secs]
definition = 300

# DH Tamper windows: findings by event time over the last dh_tamper_finding_earliest (= the
# lookback, in seconds, inside which suppression is re-evaluated each run); markers over that plus
# dh_tamper_window_secs, so a backfilled finding (a SERVICE_STOP that arrives after a long
# stop/start, stamped with the stop time) still meets its marker. Case 77 checks they agree.
[dh_tamper_lookback_secs]
definition = 604800

[dh_tamper_finding_earliest]
definition = "-7d"

[dh_tamper_marker_earliest]
definition = "-7d-15m"

# Volume flag (§7.6): last hour < dh_volume_ratio x the 14-day same-hour median, where the
# median is >= dh_volume_min_median, and only if Splunk was up for dh_volume_min_up_minutes of it.
[dh_volume_ratio]
definition = 0.2

[dh_volume_min_median]
definition = 100

[dh_volume_min_up_minutes]
definition = 54

# dh_baseline.suggested_profile: continuous when p90(daily max gap) <= this, else sporadic.
[dh_suggest_continuous_secs]
definition = 1800

# Prune retention. State/fwd rows of anything still expected are always kept.
[dh_state_retention_secs]
definition = 2592000

[dh_fwd_retention_secs]
definition = 2592000

[dh_tamper_retention_secs]
definition = 2592000

[dh_volume_retention_secs]
definition = 172800

[dh_baseline_retention_secs]
definition = 2592000

[dh_admin_retention_secs]
definition = 7776000

# Daily report thresholds. The expected UF version is the one the role pins (spec §14.3).
[dh_fwd_expected_version]
definition = "10.6.1.1"

[dh_fwd_disconnect_secs]
definition = 900

[dh_lag_warn_secs]
definition = 60

########## Summary writes (index data_health, sourcetype stash: not licence-metered; spec §4)
[dh_collect_daily]
definition = collect index=data_health source="dh:daily" sourcetype=stash

[dh_collect_volume]
definition = collect index=data_health source="dh:volume" sourcetype=stash

[dh_collect_tamper]
definition = collect index=data_health source="dh:tamper" sourcetype=stash

[dh_collect_admin]
definition = collect index=data_health source="dh:admin" sourcetype=stash

[dh_collect_soh]
definition = collect index=data_health source="dh:soh" sourcetype=stash

########## DH Baseline daily (§7.3): per entity and day, from per-minute rows.
# Input rows (dh_kind): data = tstats ... by _time span=1m index host sourcetype source with count,
# it (max _indextime) and et (max _time); up = a minute in which the indexer's own _internal
# metrics arrived (Splunk up); hb = a minute with a UF heartbeat from host; todo = a day to emit
# (from dh_daily_todo). A minute is covered when Splunk was up and, for a UF host (dh_fwd has a
# heartbeat), the host's heartbeat was up too; gaps count covered minutes only, so PC sleep or a
# stopped UF never inflates them. Gaps are at minute resolution: between consecutive arrivals, plus
# the covered minutes before the first and after the last arrival of the day. For an entity that
# is enabled in $expected$, the open gap is carried across midnight: prev rows (dh_kind="prev":
# day, entity_id, open_gap_secs of earlier dh:daily records) and the days computed in the same run
# form a chain, so the leading gap of a day adds the gap still open at the end of the day before
# (capped at the profile's learned cap), and a day without data gets a zero record of that carry
# plus its own covered day. A source silent for 3 days therefore records gaps of about 1, 2 and
# 3 days. The chain covers only days the entity was expected (expected_since <= the day's start):
# prev rows from before, and data from before, break it, and on the day expected_since falls in,
# the leading gap is at most arrival - expected_since, so a removed and re-added entity does not
# inherit its absence. Entities that are not expected (retired or unregistered) get records only
# for days with data, never a carry, so they age out. open_gap_secs is the (capped) gap still open
# at the end of the day: the next run's carry. The p95 is over the day's own gaps > 0.
# active_minutes counts covered minutes with data.
# Output: one record=entity row per entity and todo day, one record=day row per todo day.
[dh_daily_from_minutes(2)]
args = fwd, expected
definition = eval dh_m=if(dh_kind=="todo" OR dh_kind=="prev", 0, floor(_time/60)*60) \
| eval day=if(dh_kind=="todo" OR dh_kind=="prev", floor(tonumber(day)), floor(relative_time(dh_m, "@d"))) \
| eval host=if(dh_kind=="data" OR dh_kind=="hb", `dh_host_norm(host)`, null()), source=if(dh_kind=="data", `dh_source_norm(source)`, null()) \
| lookup $fwd$ host OUTPUT last_heartbeat AS dh_fw_hb \
| eval ck=if((dh_kind=="data" OR dh_kind=="hb") AND isnotnull(dh_fw_hb), host, "*") \
| eventstats max(eval(if(dh_kind=="up", 1, 0))) as dh_up by dh_m \
| eval dh_kind=case(dh_kind=="up", "cov", dh_kind=="hb" AND dh_up==1 AND ck!="*", "cov", dh_kind=="hb", null(), true(), dh_kind) \
| where isnotnull(dh_kind) \
| eval entity_id=case(dh_kind=="data", `dh_state_entity_ids`, dh_kind=="prev", entity_id, true(), "#".dh_kind), dh_hr=if(dh_kind=="data", tonumber(strftime(dh_m, "%H")), -1) \
| mvexpand entity_id \
| stats sum(count) as c, max(it) as it, max(et) as et, max(open_gap_secs) as open_gap_secs by dh_kind entity_id ck day dh_m dh_hr \
| eventstats max(eval(if(dh_kind=="cov", 1, 0))) as dh_self by ck dh_m \
| eval dh_ord=if(dh_kind=="cov", 0, 1), dh_iscov=if(dh_kind=="cov", 1, 0) \
| sort 0 ck dh_m dh_ord \
| streamstats sum(dh_iscov) as cov by ck day \
| eventstats max(cov) as cov_total by ck day \
| appendpipe [| where dh_kind=="cov" | stats max(cov_total) as cov_total by ck day | eval dh_kind="ctot", entity_id="#ctot"] \
| where dh_kind!="cov" \
| eventstats sum(c) as dh_hsum by entity_id day dh_hr \
| eval dh_hv=if(dh_kind=="data", dh_hr.":".dh_hsum, null()) \
| sort 0 entity_id day dh_m \
| streamstats current=f window=1 last(cov) as dh_pcov by entity_id day \
| eval gap=if(dh_kind=="data", 60*if(isnull(dh_pcov), cov-dh_self, cov-dh_pcov), null()), lag=it-et \
| eval dh_gp=if(gap>0, gap, null()), dh_act=if(dh_kind=="data", dh_self, null()), \
       dh_lead=if(dh_kind=="data" AND isnull(dh_pcov), gap, null()), dh_int=if(dh_kind=="data" AND isnotnull(dh_pcov), gap, null()) \
| stats sum(c) as count, sum(dh_act) as active_minutes, max(dh_lead) as dh_lead, max(dh_int) as dh_int, perc95(dh_gp) as p95_gap_secs, max(cov) as dh_clast, max(cov_total) as cov_total, perc95(lag) as lag_p95, values(dh_hv) as dh_hv, max(open_gap_secs) as open_gap_secs, min(eval(if(dh_kind=="data", dh_m, null()))) as dh_first by dh_kind entity_id ck day \
| append [| `dh_expected_rows($expected$)` | `dh_profile_defaults` | lookup $fwd$ host OUTPUT last_heartbeat AS dh_fw_hb | eval ck=if(isnotnull(dh_fw_hb), host, "*"), dh_kind="exp", dh_es=tonumber(expected_since), dh_cap=coalesce(dh_cap_secs, 604800) | fields entity_id ck dh_kind dh_es dh_cap] \
| eventstats max(eval(if(dh_kind=="exp", 1, 0))) as dh_isexp, max(dh_es) as dh_es, max(dh_cap) as dh_cap by entity_id \
| eval dh_cap=coalesce(dh_cap, 604800), dh_eday=if(isnotnull(dh_es), floor(relative_time(dh_es, "@d")), null()) \
| where NOT (dh_kind=="prev" AND (dh_isexp==0 OR (isnotnull(dh_es) AND dh_es>day))) \
| eventstats values(eval(if(dh_kind=="ctot" AND ck=="*", day, null()))) as dh_days \
| eval day=if(dh_kind=="exp", dh_days, day) \
| mvexpand day \
| where NOT (dh_kind=="exp" AND isnotnull(dh_es) AND dh_es>day) \
| eventstats max(eval(if(dh_kind=="ctot", cov_total, null()))) as dh_ct by ck day \
| eventstats max(eval(if(dh_kind=="data", 1, 0))) as dh_has by entity_id day \
| eventstats max(eval(if(dh_kind=="ctot" AND ck=="*", 1, 0))) as dh_hasday by day \
| where NOT (dh_kind=="exp" AND dh_has==1) \
| eval dh_pre=if(dh_kind=="data" AND (dh_isexp==0 OR (isnotnull(dh_eday) AND day<dh_eday)), 1, 0) \
| eval dh_reset=case(dh_kind=="data" OR dh_kind=="prev", 1, dh_kind=="exp", 0), \
       dh_base=case(dh_pre==1, 0, dh_kind=="data", 60*(cov_total-dh_clast), dh_kind=="prev", coalesce(tonumber(open_gap_secs), 0), dh_kind=="exp", 60*coalesce(dh_ct, 0)) \
| sort 0 entity_id day \
| streamstats sum(dh_reset) as dh_g by entity_id \
| streamstats sum(dh_base) as dh_open by entity_id dh_g \
| streamstats current=f window=1 last(dh_open) as dh_carry by entity_id \
| eval dh_carry=if(dh_isexp==1 AND dh_pre==0, min(coalesce(dh_carry, 0), dh_cap), 0) \
| eval dh_lead=if(dh_kind=="data" AND dh_pre==0 AND isnotnull(dh_es) AND dh_es>day, min(coalesce(dh_lead, 0), max(0, dh_first-dh_es)), dh_lead) \
| eventstats values(eval(if(dh_kind=="todo", day, null()))) as dh_todo \
| where isnotnull(mvfind(dh_todo, "^".day."$")) \
| eval record=case(dh_kind=="data", "entity", dh_kind=="exp" AND dh_has==0, "entity", dh_kind=="ctot" AND ck=="*", "day", dh_kind=="todo" AND dh_hasday==0, "day") \
| where isnotnull(record) \
| eval covered_minutes=case(dh_kind=="data" OR dh_kind=="ctot", coalesce(cov_total, 0), dh_kind=="exp", coalesce(dh_ct, 0), true(), 0), \
       day_minutes=round((relative_time(day, "+1d@d")-day)/60), covered_pct=floor(10000*covered_minutes/day_minutes+0.5)/100 \
| eval count=case(dh_kind=="exp", 0, record=="entity", count), active_minutes=case(dh_kind=="exp", 0, record=="entity", active_minutes), \
       max_gap_secs=case(dh_kind=="exp", dh_carry+60*coalesce(dh_ct, 0), record=="entity", max(dh_carry+coalesce(dh_lead, 0), coalesce(dh_int, 0), 60*(cov_total-dh_clast))), \
       open_gap_secs=case(dh_kind=="exp", min(dh_carry+60*coalesce(dh_ct, 0), dh_cap), record=="entity", min(60*(cov_total-dh_clast), dh_cap)) \
| eval dh_hrs=if(record=="entity", mvrange(0, 24), null()) \
| eval hourly=if(record=="entity", mvjoin(mvmap(dh_hrs, coalesce(tonumber(mvindex(split(mvindex(dh_hv, mvfind(dh_hv, "^".dh_hrs.":")), ":"), 1)), 0)), ";"), null()) \
| eval dh_p=if(record=="entity", split(entity_id, "|"), null()), entity_id=if(record=="entity", entity_id, null()) \
| eval level=mvindex(dh_p, 0), dh_index=mvindex(dh_p, 1), dh_host=mvindex(dh_p, 2), dh_sourcetype=mvindex(dh_p, 3), dh_source=mvindex(dh_p, 4), \
       p95_gap_secs=floor(p95_gap_secs+0.5), lag_p95=floor(lag_p95+0.5), _time=day, computed_at=now() \
| table _time record day entity_id level dh_index dh_host dh_sourcetype dh_source count active_minutes max_gap_secs open_gap_secs p95_gap_secs covered_minutes day_minutes covered_pct lag_p95 hourly computed_at

# Catch-up (§7.3): the completed days of the last 13 that have no record=day dh:daily row yet,
# one row each (day), with the tstats window that covers them (earliest, latest). Input: the
# day field of the existing record=day rows (none at all is fine). Not 14: the indexes keep 14 days
# (§4.4), so day -14 began more than 14 days ago and its raw data may be partly frozen.
[dh_daily_todo(1)]
args = now
definition = eval dh_done=floor(tonumber(day)) \
| stats values(dh_done) as dh_done, count as dh_n \
| eval dh_today=floor(relative_time($now$, "@d")), dh_k=mvrange(1, 14) \
| mvexpand dh_k \
| eval day=floor(relative_time(dh_today, "-".dh_k."d@d")) \
| where isnull(mvfind(dh_done, "^".day."$")) \
| eventstats min(day) as earliest, max(day) as dh_max \
| eval latest=floor(relative_time(dh_max, "+1d@d")) \
| table day earliest latest

# One row: the window for the daily tstats (zero-width at today 00:00 when nothing is to do).
[dh_daily_window(1)]
args = now
definition = `dh_daily_todo($now$)` \
| stats min(earliest) as earliest, max(latest) as latest, count as dh_n \
| eval dh_today=floor(relative_time($now$, "@d")), earliest=coalesce(earliest, dh_today), latest=coalesce(latest, dh_today) \
| table earliest latest

########## DH Baseline compute (§7.3, §7.4): dh:daily records of the last $days$ completed days ->
# dh_baseline. A recomputed day keeps its newest record. Days < 50% covered are skipped.
# learned_gap_secs = 1.5 x p90(daily max gap) + 120 s over the covered days, before the clamp:
# dh_threshold clamps it per profile and uses it only once days >= 3. p90 is Splunk's perc90
# (linear interpolation). hourly_median: per hour of day, the median count over the covered days
# ("a;b;...", 24 values), as perc50 (interpolated; Splunk's median() rounds an even-count median
# of integers, giving 3 for 1,2,3,4).
[dh_baseline_compute(2)]
args = days, now
definition = eval day=tonumber(day) \
| where record=="entity" AND day>=relative_time($now$, "-$days$d@d") \
| eval dh_ca=coalesce(tonumber(computed_at), 0) \
| sort 0 entity_id day -dh_ca \
| dedup entity_id day \
| eval dh_cov=if(tonumber(covered_pct)>=50, 1, 0), dh_ncov=if(tonumber(covered_pct)>=50, 0, 1) \
| eval dh_mg=if(dh_cov==1, tonumber(max_gap_secs), null()) \
| eventstats sum(dh_cov) as days, sum(dh_ncov) as skipped_days, perc90(dh_mg) as p90_max_gap_secs, max(day) as last_day by entity_id \
| eval dh_hl=split(hourly, ";") \
| eval dh_hz=if(isnull(dh_hl), "-1:", mvzip(mvrange(0, mvcount(dh_hl)), dh_hl, ":")) \
| mvexpand dh_hz \
| eval dh_hr=tonumber(mvindex(split(dh_hz, ":"), 0)), dh_hc=if(dh_cov==1, tonumber(mvindex(split(dh_hz, ":"), 1)), null()) \
| stats perc50(dh_hc) as dh_hmed, first(days) as days, first(skipped_days) as skipped_days, first(p90_max_gap_secs) as p90_max_gap_secs, first(last_day) as last_day by entity_id dh_hr \
| eval dh_hv=if(dh_hr>=0 AND isnotnull(dh_hmed), dh_hr.":".dh_hmed, null()) \
| stats values(dh_hv) as dh_hv, first(days) as days, first(skipped_days) as skipped_days, first(p90_max_gap_secs) as p90_max_gap_secs, first(last_day) as last_day by entity_id \
| eval dh_hrs=mvrange(0, 24) \
| eval hourly_median=if(isnull(dh_hv), null(), mvjoin(mvmap(dh_hrs, coalesce(mvindex(split(mvindex(dh_hv, mvfind(dh_hv, "^".dh_hrs.":")), ":"), 1), "0")), ";")) \
| eval learned_gap_secs=if(isnotnull(p90_max_gap_secs), 1.5*p90_max_gap_secs+120, null()), \
       suggested_profile=case(days<3, null(), p90_max_gap_secs<=`dh_suggest_continuous_secs`, "continuous", true(), "sporadic"), \
       updated=$now$, _key=entity_id \
| table _key entity_id learned_gap_secs days skipped_days p90_max_gap_secs suggested_profile hourly_median last_day updated

########## DH Volume hourly (§7.6 volume flag)
# Input: data rows (tstats count over the last full hour by index host sourcetype source) and one
# up row (up_minutes = minutes Splunk was up in that hour, hour_start = its epoch). Each entity
# with a same-hour median in $baseline$ gets a dh_volume record; flagged=1 is the volume flag.
# Like the learned threshold, the median counts only once the baseline has >= 3 covered days.
[dh_volume_flag(2)]
args = baseline, now
definition = eval host=if(dh_kind=="data", `dh_host_norm(host)`, host), source=if(dh_kind=="data", `dh_source_norm(source)`, source) \
| eval entity_id=if(dh_kind=="data", `dh_state_entity_ids`, "#up"), dh_hs=if(dh_kind=="up", tonumber(hour_start), null()), dh_upm=if(dh_kind=="up", tonumber(up_minutes), null()) \
| mvexpand entity_id \
| stats sum(eval(if(dh_kind=="data", tonumber(count), 0))) as count, max(dh_upm) as dh_upm, max(dh_hs) as dh_hs by entity_id \
| inputlookup append=true $baseline$ \
| eventstats max(dh_upm) as dh_upm, max(dh_hs) as dh_hs \
| eval dh_hr=tonumber(strftime(dh_hs, "%H")), dh_med=tonumber(mvindex(split(hourly_median, ";"), dh_hr)), dh_days=tonumber(days) \
| stats sum(count) as count, max(dh_med) as median, max(dh_days) as dh_days, max(dh_upm) as dh_upm, max(dh_hs) as hour by entity_id \
| where isnotnull(median) \
| eval count=coalesce(count, 0), ratio=if(median>0, floor(1000*count/median+0.5)/1000, null()), dh_cov=if(coalesce(dh_upm, 0)>=`dh_volume_min_up_minutes`, 1, 0), dh_days=coalesce(dh_days, 0) \
| eval flagged=if(dh_cov==1 AND dh_days>=3 AND median>=`dh_volume_min_median` AND count<`dh_volume_ratio`*median, 1, 0), \
       note=case(dh_cov==0, "hour not covered (Splunk up ".coalesce(dh_upm, 0)." of 60 min)", dh_days<3, "baseline learning (".dh_days." of 3 days)", median<`dh_volume_min_median`, "median below ".`dh_volume_min_median`) \
| eval updated=$now$, _key=entity_id, dh_host=mvindex(split(entity_id, "|"), 2) \
| table _key entity_id dh_host hour count median ratio flagged note updated

########## DH Tamper (§7.6 tamper indicators). Events -> findings: host, time, code, indicator, detail.
# Windows (XmlWinEventLog, fields from _raw): 1102/104/1100 (Eventlog), 4719/4697 (Security
# auditing), 7045 (SCM), 7036 SplunkForwarder/EventLog stopped and 7040 their start-type changes
# (SCM), and clock steps >= dh_clock_step_secs (4616, Kernel-General 1). The provider is checked,
# because other providers reuse these IDs (VfpExt logs 7036, Configuration-Change-Monitor logs 1).
# A 7045 or 4697 also gets svc (its ServiceName) and fold, the keys dh_tamper_fold pairs them on
# (#50), space-separated: "s".md5 of the service key (a 4697's ServiceName; a 7045's is the display
# name, so its key is the "(Key)" at its end, when there is one) and "p".md5 of the binary path
# (ImagePath / ServiceFileName, lowercased, quotes removed) for a 4697 and for a 7045 without a key.
# A svchost.exe path is shared by many services, so it is never a key.
[dh_tamper_win]
definition = rex field=_raw "<EventID[^>]*>(?<dh_ev>[0-9]+)</EventID>" \
| rex field=_raw "<Provider Name=.(?<dh_prov>[A-Za-z][A-Za-z0-9 ._-]*)" \
| rex field=_raw "<Channel>(?<dh_chan>[^<]*)</Channel>" \
| rex field=_raw "<SubjectUserName>(?<dh_user_u>[^<]*)</SubjectUserName>" \
| rex field=_raw "<Data Name=.SubjectUserName.>(?<dh_user_d>[^<]*)</Data>" \
| rex field=_raw "<LogFileCleared[^>]*>.*<Channel>(?<dh_cleared>[^<]*)</Channel>" \
| rex field=_raw "<Data Name=.param1.>(?<dh_p1>[^<]*)</Data>" \
| rex field=_raw "<Data Name=.param2.>(?<dh_p2>[^<]*)</Data>" \
| rex field=_raw "<Data Name=.param3.>(?<dh_p3>[^<]*)</Data>" \
| rex field=_raw "<Data Name=.param4.>(?<dh_p4>[^<]*)</Data>" \
| rex field=_raw "<Data Name=.ServiceName.>(?<dh_svc>[^<]*)</Data>" \
| rex field=_raw "<Data Name=.(PreviousTime|OldTime).>(?<dh_t0>[0-9T:-]{19})" \
| rex field=_raw "<Data Name=.NewTime.>(?<dh_t1>[0-9T:-]{19})" \
| eval dh_user=coalesce(dh_user_u, dh_user_d), dh_svcmatch=if(match(lower(coalesce(dh_p1, "")." ".coalesce(dh_p4, "")), "splunkforwarder|eventlog|windows event log"), 1, 0), \
       dh_step=if(isnotnull(dh_t0) AND isnotnull(dh_t1), round(abs(strptime(dh_t1, "%Y-%m-%dT%H:%M:%S")-strptime(dh_t0, "%Y-%m-%dT%H:%M:%S"))), null()), \
       dh_el=if(dh_prov=="Microsoft-Windows-Eventlog", 1, 0), dh_sa=if(dh_prov=="Microsoft-Windows-Security-Auditing", 1, 0), dh_scm=if(dh_prov=="Service Control Manager", 1, 0) \
| eval code=case(dh_el==1 AND dh_ev=="1102", "win1102", dh_el==1 AND dh_ev=="104", "win104", dh_el==1 AND dh_ev=="1100", "win1100", \
                 dh_sa==1 AND dh_ev=="4719", "win4719", dh_sa==1 AND dh_ev=="4697", "win4697", dh_scm==1 AND dh_ev=="7045", "win7045", \
                 dh_scm==1 AND dh_ev=="7036" AND dh_svcmatch==1 AND lower(dh_p2)=="stopped", "win7036", \
                 dh_scm==1 AND dh_ev=="7040" AND dh_svcmatch==1, "win7040", \
                 dh_sa==1 AND dh_ev=="4616" AND dh_step>=`dh_clock_step_secs`, "win4616", \
                 dh_prov=="Microsoft-Windows-Kernel-General" AND dh_ev=="1" AND dh_step>=`dh_clock_step_secs`, "winkg1") \
| where isnotnull(code) \
| eval dh_by=if(isnotnull(dh_user), " by ".dh_user, "") \
| eval indicator=case(code=="win1102", "1102 security log cleared".dh_by, \
                      code=="win104", "104 event log ".coalesce(dh_cleared, "?")." cleared".dh_by, \
                      code=="win1100", "1100 event logging service shut down", \
                      code=="win4719", "4719 audit policy changed".dh_by, \
                      code=="win4697", "4697 service installed: ".coalesce(dh_svc, "?"), \
                      code=="win7045", "7045 service installed: ".coalesce(dh_svc, "?"), \
                      code=="win7036", "7036 ".dh_p1." stopped", \
                      code=="win7040", "7040 ".dh_p1." start type changed to ".coalesce(dh_p3, "?"), \
                      code=="win4616", "4616 clock step ".dh_step." s", \
                      code=="winkg1", "Kernel-General 1 clock step ".dh_step." s"), \
       detail="channel=".coalesce(dh_chan, "?")."; EventID=".dh_ev."; provider=".dh_prov, \
       host=`dh_host_norm(host)`, time=floor(_time) \
| rex field=_raw "<Data Name=.(ImagePath|ServiceFileName).>(?<dh_img>[^<]*)</Data>" \
| eval svc=if(code=="win7045" OR code=="win4697", coalesce(dh_svc, ""), null()), \
       dh_fkey=case(code=="win4697" AND coalesce(dh_svc, "")!="", dh_svc, code=="win7045" AND match(coalesce(dh_svc, ""), "[(][^()]+[)]\s*$"), replace(dh_svc, "^.*[(]([^()]+)[)]\s*$", "\1")), \
       dh_fpath=trim(replace(lower(coalesce(dh_img, "")), "&quot;|\"", "")) \
| eval fold=if(isnotnull(svc), trim(if(isnotnull(dh_fkey), "s".md5(lower(trim(dh_fkey))), "")." ".if((code=="win4697" OR isnull(dh_fkey)) AND dh_fpath!="" AND NOT match(dh_fpath, "svchost[.]exe"), "p".md5(dh_fpath), "")), null()), \
       fold=if(fold=="", null(), fold) \
| table _time host time code indicator detail svc fold

# Linux (linux_audit, plus chrony lines): auditd DAEMON_END/ABORT, CONFIG_CHANGE, SERVICE_STOP of
# SplunkForwarder/auditd/rsyslog, keys hl-* and wd2l-*, and clock steps >= dh_clock_step_secs
# (TIME_INJOFFSET, chrony "System clock was stepped by"). auid is named when it is set.
[dh_tamper_linux]
definition = rex field=_raw "type=(?<dh_type>[A-Z_]+) " \
| rex field=_raw " auid=(?<dh_auid>[0-9]+)" \
| rex field=_raw "unit=(?<dh_unit>[A-Za-z0-9@._-]+)" \
| rex field=_raw "key=.??(?<dh_key>[A-Za-z0-9_-]+)" \
| rex field=_raw " op=(?<dh_op>[A-Za-z0-9_-]+)" \
| rex field=_raw "type=TIME_INJOFFSET .* sec=(?<dh_sec>-?[0-9]+)" \
| rex field=_raw "System clock was stepped by (?<dh_chrony>-?[0-9.]+) seconds" \
| eval dh_unitb=replace(coalesce(dh_unit, ""), "[.]service$", ""), dh_who=if(isnotnull(dh_auid) AND dh_auid!="4294967295", " auid=".dh_auid, "") \
| eval code=case(dh_type=="DAEMON_END", "audit_daemon_end", dh_type=="DAEMON_ABORT", "audit_daemon_abort", \
                 dh_type=="SERVICE_STOP" AND match(dh_unitb, "^(SplunkForwarder|auditd|rsyslog)$"), "svcstop_".lower(dh_unitb), \
                 dh_type=="CONFIG_CHANGE", "audit_config_change", \
                 match(coalesce(dh_key, ""), "^(hl|wd2l)-"), "key_".dh_key, \
                 dh_type=="TIME_INJOFFSET" AND abs(tonumber(dh_sec))>=`dh_clock_step_secs`, "clock_injoffset", \
                 isnotnull(dh_chrony) AND abs(tonumber(dh_chrony))>=`dh_clock_step_secs`, "clock_chrony") \
| where isnotnull(code) \
| eval indicator=case(code=="audit_daemon_end", "auditd stopped (DAEMON_END)".dh_who, \
                      code=="audit_daemon_abort", "auditd aborted (DAEMON_ABORT)".dh_who, \
                      like(code, "svcstop%"), "SERVICE_STOP ".dh_unitb.dh_who, \
                      code=="audit_config_change", "audit rules changed (CONFIG_CHANGE ".coalesce(dh_op, "?").")".dh_who, \
                      like(code, "key%"), "audit key ".dh_key.dh_who, \
                      code=="clock_injoffset", "clock step ".abs(tonumber(dh_sec))." s (TIME_INJOFFSET)", \
                      code=="clock_chrony", "clock step ".round(abs(tonumber(dh_chrony)))." s (chrony)"), \
       detail="type=".coalesce(dh_type, "syslog").if(isnotnull(dh_unit), "; unit=".dh_unit, "").if(isnotnull(dh_key), "; key=".dh_key, ""), \
       host=`dh_host_norm(host)`, time=floor(_time) \
| table _time host time code indicator detail

# Cribl's audit log (index=cribl sourcetype=cribl:audit, JSON: action, type, user, and id or, for
# an upload, filename; spike 14.7 f): any create/update/delete/reorder/upload of routes, pipelines,
# outputs, inputs or lookups is a finding on host cribl (spec 7.6). The log can't tell a Drop
# function from any other pipeline edit, so every such change counts; the role's own changes fall
# inside its `cribl`/`cribl_block` marker windows (target_host=cribl) and are suppressed by
# dh_tamper_finish. The fields are read from _raw with the eval spath(), not the spath command: Splunk's
# automatic JSON extraction has already given these events the same fields, and the command would
# double them into multivalues, which breaks the code and indicator text (fixture 95). A lookup write
# shows as an upload (a temp filename) plus a create or update of the same table: the temp suffix is
# cut and all three read "change", so one write reads as one thing in its finding (host|code|bucket).
# Adding or deleting a route also logs a "reorder" for every route it moves (task 14 row 11: one create
# and four reorders, same second). The finding takes the first row's text, so reorders sort last and
# the finding names the route that was created or deleted (fixture 38); ties sort by time, so of
# several changes in one bucket the earliest names it (final review M11).
[dh_tamper_cribl]
definition = eval dh_a=lower(spath(_raw, "action")), dh_ty=lower(spath(_raw, "type")), dh_u=spath(_raw, "user"), \
       dh_name=coalesce(spath(_raw, "id"), replace(spath(_raw, "filename"), "[.][A-Za-z0-9]+[.]tmp$", "")) \
| where (dh_a=="create" OR dh_a=="update" OR dh_a=="delete" OR dh_a=="reorder" OR dh_a=="upload") \
        AND (dh_ty=="routes" OR dh_ty=="pipelines" OR dh_ty=="outputs" OR dh_ty=="inputs" OR dh_ty=="lookups") \
| eval dh_word=if(dh_ty=="lookups" AND (dh_a=="upload" OR dh_a=="create" OR dh_a=="update"), "change", dh_a), code="cribl_".dh_ty, \
       indicator="Cribl ".dh_ty." ".dh_word.if(isnotnull(dh_name), " (".dh_name.")", "")." by ".coalesce(dh_u, "?"), \
       detail="action=".dh_word."; type=".dh_ty.if(isnotnull(dh_name), "; id=".dh_name, ""), host="cribl", time=floor(_time), \
       dh_rank=if(dh_a=="reorder", 1, 0) \
| sort 0 dh_rank _time \
| table _time host time code indicator detail

# New findings plus Ansible marker events (dh_kind="marker": target_host, action, by, run_id) plus
# the findings already in $tamper$ (dh_tamper) -> one finding per host, code and 5-minute bucket
# (finding_id = host|code|bucket, stable across the overlapping run windows; events = the larger of
# the new and the stored count). Suppression is decided once, when a finding is first stored, and
# never changes after that (#49): a finding is suppressed (the role's own work) when one of its
# host's markers came at most dh_tamper_window_secs before it, or at most
# dh_tamper_marker_slack_secs after it (clock skew), and the nearest such marker is named. The role
# posts a marker before every change it makes (final review I3), so a marker posted later, such
# as the runbook's restore run, never hides a finding that already alerted. The stored value comes
# from dh_tamper, or, when its row is gone, from the latest dh:tamper event of the finding.
# Rows with dh_kind="index" are the dh:tamper events already in data_health (finding_id,
# suppressed, _time, dh_it = _indextime): collected_suppressed is the suppression of the one
# indexed last (every record of a finding has the finding's own _time, so _time can't order them:
# final review I1), and dh_new=1 when a finding of the last dh_tamper_lookback_secs, or its
# current suppression, isn't there yet. So a collect that failed is retried on the next run
# (nothing is marked collected until the index shows it). An older finding is never new: dh_tamper
# keeps it for 30 days but the index only 14 (§4.4), so its dh:tamper event may be gone, and it
# must not be collected and alerted again.
[dh_tamper_finish(2)]
args = tamper, now
definition = eval dh_src=case(dh_kind=="marker", "mk", dh_kind=="index", "ix", true(), "new") \
| eval dh_ix=if(dh_src=="ix", printf("%012d", floor(coalesce(tonumber(dh_it), _time)))."#|#".suppressed, null()), time=if(dh_src=="ix", null(), time), \
       host=if(dh_src=="ix", null(), host), code=if(dh_src=="ix", null(), code), bucket=if(dh_src=="ix", null(), bucket), indicator=if(dh_src=="ix", null(), indicator), detail=if(dh_src=="ix", null(), detail) \
| inputlookup append=true $tamper$ \
| eval dh_src=coalesce(dh_src, "kv") \
| eval host=if(dh_src=="mk", `dh_host_norm(target_host)`, host) \
| eval dh_mkv=if(dh_src=="mk", tostring(floor(_time))."#|#".coalesce(action, "")."#|#".coalesce('by', "")."#|#".coalesce(run_id, ""), null()) \
| eventstats values(dh_mkv) as dh_mks by host \
| where dh_src!="mk" \
| eval time=floor(tonumber(time)) \
| eval bucket=case(dh_src=="new", floor(time/300)*300, dh_src=="kv", tonumber(bucket)) \
| eval finding_id=if(dh_src=="new", host."|".code."|".bucket, finding_id) \
| `dh_tamper_fold($now$)` \
| eval dh_kvev=if(dh_src=="kv", tonumber(events), null()), dh_kvfe=if(dh_src=="kv", tonumber(fold_events), null()), dh_kvs=if(dh_src=="kv", tonumber(suppressed), null()), \
       dh_kvm=if(dh_src=="kv" AND isnotnull(marker_time), marker_time."#|#".coalesce(marker_action, "")."#|#".coalesce(marker_by, "")."#|#".coalesce(marker_run_id, ""), null()), \
       dh_kvind=if(dh_src=="kv", indicator, null()) \
| stats min(time) as time, sum(eval(if(dh_src=="new" AND dh_oth==0, 1, null()))) as dh_new_own, sum(eval(if(dh_src=="new" AND dh_oth==1, 1, null()))) as dh_new_oth, \
        max(dh_kvev) as dh_kvev, max(dh_kvfe) as dh_kvfe, first(host) as host, first(code) as code, first(bucket) as bucket, first(indicator) as indicator, first(detail) as detail, \
        first(dh_ptxt) as dh_ptxt, first(dh_kvind) as dh_kvind, values(dh_fk) as dh_fks, \
        values(dh_mks) as dh_mks, max(dh_kvs) as dh_kvs, first(dh_kvm) as dh_kvm, max(dh_ix) as dh_ix by finding_id \
| where isnotnull(time) \
| eval collected_suppressed=tonumber(mvindex(split(dh_ix, "#|#"), 1)) \
| eval dh_comb=if(isnotnull(dh_ptxt) OR match(coalesce(dh_kvind, ""), "^7045[+]4697 "), 1, 0) \
| eval indicator=case(isnotnull(dh_ptxt), dh_ptxt, dh_comb==1, dh_kvind, true(), indicator), \
       detail=if(dh_comb==1, "channel=System; EventID=7045; provider=Service Control Manager + channel=Security; EventID=4697; provider=Microsoft-Windows-Security-Auditing", detail), \
       dh_kvfe=coalesce(dh_kvfe, 0), fold_keys=if(isnotnull(dh_fks), mvjoin(mvdedup(dh_fks), " "), null()) \
| eval fold_events=max(coalesce(dh_new_oth, 0), dh_kvfe) \
| eval events=max(coalesce(dh_new_own, 0), coalesce(dh_kvev, 0)-dh_kvfe)+fold_events, fold_events=if(fold_events>0, fold_events, null()), \
       dh_inwin=if(time>=$now$-`dh_tamper_lookback_secs`, 1, 0) \
| eval dh_near=mvmap(dh_mks, if(tonumber(mvindex(split(dh_mks, "#|#"), 0))>=time-`dh_tamper_window_secs` AND tonumber(mvindex(split(dh_mks, "#|#"), 0))<=time+`dh_tamper_marker_slack_secs`, printf("%010d", abs(tonumber(mvindex(split(dh_mks, "#|#"), 0))-time))."#|#".dh_mks, null())) \
| eval dh_best=mvindex(mvsort(dh_near), 0), dh_frozen=coalesce(dh_kvs, collected_suppressed) \
| eval suppressed=case(isnotnull(dh_frozen), dh_frozen, dh_inwin==1 AND isnotnull(dh_best), 1, true(), 0), \
       dh_b=case(isnotnull(dh_kvs), split(dh_kvm, "#|#"), suppressed==1 AND isnotnull(dh_best), mvindex(split(dh_best, "#|#"), 1, 4)) \
| eval marker_time=tonumber(mvindex(dh_b, 0)), marker_action=mvindex(dh_b, 1), marker_by=mvindex(dh_b, 2), marker_run_id=mvindex(dh_b, 3) \
| eval dh_new=if(dh_inwin==1 AND (isnull(collected_suppressed) OR collected_suppressed!=suppressed), 1, 0), _key=finding_id, updated=$now$ \
| table _key finding_id host time code indicator detail events bucket suppressed marker_action marker_time marker_by marker_run_id fold_keys fold_events collected_suppressed dh_new updated

# Folds a 7045 (SCM) and a 4697 (Security) for the same service into one finding (#50): one software
# update logs both, from two channels the UF reads independently, so either can be indexed first and
# in a different DH Tamper run. Step of dh_tamper_finish, over its new and stored (kv) rows, after
# finding_id is set. dh_tamper_win gives each 7045/4697 its fold keys: the service key (7045's
# ServiceName is the display name, so its key is the "(Key)" at its end when there is one) or, for a
# 7045 without one, its binary path; a 4697 has both. Stored findings keep theirs in fold_keys. A
# new 7045/4697 event joins a finding of the other code on the same host that shares a key and is
# at most dh_tamper_window_secs away (not the 5-minute bucket: a pair can straddle it):
#   - its own finding is already stored: it stays there (old ids never move);
#   - else a stored partner: it joins that finding_id (and its code), so a half that already alerted
#     is never followed by a second alert;
#   - else the earlier of the two events (then the lower code) gives the id.
# It sets dh_oth=1 on an event counted under the other code (fold_events), and dh_ptxt, the
# finding's text: "7045+4697 service installed: <key> (<display name>)".
[dh_tamper_fold(1)]
args = now
definition = eventstats max(eval(if(dh_src=="kv", 1, 0))) as dh_inkv by finding_id \
| eval dh_ocode=code, dh_fk=case(dh_src=="new" AND (code=="win7045" OR code=="win4697") AND isnotnull(fold), split(fold, " "), \
                                 dh_src=="kv" AND (code=="win7045" OR code=="win4697") AND isnotnull(fold_keys) AND time>=$now$-`dh_tamper_lookback_secs`-`dh_tamper_window_secs`, split(fold_keys, " ")), \
       dh_fnm=case(dh_src=="new", svc, dh_src=="kv" AND match(indicator, "^(7045|4697) service installed: "), replace(indicator, "^(7045|4697) service installed: ", "")) \
| eval dh_fc=if(isnotnull(dh_fk), mvmap(dh_fk, dh_fk.";".time.";".code.";".if(dh_inkv==1, 1, 0).";".finding_id.";".coalesce(dh_fnm, "")), null()) \
| eventstats values(dh_fc) as dh_fall by host \
| eval dh_fp=if(dh_src=="new" AND isnotnull(dh_fk), mvmap(dh_fall, if(mvindex(split(dh_fall, ";"), 2)!=code AND isnotnull(mvfind(dh_fk, "^".mvindex(split(dh_fall, ";"), 0)."$")) AND abs(tonumber(mvindex(split(dh_fall, ";"), 1))-time)<=`dh_tamper_window_secs`, (1-tonumber(mvindex(split(dh_fall, ";"), 3))).";".printf("%012d", tonumber(mvindex(split(dh_fall, ";"), 1))).";".mvindex(split(dh_fall, ";"), 2).";".replace(dh_fall, "^([^;]*;){4}", ""), null())), null()) \
| eval dh_pb=mvindex(mvsort(dh_fp), 0) \
| eval dh_pk=mvindex(split(dh_pb, ";"), 0), dh_pt=tonumber(mvindex(split(dh_pb, ";"), 1)), dh_pc=mvindex(split(dh_pb, ";"), 2), dh_pf=mvindex(split(dh_pb, ";"), 3), dh_pn=replace(dh_pb, "^([^;]*;){4}", "") \
| eval dh_s4=if(code=="win4697", svc, dh_pn), dh_s7=if(code=="win7045", svc, dh_pn) \
| eval dh_ptxt=if(isnotnull(dh_pb) AND coalesce(dh_s4, "")!="" AND coalesce(dh_s7, "")!="", "7045+4697 service installed: ".if(mvcount(split(lower(dh_s7), lower(dh_s4)))>1, dh_s7, dh_s4." (".dh_s7.")"), null()) \
| eval finding_id=case(isnull(dh_pb) OR dh_inkv==1, finding_id, dh_pk=="0", dh_pf, dh_pt<time OR (dh_pt==time AND dh_pc<code), dh_pf, true(), finding_id) \
| eval code=if(dh_src=="new", mvindex(split(finding_id, "|"), 1), code), bucket=if(dh_src=="new", tonumber(mvindex(split(finding_id, "|"), 2)), bucket), dh_oth=if(dh_src=="new" AND dh_ocode!=code, 1, 0) \
| fields - dh_inkv dh_fc dh_fall dh_fp dh_pb dh_pk dh_pt dh_pc dh_pf dh_pn dh_s4 dh_s7 dh_fnm

# Findings shaped for collect: host is renamed dh_host (collect would move it to orig_host).
[dh_tamper_collect_rows]
definition = rename host AS dh_host \
| eval _time=time \
| table _time finding_id dh_host time code indicator detail events bucket suppressed marker_action marker_time marker_by marker_run_id

########## Alerts (§7.3), over the summary events
# DH Alert missing: transitions to MISSING with criticality <= 2 (an unset criticality counts as 2).
[dh_alert_missing_rows]
definition = where status=="MISSING" \
| eval alert_criticality=coalesce(tonumber(criticality), 2) \
| where alert_criticality<=2 \
| table _time entity_id level dh_index dh_host dh_sourcetype dh_source prev_status status since cause_code cause action criticality alert_criticality host_rollup threshold_secs threshold_origin

# DH Alert tamper: new unsuppressed findings (dh:tamper events).
[dh_alert_tamper_rows]
definition = where coalesce(tonumber(suppressed), 0)==0 \
| table _time finding_id dh_host time code indicator detail events

########## DH Admin log copy (§7.2): dh_admin_log rows after the dh_meta[admin_copy] high-water
# mark (hwm) and at least 60 s old, so rows written in the same second as the mark are not lost.
[dh_admin_copy_rows(2)]
args = meta, now
definition = eval dh_meta_key="admin_copy", admin_key=_key \
| lookup $meta$ name AS dh_meta_key OUTPUT hwm AS dh_hwm \
| eval time=tonumber(time), dh_hwm=coalesce(tonumber(dh_hwm), 0) \
| where isnotnull(time) AND time>dh_hwm AND time<=$now$-60 \
| eval _time=time \
| table _time time actor action entity_id detail reason ticket admin_key

########## DH Prune (§7.3, §7.7). Each marks rows: dh_drop=1 (delete) and dh_change=1 (rewrite
# needed). The saved searches rewrite a collection only when something changed (map), so an
# all-expired table can still be emptied (override_if_empty) and an unchanged one is never touched.
# dh_overrides (every minute): an expired mute is cleared; the row goes when nothing is left
# (no active mute and no threshold override).
[dh_prune_mark_overrides(1)]
args = now
definition = eval dh_mu=tonumber(mute_until), dh_th=tonumber(threshold_override_secs) \
| eval dh_exp=if(isnotnull(dh_mu) AND dh_mu<=$now$, 1, 0) \
| eval mute_until=if(dh_exp==1, null(), mute_until) \
| eval dh_drop=if(isnull(tonumber(mute_until)) AND isnull(dh_th), 1, 0) \
| eval dh_change=if(dh_drop==1 OR dh_exp==1, 1, 0) \
| fields - dh_mu dh_th dh_exp

# dh_status rows of entities that are no longer enabled in dh_expected, so a re-added entity
# starts a fresh grace (task 9 carries expected_since in dh_status). Nothing is dropped while
# dh_expected has no enabled rows at all. Used by DH Evaluate (dh_status_keep), the one writer.
[dh_prune_mark_status(1)]
args = expected
definition = eval dh_src="st" \
| append [| `dh_expected_rows($expected$)` | eval dh_src="exp" | fields entity_id dh_src] \
| eventstats sum(eval(if(dh_src=="exp", 1, 0))) as dh_e by entity_id \
| eventstats sum(eval(if(dh_src=="exp", 1, 0))) as dh_nexp \
| where dh_src=="st" \
| eval dh_drop=if(dh_nexp>0 AND coalesce(dh_e, 0)==0, 1, 0), dh_change=dh_drop \
| fields - dh_src dh_e dh_nexp

# dh_state_fast/slow (daily): rows older than dh_state_retention_secs that no enabled expected
# entity uses (at its source, sourcetype or host level).
[dh_prune_mark_state(2)]
args = expected, now
definition = eval dh_src="st", dh_id1="source|".index."|".host."|".sourcetype."|".source, dh_id2="sourcetype|".index."|".host."|".sourcetype."|*", dh_id3="host|*|".host."|*|*" \
| append [| `dh_expected_rows($expected$)` | eval dh_src="exp", dh_id1=entity_id, dh_id2=entity_id, dh_id3=entity_id | fields dh_src dh_id1 dh_id2 dh_id3] \
| eventstats sum(eval(if(dh_src=="exp", 1, 0))) as dh_e1 by dh_id1 \
| eventstats sum(eval(if(dh_src=="exp", 1, 0))) as dh_e2 by dh_id2 \
| eventstats sum(eval(if(dh_src=="exp", 1, 0))) as dh_e3 by dh_id3 \
| where dh_src=="st" \
| eval dh_drop=if(coalesce(dh_e1, 0)+coalesce(dh_e2, 0)+coalesce(dh_e3, 0)==0 AND coalesce(tonumber(last_indextime), 0)<$now$-`dh_state_retention_secs`, 1, 0), dh_change=dh_drop \
| fields - dh_src dh_id1 dh_id2 dh_id3 dh_e1 dh_e2 dh_e3

# dh_fwd (daily): hosts not updated for dh_fwd_retention_secs that are not expected.
[dh_prune_mark_fwd(2)]
args = expected, now
definition = eval dh_src="fw" \
| append [| `dh_expected_rows($expected$)` | eval dh_src="exp" | fields host dh_src] \
| eventstats sum(eval(if(dh_src=="exp", 1, 0))) as dh_e by host \
| where dh_src=="fw" \
| eval dh_drop=if(coalesce(dh_e, 0)==0 AND coalesce(tonumber(updated), 0)<$now$-`dh_fwd_retention_secs`, 1, 0), dh_change=dh_drop \
| fields - dh_src dh_e

[dh_prune_mark_tamper(1)]
args = now
definition = eval dh_drop=if(coalesce(tonumber(time), 0)<$now$-`dh_tamper_retention_secs`, 1, 0), dh_change=dh_drop

[dh_prune_mark_volume(1)]
args = now
definition = eval dh_drop=if(coalesce(tonumber(updated), 0)<$now$-`dh_volume_retention_secs`, 1, 0), dh_change=dh_drop

[dh_prune_mark_baseline(1)]
args = now
definition = eval dh_drop=if(coalesce(tonumber(updated), 0)<$now$-`dh_baseline_retention_secs`, 1, 0), dh_change=dh_drop

# dh_admin_log (daily): rows older than dh_admin_retention_secs that DH Admin log copy has copied.
[dh_prune_mark_admin_log(2)]
args = meta, now
definition = eval dh_meta_key="admin_copy" \
| lookup $meta$ name AS dh_meta_key OUTPUT hwm AS dh_hwm \
| eval dh_drop=if(isnotnull(tonumber(dh_hwm)) AND tonumber(time)<=tonumber(dh_hwm) AND tonumber(time)<$now$-`dh_admin_retention_secs`, 1, 0), dh_change=dh_drop \
| fields - dh_meta_key dh_hwm

# The marks over the real collections, by collection name (DH Prune daily maps over the names).
[dh_prune_mark_dh_state_fast]
definition = `dh_prune_mark_state(dh_expected, now())`

[dh_prune_mark_dh_state_slow]
definition = `dh_prune_mark_state(dh_expected, now())`

[dh_prune_mark_dh_fwd]
definition = `dh_prune_mark_fwd(dh_expected, now())`

[dh_prune_mark_dh_tamper]
definition = `dh_prune_mark_tamper(now())`

[dh_prune_mark_dh_volume]
definition = `dh_prune_mark_volume(now())`

[dh_prune_mark_dh_baseline]
definition = `dh_prune_mark_baseline(now())`

[dh_prune_mark_dh_admin_log]
definition = `dh_prune_mark_admin_log(dh_meta, now())`

########## DH Daily SoH report (§8.4). Each section yields rows: section, item, value (+ extras).
# Outages (from dh:transition rows over 7 d): a stretch of LATE/MISSING/NEVER_SEEN from the
# transition into it to the transition out of it (to OK, MUTED or INFO); those ended in the last
# 24 h or still open. An outage counts as open only while $status$ (dh_status) still shows the
# entity LATE/MISSING/NEVER_SEEN, so a retired entity or a lost recovery transition doesn't stay
# open forever. mttr = mean duration of the ended ones. end_status is the status that ended it.
[dh_soh_outages(2)]
args = status, now
definition =eval dh_bad=if(status=="LATE" OR status=="MISSING" OR status=="NEVER_SEEN", 1, 0), dh_pbad=if(prev_status=="LATE" OR prev_status=="MISSING" OR prev_status=="NEVER_SEEN", 1, 0) \
| eval dh_start=if(dh_bad==1 AND dh_pbad==0, 1, 0), dh_end=if(dh_bad==0 AND dh_pbad==1, 1, 0) \
| where dh_start==1 OR dh_end==1 \
| sort 0 entity_id _time \
| streamstats current=f window=1 last(dh_start) as dh_ps, last(_time) as dh_pt by entity_id \
| eventstats max(_time) as dh_last by entity_id \
| lookup $status$ entity_id OUTPUT status AS dh_cur \
| eval dh_cur_bad=if(dh_cur=="LATE" OR dh_cur=="MISSING" OR dh_cur=="NEVER_SEEN", 1, 0) \
| eval start=case(dh_end==1 AND dh_ps==1, dh_pt, dh_start==1 AND _time==dh_last AND dh_cur_bad==1, _time), end=if(dh_end==1 AND dh_ps==1, _time, null()), end_status=if(dh_end==1 AND dh_ps==1, status, null()), open=if(dh_start==1 AND _time==dh_last AND dh_cur_bad==1, 1, 0) \
| where isnotnull(start) \
| eval duration_secs=coalesce(end, $now$)-start \
| where open==1 OR end>=$now$-86400 \
| eval section="outage", item=entity_id, value=duration_secs \
| appendpipe [| stats count as outages, sum(open) as open_outages, avg(eval(if(open==0, duration_secs, null()))) as mttr_secs | eval section="mttr", item="all", value=round(mttr_secs)] \
| table section item value start end end_status open outages open_outages mttr_secs entity_id dh_host

# Flapping: >= 3 transitions in the last 24 h.
[dh_soh_flapping(1)]
args = now
definition = where _time>=$now$-86400 \
| stats count as value by entity_id \
| where value>=3 \
| eval section="flapping", item=entity_id \
| table section item value entity_id

# From dh_status: never-seen entities, and expectations with an invalid profile (task 9 ruling).
[dh_soh_status]
definition = eval section=split(trim(if(status=="NEVER_SEEN", "never_seen ", "").if(threshold_origin=="invalid_profile", "invalid_profile", "")), " ") \
| mvexpand section \
| where isnotnull(section) AND section!="" \
| eval item=entity_id, value=if(section=="never_seen", expected_since, threshold_note), dh_host=host \
| table section item value entity_id dh_host status threshold_note

# From dh_fwd (UF rows): off the expected version, or no heartbeat/tcpin for dh_fwd_disconnect_secs.
[dh_soh_fwd(1)]
args = now
definition = where isnotnull(guid) OR isnotnull(last_heartbeat) \
| eval dh_seen=max(coalesce(tonumber(last_heartbeat), 0), coalesce(tonumber(last_tcpin), 0)) \
| eval section=split(trim(if(isnotnull(version) AND version!=`dh_fwd_expected_version`, "fwd_version ", "").if(dh_seen<$now$-`dh_fwd_disconnect_secs`, "fwd_disconnected", "")), " ") \
| mvexpand section \
| where isnotnull(section) AND section!="" \
| eval item=host, value=if(section=="fwd_version", version, dh_seen), dh_host=host, last_seen=dh_seen \
| table section item value dh_host version last_seen

# From dh_overrides: active mutes, and those expiring within 24 h (§7.7).
[dh_soh_mutes(1)]
args = now
definition = eval dh_mu=tonumber(mute_until) \
| where dh_mu>$now$ \
| eval section=split(if(dh_mu<=$now$+86400, "mute_active mute_expiring", "mute_active"), " ") \
| mvexpand section \
| eval item=entity_id, value=dh_mu \
| table section item value entity_id reason ticket set_by

# From dh:daily (latest day): sourcetype-level entities whose per-minute lag p95 >= dh_lag_warn_secs.
[dh_soh_lag]
definition = where record=="entity" AND level=="sourcetype" \
| eval day=tonumber(day) \
| eventstats max(day) as dh_latest \
| where day==dh_latest AND tonumber(lag_p95)>=`dh_lag_warn_secs` \
| eval section="lag", item=entity_id, value=lag_p95 \
| table section item value entity_id dh_host day

# From dh:volume events: entities flagged in the last 24 h (value = flagged hours).
[dh_soh_volume(1)]
args = now
definition = where _time>=$now$-86400 AND tonumber(flagged)==1 \
| stats count as value, min(ratio) as min_ratio by entity_id \
| eval section="volume", item=entity_id \
| table section item value min_ratio entity_id

# Licence (§6.2): rows kind=usage (b, bytes indexed yesterday), kind=license (REST
# licenser/licenses) and kind=group (REST licenser/groups). Usage against the active group's quota,
# and days until its earliest expiry.
[dh_soh_licence(1)]
args = now
definition = eval dh_g=if(kind=="group" AND tonumber(is_active)==1, title, null()) \
| eventstats values(dh_g) as dh_active \
| eval dh_in=if(kind=="license" AND status=="VALID" AND isnotnull(mvfind(dh_active, "^".group_id."$")), 1, 0) \
| eval dh_q=if(dh_in==1, tonumber(quota), null()), dh_x=if(dh_in==1, tonumber(expiration_time), null()) \
| stats sum(eval(if(kind=="usage", tonumber(b), 0))) as used_bytes, sum(dh_q) as quota_bytes, min(dh_x) as expires, values(dh_active) as group \
| eval usage_pct=floor(1000*used_bytes/quota_bytes+0.5)/10, expires_days=floor((expires-$now$)/86400) \
| eval section="licence", item=mvappend("usage_pct", "expires_days") \
| mvexpand item \
| eval value=if(item=="usage_pct", usage_pct, expires_days) \
| table section item value used_bytes quota_bytes expires group

# From the scheduler log: skipped runs of this app's searches in 24 h, and a total (also when 0).
[dh_soh_skipped]
definition = eval dh_sk=if(status=="skipped", 1, 0) \
| stats sum(dh_sk) as value by savedsearch_name \
| where value>0 \
| eval section="skipped", item=savedsearch_name \
| appendpipe [| stats sum(value) as value, count as dh_n | eval section="skipped", item="total", value=coalesce(value, 0)] \
| table section item value

########## Task 12: dashboards (spec §8). Every panel search is a macro over lookup names or piped
# rows, so tests/spl runs the same SPL on fixtures (cases/81-92) and times the Overview on KV at
# 300 hosts (dash.sh load). Time columns are formatted with dh_ui_time_fmt.

[dh_ui_time_fmt]
definition = "%Y-%m-%d %H:%M"

# The same with the time zone (Manage, task 12e): times are shown in the viewer's Splunk time zone,
# so every time on Manage says which one.
[dh_ui_time_fmt_tz]
definition = "%Y-%m-%d %H:%M %Z"

########## Manage display mappings (task 12e). They change only what is shown: the stored values,
# keys and action codes stay as they are.

# Eval expression: an Item ID (level|index|host|sourcetype|source) in words, for example
# "pi5: whole host", "pi5 › syslog (enclave1)", "pi5 › linux_secure › /var/log/secure (linux)".
# Anything else is returned as it is.
[dh_ui_item_words(1)]
args = id
definition = case(mvindex(split($id$, "|"), 0)=="host", mvindex(split($id$, "|"), 2).": whole host", \
  mvindex(split($id$, "|"), 0)=="sourcetype", mvindex(split($id$, "|"), 2)." › ".mvindex(split($id$, "|"), 3)." (".mvindex(split($id$, "|"), 1).")", \
  mvindex(split($id$, "|"), 0)=="source", mvindex(split($id$, "|"), 2)." › ".mvindex(split($id$, "|"), 3)." › ".replace($id$, "^([^|]*[|]){4}", "")." (".mvindex(split($id$, "|"), 1).")", \
  true(), $id$)

# Eval expression: a test-block key (h|*|*, h|sourcetype|*, h|sourcetype|<raw source>) in words:
# "pi5: whole host", "pi5 › syslog", "pi5 › linux_secure › /var/log/secure.1 (exact source)".
[dh_ui_block_words(1)]
args = k
definition = case(isnull($k$) OR $k$=="-", $k$, \
  mvindex(split($k$, "|"), 1)=="*", mvindex(split($k$, "|"), 0).": whole host", \
  mvindex(split($k$, "|"), 2)=="*", mvindex(split($k$, "|"), 0)." › ".mvindex(split($k$, "|"), 1), \
  true(), mvindex(split($k$, "|"), 0)." › ".mvindex(split($k$, "|"), 1)." › ".replace($k$, "^[^|]*[|][^|]*[|]", "")." (exact source)")

# Eval expression: an admin-log action code in words.
[dh_ui_action_words(1)]
args = action
definition = case($action$=="override_mute", "Mute", $action$=="override_unmute", "Unmute", $action$=="override_threshold", "Set limit", \
  $action$=="override_clear", "Clear limit", $action$=="expected_add", "Add expected row", $action$=="expected_adopt", "Adopt", \
  $action$=="block_add", "Add test block", $action$=="block_remove", "Remove test block", true(), $action$)

# Eval expression: a number of seconds in words ("1 hour", "7 days", "20 minutes", "90 s").
[dh_ui_secs_words(1)]
args = secs
definition = case(isnull(tonumber($secs$)), "-", \
  tonumber($secs$)>0 AND tonumber($secs$)%86400==0, (tonumber($secs$)/86400).if(tonumber($secs$)==86400, " day", " days"), \
  tonumber($secs$)>0 AND tonumber($secs$)%3600==0, (tonumber($secs$)/3600).if(tonumber($secs$)==3600, " hour", " hours"), \
  tonumber($secs$)>0 AND tonumber($secs$)%60==0, (tonumber($secs$)/60).if(tonumber($secs$)==60, " minute", " minutes"), \
  true(), tonumber($secs$)." s")

# Eval expression: where an item's limit comes from (dh_threshold's threshold_origin), in words.
[dh_ui_origin_words(1)]
args = origin
definition = case($origin$=="override", "Override (set on Manage)", $origin$=="max_gap_secs", "Fixed limit on its expected row", \
  $origin$=="learned", "Learned from its history", $origin$=="default", "Profile default", \
  $origin$=="invalid_profile", "Profile default (the row's profile is unknown)", $origin$=="none", "None (INFO: never alerts)", true(), $origin$)

# Admin-log rows for display: the action and item in words, the time with its zone and the detail's
# arrow as "→" (the stored detail is not changed). Adds ui_change and ui_item.
[dh_ui_log_words]
definition = eval ui_change=`dh_ui_action_words(action)`, \
       ui_item=if(like(action, "block_%"), `dh_ui_block_words(entity_id)`, `dh_ui_item_words(entity_id)`), \
       time=strftime(tonumber(time), `dh_ui_time_fmt_tz`), \
       detail=replace(replace(replace(detail, " -> ", " → "), "managed_by ", "managed by "), " / threshold ", " / limit ")

# Manage, Admin log tab: the admin log, newest first, for display, with dh_hay (the words that the
# search box looks in) for dh_ui_hay_filter.
[dh_ui_admin_log(1)]
args = admin_log
definition = inputlookup $admin_log$ \
| eval dh_t=tonumber(time) \
| sort 0 -dh_t \
| `dh_ui_log_words` \
| eval dh_hay=lower(coalesce(actor, "")." ".ui_change." ".coalesce(ui_item, "")." ".coalesce(entity_id, "")." ".coalesce(detail, "")." ".coalesce(reason, "")." ".coalesce(ticket, "")) \
| table time actor ui_change ui_item detail reason ticket entity_id dh_hay

# The search box of a table: keeps the rows whose dh_hay contains every word of f_text (set by the
# dashboard with eval f_text=$tok|s$), case-insensitive, words separated by *; "*" or "" keeps all.
# Compared literally, as in dh_ui_filter.
[dh_ui_hay_filter]
definition = eval dh_frags=split(lower(f_text), "*") \
| eval dh_miss=if(f_text=="*" OR f_text=="", null(), mvmap(dh_frags, if(dh_frags=="", null(), if(mvcount(split(dh_hay, dh_frags))>1, null(), 1)))) \
| where isnull(dh_miss) \
| fields - f_text dh_hay dh_frags dh_miss

# Manage: the current mutes and limit overrides ($overrides$ = dh_overrides) for display.
[dh_ui_overrides(1)]
args = overrides
definition = inputlookup $overrides$ \
| eval dh_mu=tonumber(mute_until), dh_th=tonumber(threshold_override_secs) \
| eval ui_item=`dh_ui_item_words(entity_id)`, mute_until=if(isnull(dh_mu), "-", strftime(dh_mu, `dh_ui_time_fmt_tz`)), \
       set_at=strftime(tonumber(set_at), `dh_ui_time_fmt_tz`), limit_override=if(isnull(dh_th), "-", `dh_ui_secs_words(dh_th)`." (".dh_th." s)") \
| sort 0 entity_id \
| table ui_item mute_until reason ticket limit_override set_by set_at entity_id

# Manage: the current test blocks ($blocks$ = hl_ingest_block) for display. The seed row keeps the
# search valid while the file is empty; the placeholder row k="-" is left out.
[dh_ui_blocks(2)]
args = blocks, now
definition = makeresults \
| eval dh_seed=1 \
| inputlookup append=true $blocks$ \
| where isnull(dh_seed) AND isnotnull(k) AND k!="-" \
| eval dh_u=tonumber(until) \
| eval ui_item=`dh_ui_block_words(k)`, state=if(dh_u>$now$, "test block until ".strftime(dh_u, "%H:%M %Z"), "expired: no longer applied (it leaves this list at the next cribl_block run)"), \
       until=strftime(dh_u, `dh_ui_time_fmt_tz`) \
| table ui_item until reason set_by state k

# Manage, Add an expected row: the index choices, read from dh_indexes (the indexes the trackers
# watch), so the list is kept in one place. One row per index: label, value.
[dh_ui_indexes]
definition = rest splunk_server=local /servicesNS/nobody/hl_data_health/admin/macros/dh_indexes \
| eval value=split(replace(definition, " ", ""), ",") \
| mvexpand value \
| eval label=value \
| table label value

# Plain column headers for every dashboard table (task 12d): the last step of each table's search.
# The macros and tests keep the field names; only what is shown changes. A drilldown reads the shown
# name (row.Host.value). docs/data-health/dashboards.md describes the columns by these headers.
[dh_ui_headers]
definition = rename host AS "Host", state AS "State", worst AS "Worst status", children AS "Bad items", since AS "Since", duration AS "For", \
  criticality AS "Criticality", cause AS "Cause", action AS "Action", runbook AS "Runbook", recovered AS "Back to OK at", entity_id AS "Item ID", \
  down_since AS "Down since", down_for AS "Down for", first_seen AS "First seen", time AS "Time", indicator AS "What was seen", events AS "Events", \
  code AS "Code", detail AS "Detail", status AS "Status", age_vs_threshold AS "Silent for / limit", profile AS "Profile", \
  origin AS "Limit from", threshold_note AS "About the limit", label AS "Mute or test block", volume AS "Last hour volume", clock_skew AS "Clock wrong", \
  fact AS "Fact", value AS "Value", component AS "Agent component", message AS "Message", finding_id AS "Finding ID", \
  prev_status AS "From status", vm AS "VM", event_id AS "Event ID", meaning AS "Meaning", entities AS "Items", before AS "Before", after AS "After", \
  check AS "Check", mute_until AS "Muted until", reason AS "Reason", ticket AS "Ticket", threshold_override_secs AS "Threshold override (s)", \
  set_by AS "Set by", set_at AS "Set at", level AS "Level", index AS "Index", sourcetype AS "Sourcetype", sources AS "Sources", last_seen AS "Last seen", \
  suggested_profile AS "Suggested profile", days AS "Days covered", managed_by AS "Managed by", configured AS "Configured limit (s)", \
  default AS "Default limit (s)", learned_raw AS "Learned before bounds (s)", learned AS "Learned limit (s)", skipped_days AS "Days skipped", \
  applied_secs AS "Limit applied (s)", applied_origin AS "Applied from", applied_note AS "About the applied limit", source AS "Source (raw name)", \
  source_norm AS "Normalized source", k AS "Block key", until AS "Until", result AS "Result", actor AS "Who", start AS "Started", \
  end AS "Ended", section AS "Kind", version AS "Version", lag_p95_secs AS "Delay p95 (s)", day AS "Day", flagged_hours AS "Hours flagged", \
  min_ratio AS "Lowest share of usual", search AS "Search", skipped_24h AS "Times skipped", transitions_24h AS "Status changes (24 h)", \
  ui_change AS "Change", ui_item AS "Item", ui_now AS "Now", ui_after AS "After the change", limit_override AS "Limit override"

# dh_status rows more than this behind the newest evaluated_at are not current: entities that are
# no longer expected linger until DH Evaluate drops them (task 11 ruling). DH Evaluate writes every
# row with the same evaluated_at once a minute, so this is 2.5 runs.
[dh_ui_current_secs]
definition = 150

# The banner flags DH Evaluate as stale after this (it runs every minute).
[dh_ui_eval_stale_secs]
definition = 180

# The current dh_status rows.
[dh_ui_status(1)]
args = status
definition = inputlookup $status$ \
| eval evaluated_at=tonumber(evaluated_at) \
| eventstats max(evaluated_at) as dh_last \
| where evaluated_at>=dh_last-`dh_ui_current_secs` \
| fields - dh_last _key _user

# The dashboard filters (spec §8), read from fields that the dashboard sets first with
# eval f_site=$f_site|s$, ... (a "|" inside a macro argument would split the search): f_site,
# f_owner, f_index, f_crit, f_status (an entity status, or a host roll-up DOWN/DEGRADED) and f_text.
# "*" means all. An index filter keeps only rows of that index, so host rows (index *) drop out.
# f_text: case-insensitive words, separated by *, that must all appear in the entity_id, description
# or cause. They are compared literally (split, not like() or a regex), so % _ . | are plain text.
[dh_ui_filter]
definition = eval dh_hay=lower(entity_id." ".coalesce(description, "")." ".coalesce(cause, "")), dh_frags=split(lower(f_text), "*") \
| eval dh_miss=if(f_text=="*" OR f_text=="", null(), mvmap(dh_frags, if(dh_frags=="", null(), if(mvcount(split(dh_hay, dh_frags))>1, null(), 1)))) \
| where (f_site=="*" OR coalesce(site, "")==f_site) \
  AND (f_owner=="*" OR coalesce(owner, "")==f_owner) \
  AND (f_index=="*" OR coalesce(index, "")==f_index) \
  AND (f_crit=="*" OR tostring(criticality)==f_crit) \
  AND (f_status=="*" OR status==f_status OR host_rollup==f_status) \
  AND isnull(dh_miss) \
| fields - f_site f_owner f_index f_crit f_status f_text dh_hay dh_frags dh_miss

# KPI tiles (Overview), per level (controller ruling): <level>_expected, _ok, _late, _missing
# (MISSING and NEVER_SEEN), _muted and _pending for host, sourcetype and source, so a DOWN host
# with 5 missing children shows host_missing=1 and sourcetype/source missing=5.
[dh_ui_kpi]
definition = stats count as entities, sum(eval(if(level=="host" AND (true()), 1, 0))) as host_expected, sum(eval(if(level=="host" AND (status=="OK"), 1, 0))) as host_ok, sum(eval(if(level=="host" AND (status=="LATE"), 1, 0))) as host_late, sum(eval(if(level=="host" AND (status=="MISSING" OR status=="NEVER_SEEN"), 1, 0))) as host_missing, sum(eval(if(level=="host" AND (status=="MUTED"), 1, 0))) as host_muted, sum(eval(if(level=="host" AND (status=="PENDING"), 1, 0))) as host_pending, \
        sum(eval(if(level=="sourcetype" AND (true()), 1, 0))) as sourcetype_expected, sum(eval(if(level=="sourcetype" AND (status=="OK"), 1, 0))) as sourcetype_ok, sum(eval(if(level=="sourcetype" AND (status=="LATE"), 1, 0))) as sourcetype_late, sum(eval(if(level=="sourcetype" AND (status=="MISSING" OR status=="NEVER_SEEN"), 1, 0))) as sourcetype_missing, sum(eval(if(level=="sourcetype" AND (status=="MUTED"), 1, 0))) as sourcetype_muted, sum(eval(if(level=="sourcetype" AND (status=="PENDING"), 1, 0))) as sourcetype_pending, \
        sum(eval(if(level=="source" AND (true()), 1, 0))) as source_expected, sum(eval(if(level=="source" AND (status=="OK"), 1, 0))) as source_ok, sum(eval(if(level=="source" AND (status=="LATE"), 1, 0))) as source_late, sum(eval(if(level=="source" AND (status=="MISSING" OR status=="NEVER_SEEN"), 1, 0))) as source_missing, sum(eval(if(level=="source" AND (status=="MUTED"), 1, 0))) as source_muted, sum(eval(if(level=="source" AND (status=="PENDING"), 1, 0))) as source_pending \
| fillnull value=0 entities host_expected host_ok host_late host_missing host_muted host_pending sourcetype_expected sourcetype_ok sourcetype_late sourcetype_missing sourcetype_muted sourcetype_pending source_expected source_ok source_late source_missing source_muted source_pending

# Needs attention (Overview): one row per host with a LATE/MISSING/NEVER_SEEN row, sorted by
# severity (DOWN before DEGRADED, then the worst status), then criticality (1 first), then duration
# (oldest first). Cause, action and runbook come from the host row when it is bad, else from the
# worst child. No rows when nothing needs attention: dh_ui_attention_headline says so.
[dh_ui_attention(1)]
args = now
definition = eval dh_rank=case(status=="MISSING", 3, status=="NEVER_SEEN", 2, status=="LATE", 1, true(), 0) \
| where dh_rank>0 \
| eval dh_child=if(level!="host", 1, 0), dh_since=tonumber(since), dh_crit=coalesce(tonumber(criticality), 2), dh_pick=if(level=="host", 1, 0), \
       dh_label=case(level=="source", sourcetype." ".source, level=="sourcetype", sourcetype." (".index.")", true(), "host").": ".status \
| sort 0 host -dh_pick -dh_rank dh_since \
| stats first(cause) as cause, first(action) as action, first(runbook) as runbook, max(dh_rank) as dh_rank, max(eval(if(host_rollup=="DOWN", 1, 0))) as dh_down, \
        min(dh_crit) as criticality, min(dh_since) as dh_since, sum(dh_child) as dh_nchild, values(eval(if(dh_child==1, dh_label, null()))) as dh_labels by host \
| eval state=if(dh_down==1, "DOWN", "DEGRADED"), \
       worst=case(dh_rank==3, "MISSING", dh_rank==2, "NEVER_SEEN", dh_rank==1, "LATE"), \
       children=if(dh_nchild>0, dh_nchild.": ".mvjoin(mvindex(dh_labels, 0, 4), "; ").if(dh_nchild>5, "; ...", ""), null()), \
       since=strftime(dh_since, `dh_ui_time_fmt`), duration=tostring($now$-dh_since, "duration"), \
       dh_sev=if(dh_down==1, 2, 1)*10+dh_rank \
| sort 0 -dh_sev criticality dh_since \
| table host state worst children since duration criticality cause action runbook

# The Needs attention headline (one row: headline, sev), over the same rows: "All expected data is
# arriving" when no host needs attention, the count otherwise, and "on hold" while the evaluator's
# gate is closed (nothing is trustworthy then). A separate panel, so no table row is a placeholder.
[dh_ui_attention_headline]
definition = eval dh_bad=if(status=="MISSING" OR status=="NEVER_SEEN" OR status=="LATE", host, null()), dh_gate=if(like(coalesce(cause_code, ""), "gate_%"), 1, 0) \
| stats count as dh_rows, dc(dh_bad) as dh_hosts, max(dh_gate) as dh_gate \
| eval dh_gate=coalesce(dh_gate, 0), \
       headline=case(dh_gate==1, "On hold (see the banner above): no host is listed and no alerts fire until statuses refresh", dh_hosts==0, "All expected data is arriving", dh_hosts==1, "1 host needs attention", true(), dh_hosts." hosts need attention"), \
       sev=case(dh_gate==1, 2, dh_hosts==0, 0, true(), 3) \
| table headline sev

# The banner (spec §7.5), in plain words (task 12d; docs/data-health/dashboards.md explains each
# state). One row: banner (text) and sev (0 fine, 2 catching up, 3 blind). Checks, with the
# evaluator gate's tunables: the arrival tracker (DH Tracker fast) ran recently, Splunk indexed
# something recently, the status search (DH Evaluate) ran recently, and no pause is being caught up.
# "On hold" and "Catching up" are the gate's states: every status then shows PENDING and no alerts
# fire. "Out of date" means the statuses shown are older than dh_ui_eval_stale_secs.
[dh_ui_banner(3)]
args = meta, status, now
definition = makeresults \
| eval dh_k="tracker_fast" \
| lookup $meta$ name AS dh_k OUTPUT last_run AS dh_run last_rx AS dh_rx resumed_at AS dh_res \
| appendcols [| inputlookup $status$ | stats max(evaluated_at) as dh_ev] \
| eval dh_run=tonumber(dh_run), dh_rx=tonumber(dh_rx), dh_res=tonumber(dh_res), dh_ev=tonumber(dh_ev) \
| eval dh_s1=case(isnull(dh_run), "the arrival tracker (DH Tracker fast) has never run", $now$-dh_run>`dh_gate_stale_secs`, "the arrival tracker (DH Tracker fast) last ran ".($now$-dh_run)." s ago", true(), ""), \
       dh_s2=case(isnull(dh_rx), "Splunk has indexed nothing yet", $now$-dh_rx>`dh_gate_rx_secs`, "Splunk has indexed nothing new for ".($now$-dh_rx)." s", true(), ""), \
       dh_s3=case(isnull(dh_ev), "the status search (DH Evaluate) has not run yet", $now$-dh_ev>`dh_ui_eval_stale_secs`, "the status search (DH Evaluate) last ran ".($now$-dh_ev)." s ago", true(), ""), \
       dh_s4=if(isnotnull(dh_res) AND $now$-dh_res<`dh_gate_resume_secs`, "Splunk or the PC paused and resumed at ".strftime(dh_res, "%H:%M")." (sleep or restart)", "") \
| eval dh_parts=mvjoin(split(trim(replace(dh_s1."#".dh_s2."#".dh_s3."#".dh_s4, "#+", "#"), "#"), "#"), "; ") \
| eval sev=case(dh_s1!="" OR dh_s2!="" OR dh_s3!="", 3, dh_s4!="", 2, true(), 0), \
       banner=case(dh_s1!="" OR dh_s2!="", "On hold: ".dh_parts.". Statuses show PENDING and no alerts fire.", \
                   dh_s3!="", "Out of date: ".dh_parts.". The statuses below may be old.", \
                   dh_s4!="", "Catching up: ".dh_parts.". Statuses show PENDING for 5 min and no alerts fire.", \
                   true(), "Up to date: data is arriving and statuses were refreshed at ".strftime(dh_ev, "%H:%M")) \
| table banner sev

# Tamper findings in 24 h (Overview), from dh:tamper events with it = _indextime: the latest record
# per finding_id decides suppression (a finding is re-collected when its suppression changes), and
# "in 24 h" is by first-seen (the first record's index time), so late-arriving findings count.
# Suppressed findings (inside an Ansible marker window) are left out (task 11 ruling). For the
# dashboard filters each finding takes its host row's site, owner, criticality and status from
# $status$, index windows (win* codes) or linux, and the indicator as its cause.
[dh_ui_tamper_24h(2)]
args = status, now
definition = eval dh_it=tonumber(it), dh_v=printf("%012d", tonumber(it))."#".coalesce(tonumber(suppressed), 0) \
| stats min(dh_it) as dh_first, max(dh_v) as dh_v, min(time) as dh_time, max(events) as events, first(dh_host) as host, first(code) as code, first(indicator) as indicator, first(detail) as detail by finding_id \
| eval suppressed=tonumber(mvindex(split(dh_v, "#"), 1)) \
| where suppressed==0 AND dh_first>=$now$-86400 \
| sort 0 -dh_first \
| eval first_seen=strftime(dh_first, `dh_ui_time_fmt`), time=strftime(tonumber(dh_time), `dh_ui_time_fmt`), \
       entity_id="host|*|".host."|*|*", index=if(like(code, "win%"), "windows", "linux"), cause=indicator \
| `dh_ui_status_attrs($status$)` \
| table first_seen time host indicator events code detail finding_id entity_id index site owner criticality status host_rollup description cause

# The filter attributes of rows that carry entity_id, from the current rows of $status$ (dh_status):
# site, owner, criticality, status, host_rollup and description, plus dh_s_index and dh_s_cause for
# the caller to use. A row of $status$ more than dh_ui_current_secs behind the newest evaluated_at
# (an entity no longer expected) gives no attributes, as in dh_ui_status.
[dh_ui_status_attrs(1)]
args = status
definition = lookup $status$ entity_id OUTPUT site owner index AS dh_s_index criticality status host_rollup description cause AS dh_s_cause evaluated_at AS dh_s_ev \
| appendcols [| inputlookup $status$ | stats max(evaluated_at) as dh_s_last] \
| eventstats max(dh_s_last) as dh_s_last \
| where isnotnull(entity_id) \
| eval dh_s_cur=if(tonumber(dh_s_ev)>=tonumber(dh_s_last)-`dh_ui_current_secs`, 1, 0) \
| foreach site owner dh_s_index criticality status host_rollup description dh_s_cause [eval <<FIELD>>=if(dh_s_cur==1, '<<FIELD>>', null())] \
| fields - dh_s_ev dh_s_last dh_s_cur

# Recently recovered (Overview): outages (dh_soh_outages over dh:transition) that ended in 24 h with
# a transition to OK (not to MUTED or INFO: muting a dead host is no recovery), with the entity's
# dh_status attributes for the dashboard filters.
[dh_ui_recovered(2)]
args = status, now
definition = `dh_soh_outages($status$, $now$)` \
| where section=="outage" AND open==0 AND end_status=="OK" \
| eval host=coalesce(dh_host, mvindex(split(entity_id, "|"), 2)), recovered=strftime(end, `dh_ui_time_fmt`), down_since=strftime(start, `dh_ui_time_fmt`), down_for=tostring(value, "duration") \
| `dh_ui_status_attrs($status$)` \
| eval index=dh_s_index, cause=dh_s_cause \
| sort 0 -end \
| table recovered host entity_id down_since down_for site owner index criticality status host_rollup description cause

# Host detail: the host's rows (dh_status), with age against threshold, the threshold's origin, the
# test-block or mute label and the last hour's volume against its median ($volume$ = dh_volume).
[dh_ui_host_children(1)]
args = volume
definition = lookup $volume$ entity_id OUTPUT ratio AS dh_vr flagged AS dh_vf note AS dh_vn \
| eval ui_item=case(level=="host", "host (liveness: ".coalesce(liveness, "?").")", level=="sourcetype", index." / ".sourcetype, true(), index." / ".sourcetype." / ".source), \
       age_vs_threshold=if(isnull(age_secs), "never arrived", age_secs." s").if(isnotnull(threshold_secs), " / ".threshold_secs." s", " / none"), \
       origin=`dh_ui_origin_words(threshold_origin)`.if(tonumber(learning)==1, " (learning)", ""), \
       label=case(isnotnull(test_block_until), "test block until ".strftime(tonumber(test_block_until), "%H:%M %Z"), isnotnull(muted_until), "muted until ".strftime(tonumber(muted_until), `dh_ui_time_fmt_tz`)." (".coalesce(mute_reason, "").")"), \
       volume=if(isnotnull(dh_vr), "x".dh_vr." of median".if(tonumber(dh_vf)==1, " FLAGGED", ""), dh_vn), \
       since=strftime(tonumber(since), `dh_ui_time_fmt`), \
       dh_lv=case(level=="host", 0, level=="sourcetype", 1, true(), 2), dh_rank=case(status=="MISSING", 4, status=="NEVER_SEEN", 3, status=="LATE", 2, status=="OK", 0, true(), 1) \
| sort 0 dh_lv -dh_rank ui_item \
| table ui_item status age_vs_threshold profile origin threshold_note label since cause action volume clock_skew entity_id

# Host detail: the forwarder facts from the host's dh_fwd row, one fact per row.
[dh_ui_fwd(1)]
args = now
definition = eval dh_f=`dh_ui_time_fmt` \
| eval version=coalesce(version, "-").if(isnotnull(version) AND version!=`dh_fwd_expected_version`, " (expected ".`dh_fwd_expected_version`.")", ""), \
       os=coalesce(os, "-"), fwd_type=coalesce(fwd_type, "-"), \
       heartbeat=if(isnull(last_heartbeat), "never", strftime(tonumber(last_heartbeat), dh_f)." (".tostring($now$-tonumber(last_heartbeat), "duration")." ago)"), \
       last_connect=if(isnull(last_tcpin), "never", strftime(tonumber(last_tcpin), dh_f)." (".tostring($now$-tonumber(last_tcpin), "duration")." ago)"), \
       last_marker=if(isnull(last_marker_time), "none", last_marker_action." at ".strftime(tonumber(last_marker_time), dh_f)." by ".coalesce(last_marker_by, "?")." (run ".coalesce(last_marker_run_id, "?").")"), \
       last_vm_event=if(isnull(last_vm_event_time), "none", last_vm_event." (".case(last_vm_event==18500, "started", last_vm_event==18502, "turned off", last_vm_event==18504, "shut down by the host", last_vm_event==18508, "shut down by the guest OS", last_vm_event==18510, "saved", last_vm_event==18514, "reset by the guest", true(), "?").") at ".strftime(tonumber(last_vm_event_time), dh_f)), \
       probe=if(isnull(last_probe_time), "none", if(tonumber(last_probe_reachable)==1, "reachable", "unreachable")." at ".strftime(tonumber(last_probe_time), dh_f)) \
| eval dh_facts=mvappend("Agent version#|#".version, "Operating system#|#".os, "Agent type#|#".fwd_type, "Last heartbeat#|#".heartbeat, "Last connection to Cribl#|#".last_connect, "Last Ansible marker#|#".last_marker, "Last Hyper-V event#|#".last_vm_event, "Last device probe#|#".probe) \
| mvexpand dh_facts \
| eval fact=mvindex(split(dh_facts, "#|#"), 0), value=mvindex(split(dh_facts, "#|#"), 1) \
| table fact value \
| appendpipe [| stats count | where count==0 | eval fact="Splunk agent", value="No forwarder facts: this host has no Splunk agent or no Splunk agent has connected yet" | fields fact value]

# Host detail: Hyper-V Worker-Admin lifecycle events (spec §7.6, §14 g), from XmlWinEventLog _raw.
[dh_ui_hyperv]
definition = rex field=_raw "<EventID[^>]*>(?<event_id>[0-9]+)</EventID>" \
| rex field=_raw "<VmName>(?<vm>[^<]+)</VmName>" \
| where isnotnull(vm) \
| eval host=`dh_host_norm(vm)`, meaning=case(event_id=="18500", "started", event_id=="18502", "turned off", event_id=="18504", "shut down by the host (Shutdown IC)", event_id=="18506", "shutdown initiated", event_id=="18508", "shut down by the guest OS", event_id=="18510", "saved", event_id=="18514", "reset by the guest", event_id=="12050", "failed to restore", true(), "other"), \
       time=strftime(_time, `dh_ui_time_fmt`) \
| table time host vm event_id meaning

# Manage: learned against configured thresholds, per dh_status row. learned_raw is dh_baseline's
# value before the clamp, learned the clamped one dh_threshold would use (once days >= 3).
[dh_ui_thresholds(2)]
args = baseline, expected
definition = rename threshold_secs AS applied_secs, threshold_origin AS applied_origin, threshold_note AS applied_note \
| lookup $baseline$ entity_id OUTPUT learned_gap_secs AS bl_learned_gap_secs days AS bl_days skipped_days p90_max_gap_secs suggested_profile \
| lookup $expected$ entity_id OUTPUT max_gap_secs interval_secs managed_by \
| `dh_profile_defaults` \
| eval ov_threshold_secs=null() \
| `dh_threshold` \
| eval configured=coalesce(max_gap_secs, "-"), default=coalesce(dh_default_secs, "-"), learned_raw=coalesce(bl_learned_gap_secs, "-"), learned=coalesce(dh_learned, "-"), days=coalesce(bl_days, 0), \
       ui_item=`dh_ui_item_words(entity_id)`, applied_origin=`dh_ui_origin_words(applied_origin)` \
| table ui_item profile applied_secs applied_origin applied_note learned learned_raw default configured days skipped_days suggested_profile managed_by entity_id

# Unregistered (Manage adopt, Daily SoH): sourcetypes and hosts seen in the last 7 d (dh_state_*)
# that no enabled dh_expected row covers (a source row covers its sourcetype), with the baseline's
# suggested profile.
[dh_ui_unregistered(5)]
args = expected, state_fast, state_slow, baseline, now
definition = inputlookup $state_fast$ \
| inputlookup append=true $state_slow$ \
| where tonumber(last_indextime)>=$now$-604800 \
| eval host=`dh_host_norm(host)`, entity_id=split("sourcetype|".index."|".host."|".sourcetype."|*#host|*|".host."|*|*", "#"), dh_src="st" \
| mvexpand entity_id \
| eval level=mvindex(split(entity_id, "|"), 0), index=if(level=="host", "*", index), sourcetype=if(level=="host", "*", sourcetype) \
| stats max(last_indextime) as dh_last, min(first_seen) as dh_first, dc(source) as sources, max(dh_src) as dh_src by entity_id level index host sourcetype \
| append [| `dh_expected_rows($expected$)` | eval entity_id=if(level=="source", "sourcetype|".index."|".host."|".sourcetype."|*", entity_id), dh_src="exp" | fields entity_id dh_src] \
| eventstats sum(eval(if(dh_src=="exp", 1, 0))) as dh_e by entity_id \
| where dh_src=="st" AND dh_e==0 \
| lookup $baseline$ entity_id OUTPUT suggested_profile days \
| sort 0 -dh_last \
| eval last_seen=strftime(dh_last, `dh_ui_time_fmt_tz`), first_seen=strftime(dh_first, `dh_ui_time_fmt_tz`) \
| table entity_id level index host sourcetype sources last_seen first_seen suggested_profile days

########## Manage writes (spec §7.7, §7.8). A plan macro takes one request row (the form's tokens),
# reads the current state and returns: dh_ok (1 = valid), check (why not), before, after, the
# record to write, and dh_token = md5(the request and the current state). The dashboard offers
# dh_token as the only "Apply" choice of its confirmation input, and the write macro applies the
# plan only when the confirmation (field dh_confirm) equals the token. A repeat (a reload with the same URL tokens,
# or a second submit) therefore finds a different state, a different token, and applies nothing.

# The signed-in user, from the server (not from a token): actor and actor_roles. current-context
# lists only the roles assigned directly (admin shows admin, not the power and user it imports), so
# the imported roles are added from authorization/roles (dh_ui_roles_expand). If the user can't read
# that endpoint, only the direct roles count (fail closed).
[dh_ui_actor]
definition = appendcols [| rest splunk_server=local /services/authentication/current-context | fields username roles | rename username AS actor, roles AS actor_roles] \
| appendcols [| rest splunk_server=local count=0 /services/authorization/roles | eval dh_ri=title."=".mvjoin(imported_roles, ";") | stats values(dh_ri) as dh_role_imports] \
| `dh_ui_roles_expand`

# actor_roles plus the roles they import, three levels deep, from dh_role_imports ("role=a;b").
[dh_ui_roles_expand]
definition = `dh_ui_roles_step` | `dh_ui_roles_step` | `dh_ui_roles_step` | fields - dh_role_imports dh_add

[dh_ui_roles_step]
definition = eval dh_add=mvjoin(mvmap(dh_role_imports, if(isnotnull(mvfind(actor_roles, "^".mvindex(split(dh_role_imports, "="), 0)."$")), mvindex(split(dh_role_imports, "="), 1), null())), ";") \
| eval actor_roles=if(isnull(dh_add) OR dh_add=="", actor_roles, mvappend(actor_roles, split(dh_add, ";"))) \
| eval actor_roles=mvdedup(mvfilter(actor_roles!=""))

# The host terms for a raw search, as a subsearch over one row with field host:
# [| makeresults | eval host=$host|s$ | `dh_ui_host_terms`] gives ( host="h" OR host="h.*" ) for a
# valid normalized host name and host="#none" for anything else, so a token never reaches the SPL.
[dh_ui_host_terms]
definition = eval host=lower(trim(host)) \
| eval host=if(match(host, "^[a-z0-9][a-z0-9_-]*$"), mvappend(host, host.".*"), "#none") \
| fields host

# Form values: trimmed; "-" or empty means none.
[dh_ui_clean(1)]
args = fields
definition = foreach $fields$ [eval <<FIELD>>=if(isnull('<<FIELD>>') OR trim('<<FIELD>>')=="" OR trim('<<FIELD>>')=="-", null(), trim('<<FIELD>>'))]

# dh_overrides plan. The token also covers the item's admin-log times ($admin_log$), so a confirmation
# fits only once: DH Prune removing an expired mute would otherwise restore the previewed state
# (task 12e fix round 1). Request: entity_id, dh_action (mute | unmute | threshold | clear), dh_secs (the
# mute duration, or the threshold), reason (required), ticket, actor. A mute expires within 30 d.
# The row keeps the latest reason and ticket, except that a threshold change during an active mute
# keeps the mute's.
[dh_ui_override_plan(3)]
args = overrides, admin_log, now
definition = `dh_ui_clean(entity_id dh_action dh_secs reason ticket)` \
| eval dh_secs=tonumber(dh_secs) \
| lookup $overrides$ entity_id OUTPUT mute_until AS cur_mute_until reason AS cur_reason ticket AS cur_ticket threshold_override_secs AS cur_threshold set_at AS cur_set_at \
| eval cur_mute_until=tonumber(cur_mute_until), cur_threshold=tonumber(cur_threshold), dh_muted=if(cur_mute_until>$now$, 1, 0) \
| lookup $admin_log$ entity_id OUTPUT time AS dh_logt \
| eval dh_logt=mvjoin(mvsort(dh_logt), ",") \
| eval dh_token=md5(coalesce(dh_logt, "")."#".coalesce(actor, "")."#".coalesce(entity_id, "")."#".coalesce(dh_action, "")."#".coalesce(tostring(dh_secs), "")."#".coalesce(reason, "")."#".coalesce(ticket, "")."#".coalesce(tostring(cur_mute_until), "")."#".coalesce(cur_reason, "")."#".coalesce(cur_ticket, "")."#".coalesce(tostring(cur_threshold), "")."#".coalesce(tostring(cur_set_at), "")) \
| eval dh_msg=case(isnull(entity_id) OR NOT match(entity_id, "^(host|sourcetype|source)[|]"), "Choose an item", \
                   NOT (dh_action=="mute" OR dh_action=="unmute" OR dh_action=="threshold" OR dh_action=="clear"), "Choose an action", \
                   isnull(reason), "Write a reason", \
                   dh_action=="mute" AND NOT (dh_secs>0 AND dh_secs<=2592000), "A mute lasts at most 30 days", \
                   dh_action=="threshold" AND NOT (dh_secs>=60), "Enter the new limit in seconds: a number of at least 60", \
                   dh_action=="unmute" AND dh_muted==0, "This item is not muted: nothing to unmute", \
                   dh_action=="clear" AND isnull(cur_threshold), "This item has no limit override to clear"), \
       dh_ok=if(isnull(dh_msg), 1, 0) \
| eval mute_until=case(dh_action=="mute", $now$+dh_secs, dh_action=="unmute", null(), dh_muted==1, cur_mute_until), \
       threshold_override_secs=case(dh_action=="threshold", dh_secs, dh_action=="clear", null(), true(), cur_threshold), \
       dh_keep=if((dh_action=="threshold" OR dh_action=="clear") AND dh_muted==1, 1, 0) \
| eval reason=if(dh_keep==1, cur_reason, reason), ticket=if(dh_keep==1, cur_ticket, ticket), set_by=actor, set_at=$now$, _key=entity_id \
| eval before=if(isnull(cur_set_at) AND isnull(cur_mute_until) AND isnull(cur_threshold), "no override", "mute ".if(dh_muted==1, "until ".strftime(cur_mute_until, `dh_ui_time_fmt`), "none")." / threshold ".coalesce(cur_threshold." s", "none")." / reason ".coalesce(cur_reason, "-")), \
       after="mute ".if(isnotnull(mute_until), "until ".strftime(mute_until, `dh_ui_time_fmt`), "none")." / threshold ".coalesce(threshold_override_secs." s", "none")." / reason ".coalesce(reason, "-"), \
       dh_token=if(dh_ok==1, dh_token, null()), action="override_".coalesce(dh_action, "?"), check=coalesce(dh_msg, "OK: choose Apply under Confirm to write this change") \
| eval dh_item=`dh_ui_item_words(entity_id)`, ui_change=`dh_ui_action_words(action)`, ui_item=coalesce(dh_item, "-"), \
       ui_now=if(isnull(cur_set_at) AND isnull(cur_mute_until) AND isnull(cur_threshold), "Not muted; no limit override", \
              if(dh_muted==1, "Muted until ".strftime(cur_mute_until, `dh_ui_time_fmt_tz`)." (".coalesce(cur_reason, "-").")", "Not muted")."; ".if(isnotnull(cur_threshold), "limit override ".`dh_ui_secs_words(cur_threshold)`." (".cur_threshold." s)", "no limit override")), \
       ui_after=if(isnotnull(mute_until), "Muted until ".strftime(mute_until, `dh_ui_time_fmt_tz`)." (".coalesce(reason, "-").")", "Not muted")."; ".if(isnotnull(threshold_override_secs), "limit override ".`dh_ui_secs_words(threshold_override_secs)`." (".threshold_override_secs." s)", "no limit override"), \
       dh_label="Apply: ".case(dh_action=="mute", "mute ".dh_item." for ".`dh_ui_secs_words(dh_secs)`, dh_action=="unmute", "unmute ".dh_item, \
                               dh_action=="threshold", "set the limit of ".dh_item." to ".`dh_ui_secs_words(dh_secs)`." (".dh_secs." s)", dh_action=="clear", "clear the limit override of ".dh_item) \
| fields - dh_item dh_logt

# Applies an override plan when dh_confirm (the confirmation, which the dashboard sets with
# eval dh_confirm=$ov_confirm|s$, as macro arguments lose their quotes) matches, then logs it.
[dh_ui_override_write(3)]
args = overrides, admin_log, now
definition = where dh_ok==1 AND dh_token==dh_confirm \
| appendpipe [| table _key entity_id mute_until reason ticket threshold_override_secs set_by set_at | outputlookup append=true key_field=_key override_if_empty=false $overrides$ | where 1==0] \
| `dh_ui_log($admin_log$, $now$)`

# dh_expected plan (add a row, or adopt an unregistered entity). Request: level, index, host,
# sourcetype, source, collection, via, profile, interval_secs, criticality, owner, site, runbook,
# description, reason, ticket, actor, actor_roles, dh_action (add | adopt). Needs admin or dh_admin.
# The row is managed_by=ui and enabled; an enabled UI row is updated and keeps its expected_since;
# a row managed by Ansible is refused (change the inventory instead). The index must be one of
# dh_indexes (the indexes the trackers watch). The token also covers the item's admin-log times
# ($admin_log$), so a confirmation never fits again once its change was applied, even when the
# change left the row as it was (task 12e: a revisited tab or a reload re-runs the write search).
[dh_ui_expected_plan(3)]
args = expected, admin_log, now
definition = `dh_ui_clean(level index host sourcetype source collection via profile interval_secs criticality owner site runbook description reason ticket)` \
| eval level=lower(level), index=lower(index), profile=lower(profile), collection=lower(collection), host=`dh_host_norm(host)`, via=if(isnull(via), null(), `dh_host_norm(via)`), \
       index=if(level=="host", null(), index), sourcetype=if(level=="host", null(), sourcetype), source=if(level=="source", source, null()), \
       interval_secs=tonumber(interval_secs), criticality=tonumber(criticality) \
| eval entity_id=level."|".coalesce(index, "*")."|".host."|".coalesce(sourcetype, "*")."|".if(level=="source", `dh_source_norm(source)`, "*") \
| lookup $expected$ entity_id OUTPUT managed_by AS cur_managed_by enabled AS cur_enabled expected_since AS cur_es profile AS cur_profile criticality AS cur_crit interval_secs AS cur_iv collection AS cur_coll owner AS cur_owner site AS cur_site \
| eval cur_on=if(isnotnull(cur_managed_by) AND NOT match(lower(coalesce(tostring(cur_enabled), "1")), "^ *(0|false|no|off) *$"), 1, 0) \
| lookup $admin_log$ entity_id OUTPUT time AS dh_logt \
| eval dh_logt=mvjoin(mvsort(dh_logt), ",") \
| streamstats count as dh_rid \
| appendpipe [| search index IN (`dh_indexes`) | eval dh_ixrow=1] \
| eventstats max(dh_ixrow) as dh_ixok by dh_rid \
| where isnull(dh_ixrow) \
| eval dh_token=md5(coalesce(dh_logt, "")."#".coalesce(actor, "")."#".coalesce(dh_action, "")."#".entity_id."#".coalesce(collection, "")."#".coalesce(via, "")."#".coalesce(profile, "")."#".coalesce(tostring(interval_secs), "")."#".coalesce(tostring(criticality), "")."#".coalesce(owner, "")."#".coalesce(site, "")."#".coalesce(runbook, "")."#".coalesce(description, "")."#".coalesce(reason, "")."#".coalesce(ticket, "")."#".coalesce(cur_managed_by, "")."#".coalesce(tostring(cur_enabled), "")."#".coalesce(tostring(cur_es), "")."#".coalesce(cur_profile, "")."#".coalesce(tostring(cur_crit), "")."#".coalesce(tostring(cur_iv), "")."#".coalesce(cur_coll, "")."#".coalesce(cur_owner, "")."#".coalesce(cur_site, "")) \
| eval dh_msg=case(isnull(mvfind(actor_roles, "^(admin|dh_admin)$")), "Needs the dh_admin role", \
                   dh_action=="adopt" AND isnull(level), "Choose an unregistered item", \
                   NOT (level=="host" OR level=="sourcetype" OR level=="source"), "Choose a level", \
                   isnull(host) OR NOT match(host, "^[a-z0-9][a-z0-9_-]*$"), "Enter a host name (letters, digits, - and _; a domain is cut off)", \
                   level!="host" AND isnull(dh_ixok), "Choose an index the app watches (see the Index list)", \
                   level!="host" AND isnull(sourcetype), "Enter the sourcetype", \
                   level=="source" AND isnull(source), "Enter the source", \
                   NOT (collection=="uf" OR collection=="syslog" OR collection=="hec"), "Choose how the data arrives (Collection)", \
                   NOT (profile=="heartbeat" OR profile=="periodic" OR profile=="continuous" OR profile=="sporadic" OR profile=="info"), "Choose a profile", \
                   profile=="periodic" AND NOT (interval_secs>0), "A periodic profile needs its interval in seconds", \
                   NOT (criticality>=1 AND criticality<=4), "Criticality is 1 to 4", \
                   isnull(reason), "Write a reason", \
                   cur_on==1 AND lower(cur_managed_by)!="ui", "This item is managed by ".cur_managed_by.": change the Ansible inventory instead"), \
       dh_ok=if(isnull(dh_msg), 1, 0) \
| eval _key=entity_id, managed_by="ui", enabled=1, expected_since=if(cur_on==1 AND isnotnull(tonumber(cur_es)), tonumber(cur_es), $now$) \
| eval before=if(isnull(cur_managed_by), "not expected", "managed_by ".cur_managed_by." / enabled ".coalesce(tostring(cur_enabled), "1")." / profile ".coalesce(cur_profile, "-")." / criticality ".coalesce(tostring(cur_crit), "-")), \
       after="managed_by ui / enabled 1 / profile ".coalesce(profile, "-").if(isnotnull(interval_secs), " ".interval_secs." s", "")." / criticality ".coalesce(tostring(criticality), "-")." / collection ".coalesce(collection, "-"), \
       dh_token=if(dh_ok==1, dh_token, null()), action="expected_".coalesce(dh_action, "add"), check=coalesce(dh_msg, "OK: choose Apply under Confirm to write this change") \
| eval dh_item=if(isnull(level) OR isnull(host) OR (level!="host" AND isnull(sourcetype)) OR (level=="source" AND isnull(source)), null(), `dh_ui_item_words(entity_id)`), \
       ui_change=case(dh_action=="adopt", "Adopt", cur_on==1, "Update expected row", true(), "Add expected row"), ui_item=coalesce(dh_item, "-"), \
       ui_now=if(isnull(cur_managed_by), "Not on the expected list", "On the expected list".if(cur_on==1, "", " but disabled").", managed by ".cur_managed_by.": profile ".coalesce(cur_profile, "-").", criticality ".coalesce(tostring(cur_crit), "-")), \
       ui_after="Expected, managed here (ui): profile ".coalesce(profile, "-").if(isnotnull(interval_secs), " every ".`dh_ui_secs_words(interval_secs)`, "").", criticality ".coalesce(tostring(criticality), "-").", arrives by ".coalesce(collection, "-").if(isnotnull(via), " via ".via, ""), \
       dh_label="Apply: ".if(dh_action=="adopt", "adopt ".dh_item, if(cur_on==1, "update ".dh_item." on the expected list", "add ".dh_item." to the expected list"))." (profile ".profile.", criticality ".criticality.")" \
| fields - dh_item dh_logt dh_rid dh_ixrow dh_ixok

[dh_ui_expected_write(3)]
args = expected, admin_log, now
definition = where dh_ok==1 AND dh_token==dh_confirm \
| appendpipe [| table _key entity_id level index host sourcetype source collection via profile interval_secs criticality owner site runbook description managed_by enabled expected_since | outputlookup append=true key_field=_key override_if_empty=false $expected$ | where 1==0] \
| `dh_ui_log($admin_log$, $now$)`

# Adopt: an unregistered entity_id (from dh_ui_unregistered) -> an expected-row request. A host
# with a UF heartbeat in dh_fwd becomes collection uf (heartbeat profile for its host row), else
# syslog; a sourcetype takes the baseline's suggested profile, else continuous.
[dh_ui_adopt_row(2)]
args = baseline, fwd
definition = eval dh_p=split(entity_id, "|") \
| eval level=mvindex(dh_p, 0), index=mvindex(dh_p, 1), host=mvindex(dh_p, 2), sourcetype=mvindex(dh_p, 3), source=null() \
| lookup $baseline$ entity_id OUTPUT suggested_profile \
| lookup $fwd$ host OUTPUT last_heartbeat AS dh_hb \
| eval collection=if(isnotnull(dh_hb), "uf", "syslog"), profile=case(level=="host" AND isnotnull(dh_hb), "heartbeat", isnotnull(suggested_profile), suggested_profile, true(), "continuous"), dh_action="adopt" \
| fields - dh_p dh_hb suggested_profile

# The test block lives in Cribl (spec 7.7, 7.8): the Manage form no longer writes it, it shows the
# command to run instead. One plan row (dh_ok, dh_action add|remove, k = the key, dh_secs,
# reason) -> command, the ansible-playbook line for the role's cribl_block tag (task 3b). The key goes
# in plain single quotes (the role's documented form): dh_ui_block_plan refuses a key with anything
# that could break out of them or that Ansible would split or template.
[dh_ui_block_command]
definition = eval dh_min=if(isnotnull(dh_secs), max(1, ceiling(dh_secs/60)), 60), \
       dh_rs=replace(coalesce(reason, ""), "[^A-Za-z0-9 _.:/#()-]", ""), \
       command=if(dh_ok==1, "ansible-playbook site.yml --tags cribl_block --limit homepc -e hl_block_key='".k."'".if(dh_action=="remove", " -e hl_block_clear=true", " -e hl_block_minutes=".dh_min." -e \"hl_block_reason='".dh_rs."'\""), null()) \
| fields - dh_min dh_rs

# Test-block plan (hl_ingest_block, spec §7.7). Request: dh_action (add | remove), level (host |
# sourcetype | source), host, target ("<sourcetype>|*" or "<sourcetype>|<raw source>" for the lower
# levels), dh_secs (add: 60 s to 24 h), reason (add: 3-120 of [A-Za-z0-9 _.:/#()-], the role's own rule in
# cribl_block.yml, so a preview that says OK never fails on pi5), actor, actor_roles. There is no ticket:
# the role stores none (final review M6). Needs admin or dh_admin. The key
# k is h|*|*, h|st|* or h|st|<raw source> with h = dh_host_norm(host): level 3 matches the raw
# source exactly, so source_norm is shown next to it only for reference. Nothing is written from
# here (spec 7.7, 7.8: the form shows the role's cribl_block command, dh_ui_block_command).
[dh_ui_block_plan(2)]
args = blocks, now
definition = `dh_ui_clean(dh_action level host target dh_secs reason)` \
| eval dh_req=1, level=lower(level), dh_secs=tonumber(dh_secs), dh_h=`dh_host_norm(host)`, sourcetype=if(level=="host", null(), mvindex(split(target, "|"), 0)), \
       source=if(level=="source", replace(target, "^[^|]*[|]", ""), null()) \
| eval dh_rk=case(level=="host", dh_h."|*|*", level=="sourcetype", dh_h."|".sourcetype."|*", level=="source", dh_h."|".sourcetype."|".source), source_norm=if(level=="source", `dh_source_norm(source)`, null()), \
       dh_rreason=reason \
| fields - k until reason set_by \
| inputlookup append=true $blocks$ \
| eval dh_file=if(isnull(dh_req) AND isnotnull(k), k."#|#".until."#|#".coalesce(reason, "")."#|#".coalesce(set_by, ""), null()) \
| eventstats values(dh_file) as dh_filev \
| where dh_req==1 \
| eval dh_cur=mvindex(mvmap(dh_filev, if(mvindex(split(dh_filev, "#|#"), 0)==dh_rk, dh_filev, null())), 0) \
| eval k=dh_rk, reason=dh_rreason, cur_until=tonumber(mvindex(split(dh_cur, "#|#"), 1)), cur_reason=mvindex(split(dh_cur, "#|#"), 2) \
| eval dh_live=if(cur_until>$now$, 1, 0) \
| eval dh_msg=case(isnull(mvfind(actor_roles, "^(admin|dh_admin)$")), "Needs the dh_admin role", \
                   NOT (dh_action=="add" OR dh_action=="remove"), "Choose Add or Remove", \
                   NOT (level=="host" OR level=="sourcetype" OR level=="source"), "Choose a block level", \
                   isnull(dh_h) OR NOT match(dh_h, "^[a-z0-9][a-z0-9_-]*$"), "Choose a host", \
                   level!="host" AND (isnull(sourcetype) OR sourcetype=="*" OR sourcetype==""), "Choose the sourcetype", \
                   level=="source" AND (isnull(source) OR source=="*" OR source==""), "Choose the raw source", \
                   level!="host" AND match(sourcetype, "[\x60\x24\x27\x22\x5c,|{}\s]"), "This sourcetype has a character the command can't carry safely: block the whole host instead", \
                   level=="source" AND match(source, "[\x60\x24\x27\x22\x5c,|{}\s]"), "This raw source has a character the command can't carry safely: block its sourcetype instead", \
                   isnull(reason), "Write a reason", \
                   dh_action=="add" AND NOT (dh_secs>=60 AND dh_secs<=86400), "A test block lasts 1 minute to 24 hours", \
                   dh_action=="remove" AND dh_live==0, "This has no active test block: nothing to remove", \
                   dh_action=="add" AND NOT match(reason, "^[A-Za-z0-9 _.:/#()-]{3,120}$"), "The reason must be 3 to 120 plain characters (letters digits spaces and _ . : / # ( ) -)"), \
       dh_ok=if(isnull(dh_msg), 1, 0) \
| eval until=if(dh_action=="add", $now$+dh_secs, null()), set_by=actor, \
       before=if(dh_live==1, "blocked until ".strftime(cur_until, `dh_ui_time_fmt`)." (".coalesce(cur_reason, "").")", "not blocked"), \
       after=if(dh_action=="add", "test block until ".strftime(until, `dh_ui_time_fmt`)." (".coalesce(reason, "").")", "not blocked"), \
       entity_id=k, action="block_".coalesce(dh_action, "?"), check=coalesce(dh_msg, "OK: run the command below on pi5") \
| eval dh_item=`dh_ui_block_words(k)`, ui_change=`dh_ui_action_words(action)`, ui_item=coalesce(dh_item, "-"), \
       ui_now=if(dh_live==1, "Blocked until ".strftime(cur_until, `dh_ui_time_fmt_tz`)." (".coalesce(cur_reason, "").")", "Not blocked"), \
       ui_after=if(dh_action=="add", "Blocked until ".strftime(until, `dh_ui_time_fmt_tz`)." (".coalesce(reason, "")."); Cribl applies it about 20 s after the command runs", "Not blocked") \
| fields - dh_req dh_rk dh_file dh_filev dh_cur dh_rreason dh_h dh_item

# One dh_admin_log row per applied plan row (spec §7.8: every write is logged), then the result in
# words (dh_ui_log_words; what is stored is not changed). No row means nothing was applied: the
# confirmation no longer matches the current state.
[dh_ui_log(2)]
args = admin_log, now
definition = eval time=$now$, detail=before." -> ".after \
| table time actor action entity_id detail reason ticket \
| outputlookup append=true override_if_empty=false $admin_log$ \
| `dh_ui_log_words` \
| eval result="Done: ".ui_change." ".ui_item \
| appendpipe [| stats count | where count==0 | eval result="Nothing written: this confirmation fits only the state you previewed, and that state has changed (the change was already applied, the page was reloaded, or someone else changed it). Check the preview and choose Apply again if the change is still needed."] \
| table result time actor ui_change ui_item detail reason ticket entity_id

########## Task 10: the expected list (spec §2.1, §7.2-7.3). DH Sync expected merges the Ansible
# rows (dh_expected_ansible.csv, written by the role's `expected` tag) into dh_expected, the
# authoritative list. An enabled row the Manage dashboard added (managed_by=ui) is never replaced;
# a disabled one may be.

# The Ansible rows, normalized the way dh_ui_expected_plan normalizes a UI row: level lowercase,
# host short and lowercase, index/sourcetype only below host level, the raw source kept for level
# source, entity_id = level|index|host|sourcetype|source_norm (* for unused parts). A row the file
# marks disabled (enabled=0, off, ...) counts as not in the file, so it retires.
[dh_sync_rows(1)]
args = ansible
definition = inputlookup $ansible$ \
| where NOT match(lower(trim(coalesce(tostring(enabled), "1"))), "^(0|false|no|off)$") \
| eval level=lower(coalesce(level, "sourcetype")), profile=lower(profile), collection=lower(collection), host=`dh_host_norm(host)`, \
       via=if(isnull(via) OR via=="", null(), `dh_host_norm(via)`), index=if(level=="host", null(), index), sourcetype=if(level=="host", null(), sourcetype), \
       source=if(level=="source", source, null()), interval_secs=tonumber(interval_secs), max_gap_secs=tonumber(max_gap_secs), criticality=tonumber(criticality) \
| where (level=="host" OR level=="sourcetype" OR level=="source") AND isnotnull(host) \
| eval entity_id=level."|".coalesce(index, "*")."|".host."|".coalesce(sourcetype, "*")."|".if(level=="source", `dh_source_norm(source)`, "*") \
| dedup entity_id

# One signature of the fields Ansible owns, so a row is rewritten only when one of them changed.
[dh_sync_sig]
definition = eval dh_sig=md5(coalesce(level, "")."#".coalesce(index, "")."#".coalesce(host, "")."#".coalesce(sourcetype, "")."#".coalesce(source, "")."#".coalesce(collection, "")."#".coalesce(via, "")."#".coalesce(hypervisor, "")."#".coalesce(profile, "")."#".coalesce(tostring(round(tonumber(interval_secs))), "")."#".coalesce(tostring(round(tonumber(max_gap_secs))), "")."#".coalesce(tostring(round(tonumber(criticality))), "")."#".coalesce(owner, "")."#".coalesce(site, "")."#".coalesce(runbook, "")."#".coalesce(description, ""))

# The rows DH Sync expected writes (KV upserts keyed on entity_id, never the whole table: DH Evaluate
# drops the status of any entity missing from dh_expected), and why (dh_change):
#   add      an Ansible row the list doesn't have, or has disabled (a disabled UI row is replaced)
#   update   an Ansible row whose owned fields changed (expected_since is kept)
#   retire   a row managed_by=ansible that the Ansible file no longer has, or that the file marks
#            disabled: enabled=0 (DH Evaluate then drops its status; a later re-add starts a fresh grace)
# An enabled UI row is never overwritten, even when Ansible adds the same entity. Nothing at all is
# written while the Ansible file has no valid rows, so an empty or broken file can't retire the list.
[dh_sync_plan(3)]
args = ansible, expected, now
definition = `dh_sync_rows($ansible$)` \
| `dh_sync_sig` \
| eval dh_src="a" \
| append [| inputlookup $expected$ | `dh_sync_sig` | eval dh_src="k", dh_en=lower(trim(coalesce(tostring(enabled), "1"))), dh_on=if(dh_en=="0" OR dh_en=="false" OR dh_en=="no" OR dh_en=="off", 0, 1)] \
| eventstats sum(eval(if(dh_src=="a", 1, 0))) as dh_na \
| eventstats max(eval(if(dh_src=="a", 1, 0))) as dh_in_a, max(eval(if(dh_src=="k", dh_on, null()))) as dh_k_on, \
             values(eval(if(dh_src=="k", lower(managed_by), null()))) as dh_k_by, values(eval(if(dh_src=="k", dh_sig, null()))) as dh_k_sig, \
             max(eval(if(dh_src=="k", tonumber(expected_since), null()))) as dh_k_es by entity_id \
| where dh_na>0 \
| eval dh_change=case(dh_src=="a" AND dh_k_by=="ui" AND dh_k_on==1, "none", \
                      dh_src=="a" AND (isnull(dh_k_by) OR dh_k_by!="ansible" OR dh_k_on!=1), "add", \
                      dh_src=="a" AND dh_k_sig!=dh_sig, "update", \
                      dh_src=="k" AND dh_in_a==0 AND lower(managed_by)=="ansible" AND dh_on==1, "retire", \
                      true(), "none") \
| where dh_change!="none" \
| eval _key=entity_id, managed_by="ansible", \
       enabled=if(dh_change=="retire", 0, 1), \
       expected_since=case(dh_change=="retire", tonumber(expected_since), dh_change=="update" AND isnotnull(dh_k_es), dh_k_es, true(), $now$) \
| table _key entity_id level index host sourcetype source collection via hypervisor profile interval_secs max_gap_secs criticality owner site runbook description managed_by enabled expected_since dh_change

# DH Discover unregistered: one summary record per run of what arrives but isn't expected (the
# same rows the Manage "adopt" tab and the Daily SoH list), for trends and the daily report.
[dh_discover_summary(5)]
args = expected, state_fast, state_slow, baseline, now
definition = `dh_ui_unregistered($expected$, $state_fast$, $state_slow$, $baseline$, $now$)` \
| stats count as unregistered, dc(host) as hosts, values(entity_id) as entities \
| eval entities=mvindex(entities, 0, 49), time=$now$
