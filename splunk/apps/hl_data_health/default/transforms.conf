# Lookup definitions for every collection in collections.conf, plus the Ansible-rendered CSV.
# The test-block table hl_ingest_block belongs to hl_server_base (task 3); this app only reads
# it, through the dh_lookup_blocks macro.

[dh_expected_ansible]
filename = dh_expected_ansible.csv

[dh_expected]
external_type = kvstore
collection = dh_expected
fields_list = _key, entity_id, level, index, host, sourcetype, source, collection, via, hypervisor, profile, interval_secs, max_gap_secs, criticality, owner, site, runbook, description, managed_by, enabled, expected_since

[dh_overrides]
external_type = kvstore
collection = dh_overrides
fields_list = _key, entity_id, mute_until, reason, ticket, threshold_override_secs, set_by, set_at

[dh_state_fast]
external_type = kvstore
collection = dh_state_fast
fields_list = _key, index, host, sourcetype, source, first_seen, last_indextime, last_eventtime, last_count, lag, clock_skew, updated

[dh_state_slow]
external_type = kvstore
collection = dh_state_slow
fields_list = _key, index, host, sourcetype, source, first_seen, last_indextime, last_eventtime, last_count, lag, clock_skew, updated

[dh_fwd]
external_type = kvstore
collection = dh_fwd
fields_list = _key, host, guid, version, os, fwd_type, last_heartbeat, last_tcpin, last_marker_action, last_marker_time, last_marker_by, last_marker_run_id, last_vm_event, last_vm_event_time, last_probe_time, last_probe_up, last_probe_reachable, updated

[dh_baseline]
external_type = kvstore
collection = dh_baseline
fields_list = _key, entity_id, learned_gap_secs, days, skipped_days, p90_max_gap_secs, suggested_profile, hourly_median, last_day, updated

[dh_status]
external_type = kvstore
collection = dh_status
fields_list = _key, entity_id, level, index, host, sourcetype, source, collection, via, profile, criticality, owner, site, runbook, description, status, since, prev_status, real_status, real_since, changed, cause_code, cause, action, threshold_secs, threshold_origin, threshold_note, learning, age_secs, last_indextime, last_eventtime, first_seen, lag, clock_skew, muted_until, mute_reason, test_block_until, test_block_reason, host_rollup, liveness, expected_since, evaluated_at

[dh_meta]
external_type = kvstore
collection = dh_meta
fields_list = _key, name, last_run, prev_run, resumed_at, last_rx, rows, fwd_rows, hwm, updated

[dh_admin_log]
external_type = kvstore
collection = dh_admin_log
fields_list = _key, time, actor, action, entity_id, detail, reason, ticket

[dh_tamper]
external_type = kvstore
collection = dh_tamper
fields_list = _key, finding_id, host, time, code, indicator, detail, events, bucket, suppressed, marker_action, marker_time, marker_by, marker_run_id, updated

[dh_volume]
external_type = kvstore
collection = dh_volume
fields_list = _key, entity_id, dh_host, hour, count, median, ratio, flagged, note, updated

# The UF logs only its build, never its version (spike 14.7 e): build -> version for dh_fwd.
# Add a row with each new pinned UF (hl_uf_build / hl_uf_version in the role's defaults).
[dh_uf_builds]
filename = dh_uf_builds.csv
