# hl_data_health scheduled searches (spec §7.3). Task 9: the two trackers and the evaluator.
# Task 11 (below them): baselines, volume, tamper, admin-log copy, prune, the daily report and the
# two alerts. Sync/discovery come in task 10.
# One writer per collection: fast -> dh_state_fast + dh_fwd + dh_meta[tracker_fast],
# slow -> dh_state_slow + dh_meta[tracker_slow], evaluate -> dh_status (+ data_health transitions),
# baseline compute -> dh_baseline, volume -> dh_volume, tamper -> dh_tamper, admin-log copy ->
# dh_meta[admin_copy]. Prune is the one exception: it rewrites a collection to delete rows, and
# only when it has something to delete (see DH Prune).
# Writes are key_field upserts (never a full replace), so readers never see an emptied collection.

[DH Tracker fast]
description = Every minute: last arrival per index/host/sourcetype/source (index-time window, so backfilled events count; spec §14 a), UF heartbeats, tcpin connections, Ansible markers, Hyper-V VM events and device-probe results, merged into dh_state_fast and dh_fwd; run times into dh_meta.
# Macro arguments name the lookups literally (macros can't be nested in arguments).
search = | tstats max(_indextime) as last_indextime max(_time) as last_eventtime min(_indextime) as first_seen count as last_count where index IN (`dh_indexes`) _index_earliest=-5m earliest=-7d latest=+1d by index host sourcetype source \
| `dh_state_merge(dh_state_fast, now())` \
| outputlookup append=true key_field=_key `dh_lookup_state_fast` \
| stats count as state_rows, max(last_indextime) as rx_data \
| appendcols [ \
    | tstats max(_indextime) as hb where index=_internal source=*metrics.log* _index_earliest=-5m earliest=-1h latest=+1d by host splunk_server \
    | `dh_fwd_from_hb` \
    | append [ search index=_internal source=*metrics.log* group=tcpin_connections _index_earliest=-5m earliest=-1h latest=+1d | `dh_fwd_from_tcpin` ] \
    | append [ search index=data_health source="dh:marker" sourcetype="hl:marker" _index_earliest=-5m earliest=-7d latest=+1d | `dh_fwd_from_markers` ] \
    | append [ search index=windows sourcetype=XmlWinEventLog source="XmlWinEventLog:Microsoft-Windows-Hyper-V-Worker-Admin" _index_earliest=-5m earliest=-7d latest=+1d | `dh_fwd_from_hyperv` ] \
    | append [ search index=network sourcetype="hl:devprobe" _index_earliest=-5m earliest=-1d latest=+1d | `dh_fwd_from_probe` ] \
    | `dh_fwd_fold(dh_fwd, now())` \
    | outputlookup append=true key_field=_key `dh_lookup_fwd` \
    | stats count as fwd_rows, max(last_heartbeat) as rx_hb ] \
| eval name="tracker_fast" \
| `dh_meta_fast(dh_meta, now())` \
| outputlookup append=true key_field=_key `dh_lookup_meta`
cron_schedule = * * * * *
enableSched = 1
dispatch.earliest_time = -5m
dispatch.latest_time = now
dispatch.ttl = 2p
max_concurrent = 1
schedule_priority = highest
schedule_window = 0
realtime_schedule = 1
alert.track = 0

[DH Tracker slow]
description = Hourly: last arrival per index/host/sourcetype/source over -7d..+1d by event time, which repopulates state after outages and catches skewed or future-dated time (clock_skew); merged into dh_state_slow.
search = | tstats max(_indextime) as last_indextime max(_time) as last_eventtime min(_indextime) as first_seen count as last_count where index IN (`dh_indexes`) earliest=-7d latest=+1d by index host sourcetype source \
| `dh_state_merge(dh_state_slow, now())` \
| outputlookup append=true key_field=_key `dh_lookup_state_slow` \
| stats count as rows \
| eval name="tracker_slow" \
| lookup `dh_lookup_meta` name OUTPUT last_run AS old_run \
| eval last_run=now(), prev_run=old_run, updated=now(), _key=name \
| fields _key name last_run prev_run rows updated \
| outputlookup append=true key_field=_key `dh_lookup_meta`
cron_schedule = 7 * * * *
enableSched = 1
dispatch.earliest_time = -7d
dispatch.latest_time = +1d
dispatch.ttl = 2p
max_concurrent = 1
schedule_window = 10
alert.track = 0

[DH Evaluate]
description = Every minute: dh_expected joined with max(fast, slow) state, forwarder facts, overrides, baselines, blocks and tamper findings -> status, cause and action per entity in dh_status; changed rows are collected to index=data_health source=dh:transition. Gated to PENDING when the trackers are stale, nothing is received, or within 5 min of a resume. When dh_status holds rows of entities no longer expected, it rewrites dh_status with its own rows (dh_status has this one writer).
search = | `dh_evaluate` \
| outputlookup append=true key_field=_key `dh_lookup_status` \
| appendpipe [| `dh_status_keep(dh_expected, dh_status)` | outputlookup override_if_empty=false `dh_lookup_status` | where 1==0] \
| `dh_transition_rows` \
| `dh_collect_transitions`
cron_schedule = * * * * *
enableSched = 1
dispatch.earliest_time = -1m
dispatch.latest_time = now
dispatch.ttl = 2p
max_concurrent = 1
schedule_priority = highest
schedule_window = 0
realtime_schedule = 1
alert.track = 0

########## Task 11

# Continuous scheduling (realtime_schedule = 0): after PC sleep the scheduler runs the missed
# 02:05 occurrence on wake. Independently of that, every run fills each completed day of the last
# 13 that has no record=day row yet (dh_daily_todo), so a missed night is caught up next time.
# The existing entity records (prev) carry each entity's still-open gap across midnight.
# The windows fit the indexes' 14-day retention (spec §4.4): day -14 began more than 14 days ago,
# so its raw data may be partly frozen and a refill would record a false leading gap; its record,
# while it is still there, is read as the prev of day -13.
[DH Baseline daily]
description = 02:05: per entity and completed day (catching up missed days of the last 13): active minutes, max and p95 gap, count, lag p95 and hourly counts, counting only minutes when Splunk and the host heartbeat were up -> index=data_health source=dh:daily.
search = | tstats count max(_indextime) as it max(_time) as et where index IN (`dh_indexes`) [| search index=data_health source="dh:daily" sourcetype=stash record=day earliest=-14d@d latest=+1d | fields day | `dh_daily_window(now())` | return earliest latest] by _time span=1m index host sourcetype source \
| eval dh_kind="data" \
| append [| tstats count where index=_internal source=*metrics.log* [| search index=data_health source="dh:daily" sourcetype=stash record=day earliest=-14d@d latest=+1d | fields day | `dh_daily_window(now())` | return earliest latest] by _time span=1m host splunk_server | eval dh_kind=if(host==splunk_server, "up", "hb") | fields - splunk_server] \
| append [| search index=data_health source="dh:daily" sourcetype=stash record=day earliest=-14d@d latest=+1d | fields day | `dh_daily_todo(now())` | eval dh_kind="todo" | fields dh_kind day] \
| append [| search index=data_health source="dh:daily" sourcetype=stash record=entity earliest=-14d@d latest=+1d | eval dh_kind="prev" | fields dh_kind day entity_id open_gap_secs] \
| `dh_daily_from_minutes(dh_fwd, dh_expected)` \
| `dh_collect_daily`
cron_schedule = 5 2 * * *
enableSched = 1
realtime_schedule = 0
schedule_window = 30
dispatch.earliest_time = -14d@d
dispatch.latest_time = now
dispatch.ttl = 86400
max_concurrent = 1
alert.track = 0

[DH Baseline compute]
description = 02:30: the last 14 completed days of dh:daily -> dh_baseline (learned gap = 1.5 x p90(daily max gap) + 120 s before the profile clamp, covered days, hourly volume median, suggested profile). Days under 50% covered are skipped.
search = search index=data_health source="dh:daily" sourcetype=stash record=entity earliest=-14d@d latest=+1d \
| `dh_baseline_compute(14, now())` \
| outputlookup append=true key_field=_key override_if_empty=false `dh_lookup_baseline` \
| stats count as entities, sum(eval(if(days>=3, 1, 0))) as learned, sum(eval(if(days<3, 1, 0))) as learning
cron_schedule = 30 2 * * *
enableSched = 1
realtime_schedule = 0
schedule_window = 30
dispatch.earliest_time = -14d@d
dispatch.latest_time = +1d
dispatch.ttl = 86400
max_concurrent = 1
alert.track = 0

[DH Volume hourly]
description = Hourly: the last full hour per entity against its 14-day same-hour median; flagged when below 20% of a median of at least 100 events (and Splunk was up for the hour) -> dh_volume, flagged hours to index=data_health source=dh:volume.
search = | tstats count where index IN (`dh_indexes`) earliest=-1h@h latest=@h by index host sourcetype source \
| eval dh_kind="data" \
| append [| tstats count where index=_internal source=*metrics.log* earliest=-1h@h latest=@h by _time span=1m host splunk_server | where host==splunk_server | stats count as up_minutes | eval dh_kind="up", hour_start=relative_time(now(), "-1h@h")] \
| `dh_volume_flag(dh_baseline, now())` \
| outputlookup append=true key_field=_key override_if_empty=false `dh_lookup_volume` \
| where flagged==1 \
| `dh_collect_volume`
cron_schedule = 3 * * * *
enableSched = 1
schedule_window = 10
dispatch.earliest_time = -1h@h
dispatch.latest_time = @h
dispatch.ttl = 2p
max_concurrent = 1
alert.track = 0

# Index-time window -15m on a 5-minute schedule, so a late or skipped run loses nothing; findings
# are keyed host|code|5-min bucket, so the overlap is upserted. Markers are read over the
# findings' event-time window plus the suppression window, so a backfilled finding meets its
# marker. Every stored finding is re-checked against the markers on each run; the index gets a
# finding of the last 7 days (dh_tamper_lookback_secs) when it is new or its suppression changed,
# judged against what data_health already holds for that finding_id (so a failed collect is
# retried on the next run). The index is read over 14 days, its retention (spec §4.4), which
# covers those 7. An older finding still in dh_tamper (30 days) is never collected again, so one
# whose dh:tamper event aged out of the index can't come back as a new alert.
[DH Tamper]
description = Every 5 min: tamper indicators (Windows 1102/104/1100/4719/4697/7045/7036/7040 and clock steps; Linux auditd DAEMON_END/ABORT, CONFIG_CHANGE, SERVICE_STOP, hl-*/wd2l-* keys and clock steps) -> dh_tamper (every finding, with marker-window suppression re-evaluated each run; the evaluator ignores suppressed ones) and index=data_health source=dh:tamper (new findings and suppression changes).
search = search index=windows sourcetype=XmlWinEventLog _index_earliest=-15m earliest=`dh_tamper_finding_earliest` latest=+1d \
| `dh_tamper_win` \
| append [search index=linux (sourcetype=linux_audit OR "System clock was stepped") _index_earliest=-15m earliest=`dh_tamper_finding_earliest` latest=+1d | `dh_tamper_linux`] \
| append [search index=data_health source="dh:marker" sourcetype="hl:marker" earliest=`dh_tamper_marker_earliest` latest=+1d | eval dh_kind="marker"] \
| append [search index=data_health source="dh:tamper" sourcetype=stash earliest=-14d latest=+1d | eval dh_kind="index" | fields _time dh_kind finding_id suppressed] \
| `dh_tamper_finish(dh_tamper, now())` \
| outputlookup append=true key_field=_key override_if_empty=false `dh_lookup_tamper` \
| where dh_new==1 \
| `dh_tamper_collect_rows` \
| `dh_collect_tamper`
cron_schedule = */5 * * * *
enableSched = 1
schedule_window = 0
dispatch.earliest_time = -7d
dispatch.latest_time = +1d
dispatch.ttl = 2p
max_concurrent = 1
alert.track = 0

[DH Admin log copy]
description = Every 5 min: new dh_admin_log rows (after the high-water mark in dh_meta[admin_copy], at least 60 s old) -> index=data_health source=dh:admin.
search = | inputlookup `dh_lookup_admin_log` \
| `dh_admin_copy_rows(dh_meta, now())` \
| `dh_collect_admin` \
| stats max(time) as hwm, count as rows \
| where rows>0 \
| eval name="admin_copy", _key=name, last_run=now(), updated=now() \
| fields _key name last_run hwm rows updated \
| outputlookup append=true key_field=_key override_if_empty=false `dh_lookup_meta`
cron_schedule = */5 * * * *
enableSched = 1
schedule_window = 2
dispatch.earliest_time = -5m
dispatch.latest_time = now
dispatch.ttl = 2p
max_concurrent = 1
alert.track = 0

# Deleting rows needs a full rewrite (SPL can't delete one KV record). Each table is counted
# first and rewritten (map) only when something changed, with override_if_empty=true so an
# all-expired table is emptied; an unchanged table is never touched. hl_ingest_block (task 3,
# hl_server_base) is read with append=true, so before it exists this finds nothing.
[DH Prune]
description = Every minute: expired test blocks out of hl_ingest_block (full rewrite ending in table k until reason set_by, spec §7.7) and expired mutes out of dh_overrides, only when there is something to prune.
search = | makeresults | eval dh_seed=1 \
| inputlookup append=true `dh_lookup_blocks` \
| where isnull(dh_seed) \
| `dh_prune_mark_blocks(now())` \
| stats sum(dh_change) as n \
| where n>0 \
| map maxsearches=1 search="| inputlookup hl_ingest_block | `dh_prune_mark_blocks(now())` | where dh_drop==0 | table k until reason set_by | outputlookup override_if_empty=true hl_ingest_block | stats count as kept | eval changed=$n$, collection=\"hl_ingest_block\"" \
| append [| inputlookup `dh_lookup_overrides` | `dh_prune_mark_overrides(now())` | stats sum(dh_change) as n | where n>0 \
  | map maxsearches=1 search="| inputlookup dh_overrides | `dh_prune_mark_overrides(now())` | where dh_drop==0 | fields - dh_drop dh_change _user | outputlookup override_if_empty=true dh_overrides | stats count as kept | eval changed=$n$, collection=\"dh_overrides\""]
cron_schedule = * * * * *
enableSched = 1
schedule_window = 0
dispatch.earliest_time = -1m
dispatch.latest_time = now
dispatch.ttl = 2p
max_concurrent = 1
schedule_priority = highest
alert.track = 0

# Daily, at a quiet time. For each collection: count the rows its dh_prune_mark_<collection>
# macro drops, then (map) rewrite only the collections with something to drop.
[DH Prune daily]
description = Daily 03:17: stale state, forwarder rows, old tamper findings, volume rows, baselines and copied admin-log rows. (dh_status rows of entities no longer expected are dropped by DH Evaluate, dh_status's one writer.)
search = | makeresults \
| eval coll=split("dh_state_fast dh_state_slow dh_fwd dh_tamper dh_volume dh_baseline dh_admin_log", " ") \
| mvexpand coll \
| fields coll \
| map maxsearches=10 search="| inputlookup $coll$ | `dh_prune_mark_$coll$` | stats sum(dh_change) as n, count as total | eval coll=\"$coll$\"" \
| where n>0 \
| map maxsearches=10 search="| inputlookup $coll$ | `dh_prune_mark_$coll$` | where dh_drop==0 | fields - dh_drop dh_change _user | outputlookup override_if_empty=true $coll$ | stats count as kept | eval collection=\"$coll$\", dropped=$n$, before=$total$"
cron_schedule = 17 3 * * *
enableSched = 1
schedule_window = 30
dispatch.earliest_time = -1m
dispatch.latest_time = now
dispatch.ttl = 86400
max_concurrent = 1
alert.track = 0

[DH Daily SoH report]
description = 07:00: the daily state of health (spec §8.4): outages in 24 h with durations and MTTR, flapping, never-seen, invalid profiles, forwarders off version or disconnected, lag p95, volume flags, licence usage and expiry, skipped searches, active and expiring mutes -> index=data_health source=dh:soh (one row per item: section, item, value).
search = search index=data_health source="dh:transition" sourcetype=stash earliest=-7d latest=+1d \
| `dh_soh_outages(dh_status, now())` \
| append [search index=data_health source="dh:transition" sourcetype=stash earliest=-24h latest=+1d | `dh_soh_flapping(now())`] \
| append [| inputlookup `dh_lookup_status` | `dh_soh_status`] \
| append [| inputlookup `dh_lookup_fwd` | `dh_soh_fwd(now())`] \
| append [| inputlookup `dh_lookup_overrides` | `dh_soh_mutes(now())`] \
| append [search index=data_health source="dh:daily" sourcetype=stash record=entity earliest=-3d latest=+1d | `dh_soh_lag`] \
| append [search index=data_health source="dh:volume" sourcetype=stash earliest=-24h latest=+1d | `dh_soh_volume(now())`] \
| append [search index=_internal source=*license_usage.log* type=Usage earliest=-1d@d latest=@d | stats sum(b) as b | eval kind="usage" | append [| rest splunk_server=local /services/licenser/licenses | eval kind="license" | fields kind title group_id status quota expiration_time] | append [| rest splunk_server=local /services/licenser/groups | eval kind="group" | fields kind title is_active] | `dh_soh_licence(now())`] \
| append [search index=_internal sourcetype=scheduler app=hl_data_health earliest=-24h latest=now | `dh_soh_skipped`] \
| eval report_time=now(), _time=now() \
| `dh_collect_soh`
cron_schedule = 0 7 * * *
enableSched = 1
realtime_schedule = 0
schedule_window = 30
dispatch.earliest_time = -7d
dispatch.latest_time = +1d
dispatch.ttl = 86400
max_concurrent = 1
alert.track = 0

# Alerts: one alert per result (digest off), throttled per entity for 1 h. Actions: Triggered
# Alerts (alert.track) and a log event into data_health (source=dh:alert). Email can be added in
# local/ once SMTP is set up. The transition window overlaps the 1-minute cadence; throttling
# drops the repeats.
[DH Alert missing]
description = An expected entity with criticality 1-2 (unset counts as 2) went MISSING (from index=data_health source=dh:transition). Throttled per entity_id for 1 h.
search = search index=data_health source="dh:transition" sourcetype=stash status=MISSING _index_earliest=-3m earliest=-1d latest=+1d \
| `dh_alert_missing_rows`
cron_schedule = * * * * *
enableSched = 1
schedule_window = 0
dispatch.earliest_time = -1d
dispatch.latest_time = +1d
dispatch.ttl = 2p
max_concurrent = 1
schedule_priority = highest
counttype = number of events
relation = greater than
quantity = 0
alert.digest_mode = 0
alert.suppress = 1
alert.suppress.fields = entity_id
alert.suppress.period = 1h
alert.severity = 5
alert.track = 1
alert.expires = 7d
action.logevent = 1
action.logevent.param.index = data_health
action.logevent.param.source = dh:alert
action.logevent.param.sourcetype = stash
action.logevent.param.host = $result.dh_host$
action.logevent.param.event = dh_alert=missing entity_id="$result.entity_id$" dh_host="$result.dh_host$" status=$result.status$ prev_status=$result.prev_status$ criticality=$result.alert_criticality$ cause_code=$result.cause_code$ cause="$result.cause$" action="$result.action$"

[DH Alert tamper]
description = A new tamper finding outside any Ansible marker window (from index=data_health source=dh:tamper): possible deliberate blinding, escalate. Throttled per host and indicator code for 1 h, so a reboot finding cannot hide a later log clear.
search = search index=data_health source="dh:tamper" sourcetype=stash _index_earliest=-10m earliest=-14d latest=+1d \
| `dh_alert_tamper_rows`
cron_schedule = 1-59/5 * * * *
enableSched = 1
schedule_window = 0
dispatch.earliest_time = -14d
dispatch.latest_time = +1d
dispatch.ttl = 2p
max_concurrent = 1
counttype = number of events
relation = greater than
quantity = 0
alert.digest_mode = 0
alert.suppress = 1
alert.suppress.fields = dh_host,code
alert.suppress.period = 1h
alert.severity = 5
alert.track = 1
alert.expires = 7d
action.logevent = 1
action.logevent.param.index = data_health
action.logevent.param.source = dh:alert
action.logevent.param.sourcetype = stash
action.logevent.param.host = $result.dh_host$
action.logevent.param.event = dh_alert=tamper finding_id="$result.finding_id$" dh_host="$result.dh_host$" code=$result.code$ indicator="$result.indicator$" events=$result.events$

# Task 10 (spec §7.3): the expected list. The role's `expected` tag also runs DH Sync expected
# right after it pushes the file, so a deploy shows its rows within seconds.
[DH Sync expected]
description = Every 5 min: merges the Ansible rows (dh_expected_ansible.csv, from the expected tag) into dh_expected. Adds new rows, updates changed ones (expected_since kept), retires Ansible rows no longer in the file (enabled=0); an enabled UI row is never replaced (a disabled one may be), and an empty file changes nothing.
search = | `dh_sync_plan(dh_expected_ansible, dh_expected, now())` \
| appendpipe [| fields - dh_change | outputlookup append=true key_field=_key override_if_empty=false dh_expected | where 1==0] \
| stats count as written, values(dh_change) as changes
cron_schedule = */5 * * * *
enableSched = 1
schedule_window = 0
dispatch.earliest_time = -1m
dispatch.latest_time = now
dispatch.ttl = 2p
max_concurrent = 1
alert.track = 0

[DH Discover unregistered]
description = Every 15 min: one record (index=data_health source=dh:discover) of the hosts and sourcetypes that arrive but are not expected, for the daily report and trends.
search = | `dh_discover_summary(dh_expected, dh_state_fast, dh_state_slow, dh_baseline, now())` \
| eval _time=time, entities=mvjoin(entities, " ") \
| collect index=data_health source=dh:discover sourcetype=stash
cron_schedule = */15 * * * *
enableSched = 1
schedule_window = 5
dispatch.earliest_time = -1m
dispatch.latest_time = now
dispatch.ttl = 2p
max_concurrent = 1
alert.track = 0
