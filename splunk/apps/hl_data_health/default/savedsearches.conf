# hl_data_health scheduled searches, task 9 part (spec §7.3): the two trackers and the evaluator.
# Sync/discovery come in task 10; baselines, volume, tamper, prune, alerts and the report in 11.
# One writer per collection: fast -> dh_state_fast + dh_fwd + dh_meta[tracker_fast],
# slow -> dh_state_slow + dh_meta[tracker_slow], evaluate -> dh_status (+ data_health transitions).
# Writes are key_field upserts (never a full replace), so readers never see an emptied collection.

[DH Tracker fast]
description = Every minute: last arrival per index/host/sourcetype/source (index-time window, so backfilled events count; spec §14 a), UF heartbeats, tcpin connections, Ansible markers, Hyper-V VM events and device-probe results, merged into dh_state_fast and dh_fwd; run times into dh_meta.
search = | tstats max(_indextime) as last_indextime max(_time) as last_eventtime min(_indextime) as first_seen count as last_count where index IN (`dh_indexes`) _index_earliest=-5m earliest=-7d latest=+1d by index host sourcetype source \
| eval host=`dh_host_norm(host)`, source=`dh_source_norm(source)`, dh_fresh=1 \
| inputlookup append=true `dh_lookup_state_fast` \
| eval last_count=if(dh_fresh==1, last_count, 0) \
| stats max(dh_fresh) as dh_fresh, max(last_indextime) as last_indextime, max(last_eventtime) as last_eventtime, min(first_seen) as first_seen, sum(last_count) as last_count by index host sourcetype source \
| where dh_fresh==1 \
| eval lag=last_indextime-last_eventtime, clock_skew=if(abs(lag)>`dh_skew_secs`, 1, 0), updated=now(), _key=index."|".host."|".sourcetype."|".source \
| fields _key index host sourcetype source first_seen last_indextime last_eventtime last_count lag clock_skew updated \
| outputlookup append=true key_field=_key `dh_lookup_state_fast` \
| stats count as state_rows, max(last_indextime) as rx_data \
| appendcols [ \
    | tstats max(_indextime) as hb where index=_internal source=*metrics.log* _index_earliest=-5m earliest=-1h latest=+1d by host splunk_server \
    | where host!=splunk_server \
    | eval host=`dh_host_norm(host)` \
    | fields host hb \
    | append [ search index=_internal source=*metrics.log* group=tcpin_connections _index_earliest=-5m earliest=-1h latest=+1d \
        | eval host=`dh_host_norm(coalesce(hostname, sourceHost))` \
        | stats max(_time) as tcpin, latest(guid) as guid, latest(version) as version, latest(os) as os, latest(fwdType) as fwd_type by host ] \
    | append [ search index=data_health source="dh:marker" sourcetype="hl:marker" _index_earliest=-5m earliest=-7d latest=+1d \
        | eval host=`dh_host_norm(target_host)`, mk=tostring(floor(_time))."#|#".action."#|#".coalesce('by', "")."#|#".coalesce(run_id, "") \
        | stats max(mk) as mk by host ] \
    | append [ search index=windows sourcetype=XmlWinEventLog source="XmlWinEventLog:Microsoft-Windows-Hyper-V-Worker-Admin" _index_earliest=-5m earliest=-7d latest=+1d \
        | rex "<EventID[^>]*>(?<dh_ev>[0-9]+)</EventID>" \
        | rex "<VmName>(?<dh_vm>[^<]+)</VmName>" \
        | where isnotnull(dh_vm) AND (dh_ev=="18500" OR dh_ev=="18502" OR dh_ev=="18504" OR dh_ev=="18508" OR dh_ev=="18510" OR dh_ev=="18514") \
        | eval host=`dh_host_norm(dh_vm)`, vm=tostring(floor(_time))."#|#".dh_ev \
        | stats max(vm) as vm by host ] \
    | append [ search index=network sourcetype="hl:devprobe" _index_earliest=-5m earliest=-1d latest=+1d \
        | eval host=`dh_host_norm(coalesce(device, host))`, up=if(tonumber(reachable)==1, _time, null()), pr=tostring(floor(_time))."#|#".coalesce(reachable, "") \
        | stats max(_time) as probe_time, max(up) as probe_up, max(pr) as pr by host ] \
    | eval dh_fresh=1 \
    | inputlookup append=true `dh_lookup_fwd` \
    | eval hb=coalesce(hb, last_heartbeat), tcpin=coalesce(tcpin, last_tcpin), probe_time=coalesce(probe_time, last_probe_time), probe_up=coalesce(probe_up, last_probe_up), \
           mk=coalesce(mk, if(isnotnull(last_marker_time), tostring(last_marker_time)."#|#".last_marker_action."#|#".coalesce(last_marker_by, "")."#|#".coalesce(last_marker_run_id, ""), null())), \
           vm=coalesce(vm, if(isnotnull(last_vm_event_time), tostring(last_vm_event_time)."#|#".last_vm_event, null())), \
           pr=coalesce(pr, if(isnotnull(last_probe_time), tostring(last_probe_time)."#|#".coalesce(last_probe_reachable, ""), null())) \
    | stats max(dh_fresh) as dh_fresh, max(hb) as last_heartbeat, max(tcpin) as last_tcpin, first(guid) as guid, first(version) as version, first(os) as os, first(fwd_type) as fwd_type, \
            max(mk) as mk, max(vm) as vm, max(pr) as pr, max(probe_time) as last_probe_time, max(probe_up) as last_probe_up by host \
    | where dh_fresh==1 \
    | eval last_marker_time=tonumber(mvindex(split(mk, "#|#"), 0)), last_marker_action=mvindex(split(mk, "#|#"), 1), last_marker_by=mvindex(split(mk, "#|#"), 2), last_marker_run_id=mvindex(split(mk, "#|#"), 3), \
           last_vm_event_time=tonumber(mvindex(split(vm, "#|#"), 0)), last_vm_event=tonumber(mvindex(split(vm, "#|#"), 1)), \
           last_probe_reachable=tonumber(mvindex(split(pr, "#|#"), 1)), updated=now(), _key=host \
    | fields _key host guid version os fwd_type last_heartbeat last_tcpin last_marker_action last_marker_time last_marker_by last_marker_run_id last_vm_event last_vm_event_time last_probe_time last_probe_up last_probe_reachable updated \
    | outputlookup append=true key_field=_key `dh_lookup_fwd` \
    | stats count as fwd_rows, max(last_heartbeat) as rx_hb ] \
| eval name="tracker_fast" \
| lookup `dh_lookup_meta` name OUTPUT last_run AS old_run, resumed_at AS old_resumed, last_rx AS old_rx \
| eval last_run=now(), prev_run=old_run, \
       resumed_at=if(isnull(old_run) OR last_run-old_run>`dh_resume_gap_secs`, last_run, old_resumed), \
       last_rx=max(coalesce(rx_data, 0), coalesce(rx_hb, 0), coalesce(old_rx, 0)), last_rx=if(last_rx>0, last_rx, null()), \
       rows=state_rows, updated=now(), _key=name \
| fields _key name last_run prev_run resumed_at last_rx rows fwd_rows updated \
| outputlookup append=true key_field=_key `dh_lookup_meta`
cron_schedule = * * * * *
enableSched = 1
dispatch.earliest_time = -5m
dispatch.latest_time = now
dispatch.ttl = 2p
max_concurrent = 1
schedule_priority = highest
schedule_window = 0
realtime_schedule = 1
alert.track = 0

[DH Tracker slow]
description = Hourly: last arrival per index/host/sourcetype/source over -7d..+1d by event time, which repopulates state after outages and catches skewed or future-dated time (clock_skew); merged into dh_state_slow.
search = | tstats max(_indextime) as last_indextime max(_time) as last_eventtime min(_indextime) as first_seen count as last_count where index IN (`dh_indexes`) earliest=-7d latest=+1d by index host sourcetype source \
| eval host=`dh_host_norm(host)`, source=`dh_source_norm(source)`, dh_fresh=1 \
| inputlookup append=true `dh_lookup_state_slow` \
| eval last_count=if(dh_fresh==1, last_count, 0) \
| stats max(dh_fresh) as dh_fresh, max(last_indextime) as last_indextime, max(last_eventtime) as last_eventtime, min(first_seen) as first_seen, sum(last_count) as last_count by index host sourcetype source \
| where dh_fresh==1 \
| eval lag=last_indextime-last_eventtime, clock_skew=if(abs(lag)>`dh_skew_secs`, 1, 0), updated=now(), _key=index."|".host."|".sourcetype."|".source \
| fields _key index host sourcetype source first_seen last_indextime last_eventtime last_count lag clock_skew updated \
| outputlookup append=true key_field=_key `dh_lookup_state_slow` \
| stats count as rows \
| eval name="tracker_slow" \
| lookup `dh_lookup_meta` name OUTPUT last_run AS old_run \
| eval last_run=now(), prev_run=old_run, updated=now(), _key=name \
| fields _key name last_run prev_run rows updated \
| outputlookup append=true key_field=_key `dh_lookup_meta`
cron_schedule = 7 * * * *
enableSched = 1
dispatch.earliest_time = -7d
dispatch.latest_time = +1d
dispatch.ttl = 2p
max_concurrent = 1
schedule_window = 10
alert.track = 0

[DH Evaluate]
description = Every minute: dh_expected joined with max(fast, slow) state, forwarder facts, overrides, baselines, blocks and tamper findings -> status, cause and action per entity in dh_status; changed rows are collected to index=data_health source=dh:transition. Gated to PENDING when the trackers are stale, nothing is received, or within 5 min of a resume.
search = | `dh_evaluate` \
| outputlookup append=true key_field=_key `dh_lookup_status` \
| `dh_transition_rows` \
| `dh_collect_transitions`
cron_schedule = * * * * *
enableSched = 1
dispatch.earliest_time = -1m
dispatch.latest_time = now
dispatch.ttl = 2p
max_concurrent = 1
schedule_priority = highest
schedule_window = 0
realtime_schedule = 1
alert.track = 0
