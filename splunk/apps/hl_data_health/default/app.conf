# hl_data_health: "am I blind somewhere?" (spec §7). Pure SPL + KV store, no custom code.
# No is_configured: the app has no setup page, and AppInspect fails an app that ships it (task 14).
[install]
state = enabled

[id]
name = hl_data_health
version = 0.1.0

[ui]
# Visible since task 12 (the dashboards: Overview, Host detail, Manage, Daily state of health).
is_visible = true
label = HL Data Health

[launcher]
author = homelab
description = Expected-data health: trackers, evaluator, statuses, likely causes and next steps.
version = 0.1.0

[package]
id = hl_data_health
check_for_updates = false

# Role-owned marker: apps_remove deletes only apps with this flag (spec §5.5).
[hl]
managed = true
